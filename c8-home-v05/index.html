<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<meta name="description" content="크리에이터클럽 홈 화면을 와이어프레임과 디자인 시안 두 가지로 비교해 보는 페이지예요.">
<title>C8 홈 v0.5</title>
<link rel="preconnect" href="https://cdn.jsdelivr.net" crossorigin>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css">
<style>
:root{
  --bar:48px;--bg:#F4F5F6;--surface:#FFFFFF;--ink:#191F28;--ink-2:#4E5968;--ink-3:#6B7684;--line:rgba(0,0,0,.08);
  --seg:#E8EAED;--seg-on:#191F28;--seg-on-ink:#FFFFFF;--accent:#07ED21;
  color-scheme:light;
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){--bg:#0A0A0A;--surface:#121212;--ink:#F5F5F5;--ink-2:#A8A8A8;--ink-3:#888888;--line:rgba(255,255,255,.08);--seg:#202020;--seg-on:#F5F5F5;--seg-on-ink:#121212;color-scheme:dark}
}
:root[data-theme="dark"]{--bg:#0A0A0A;--surface:#121212;--ink:#F5F5F5;--ink-2:#A8A8A8;--ink-3:#888888;--line:rgba(255,255,255,.08);--seg:#202020;--seg-on:#F5F5F5;--seg-on-ink:#121212;color-scheme:dark}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{background:var(--bg);color:var(--ink);font-family:"Pretendard Variable",Pretendard,-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Noto Sans KR",sans-serif;-webkit-font-smoothing:antialiased;overflow:hidden;letter-spacing:-.01em}
.bar{position:fixed;inset:0 0 auto;height:var(--bar);z-index:10;display:flex;align-items:center;justify-content:space-between;gap:12px;padding:0 16px;background:var(--surface);border-bottom:1px solid var(--line)}
.ver{font-size:12px;font-weight:600;color:var(--ink-3);white-space:nowrap}
.seg{display:flex;padding:3px;border-radius:999px;background:var(--seg)}
.seg button{border:0;background:none;font:inherit;font-size:13px;font-weight:600;color:var(--ink-2);height:30px;padding:0 14px;border-radius:999px;cursor:pointer;white-space:nowrap;transition:background-color .2s,color .2s}
.seg button[aria-pressed="true"]{background:var(--seg-on);color:var(--seg-on-ink)}
.seg button:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.seg .sp{display:none}
@media (min-width:1280px){.seg .sp{display:block}}
.sp-r{width:72px}
@media (max-width:420px){.sp-r{display:none}.seg button{padding:0 12px}}
.views{position:fixed;inset:var(--bar) 0 0;display:flex}
.views iframe{border:0;width:100%;height:100%;display:none;background:#121212}
.views[data-v="wire"] .fw,.views[data-v="design"] .fd{display:block}
.views[data-v="split"] iframe{display:block;width:50%}
.views[data-v="split"] .fw{border-right:1px solid var(--line)}
.views .fw{background:#fff}
</style>
</head>
<body>
<div class="bar">
  <span class="ver">C8 홈 v0.5</span>
  <div class="seg" role="group" aria-label="보기 전환">
    <button type="button" data-v="wire" aria-pressed="false">와이어프레임</button>
    <button type="button" data-v="design" aria-pressed="true">디자인 시안</button>
    <button type="button" data-v="split" class="sp" aria-pressed="false">나란히 보기</button>
  </div>
  <span class="sp-r" aria-hidden="true"></span>
</div>
<main class="views" data-v="design">
  <iframe class="fw" src="wire.html" title="와이어프레임"></iframe>
  <iframe class="fd" src="design.html" title="디자인 시안"></iframe>
</main>
<script>
(function(){
  var views=document.querySelector('.views'), btns=[].slice.call(document.querySelectorAll('.seg button'));
  var fw=document.querySelector('.fw'), fd=document.querySelector('.fd');
  var wide=matchMedia('(min-width: 1280px)'), KEY='c8-home-v05-view', ok={wire:1,design:1,split:1};
  function stored(){try{return localStorage.getItem(KEY);}catch(e){return null;}}
  function store(v){try{localStorage.setItem(KEY,v);}catch(e){}}
  function frameOf(v){return v==='wire'?fw:fd;}
  /* 지금 보는 장면을 찾아 다른 보기도 같은 장면으로 맞춘다 */
  function sceneOf(f){
    try{var w=f.contentWindow,doc=f.contentDocument,mid=w.innerHeight/2,s=doc.querySelectorAll('section[id]');
      for(var i=0;i<s.length;i++){var r=s[i].getBoundingClientRect(); if(r.top<=mid&&r.bottom>mid)return s[i].id;}}catch(e){}
    return null;
  }
  function goScene(f,id){
    if(!id)return;
    try{var el=f.contentDocument.getElementById(id); if(el){var w=f.contentWindow; w.scrollTo(0,el.getBoundingClientRect().top+w.pageYOffset);}}catch(e){}
  }
  var cur=null;
  function set(v,push){
    if(!ok[v])v='design';
    if(v==='split'&&!wide.matches)v='design';
    var from=cur&&cur!=='split'?frameOf(cur):(cur==='split'?fd:null), id=from?sceneOf(from):null;
    cur=v; views.setAttribute('data-v',v);
    btns.forEach(function(b){b.setAttribute('aria-pressed',String(b.getAttribute('data-v')===v));});
    if(id){ setTimeout(function(){ if(v==='split'){goScene(fw,id);goScene(fd,id);} else if(frameOf(v)!==from) goScene(frameOf(v),id); },180); }
    store(v);
    if(push!==false&&location.hash!=='#'+v){try{history.replaceState(null,'','#'+v);}catch(e){location.hash=v;}}
    document.title=(v==='wire'?'와이어프레임':v==='split'?'나란히 보기':'디자인 시안')+' · C8 홈 v0.5';
  }
  btns.forEach(function(b){b.addEventListener('click',function(){set(b.getAttribute('data-v'));});});
  addEventListener('hashchange',function(){set(location.hash.slice(1),false);});
  wide.addEventListener&&wide.addEventListener('change',function(){if(cur==='split'&&!wide.matches)set('design');});
  var h=location.hash.slice(1);
  set(ok[h]?h:(stored()||'design'),true);
})();
</script>
</body>
</html>
