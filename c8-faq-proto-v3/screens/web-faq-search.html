<style>body{margin:0;background:#2a2a2a}
.c8-web-page{word-break:keep-all;overflow-wrap:break-word}</style><style

.faq2-tabs{position:sticky;top:105px;z-index:5;background:var(--bgBase);margin-top:12px;box-shadow:inset 0 -1px 0 var(--lineOverlaySubtle)}
.faq2-tabs__row{display:flex;gap:20px;padding:0 16px;overflow-x:auto;scrollbar-width:none;-webkit-overflow-scrolling:touch}

.faq2-tab{flex:none;height:44px;display:flex;align-items:center;position:relative;font:var(--font-bodyMdBold);letter-spacing:var(--tracking-bodyMdBold);color:var(--textTertiary);white-space:nowrap;cursor:pointer;border:0;background:none;padding:0}
.faq2-tab.is-selected{color:var(--textPrimary)}
.faq2-tab.is-selected::after{content:"";position:absolute;left:0;right:0;bottom:0;height:2px;background:var(--lineDefault)}
.faq2-count{padding:16px 16px 4px;font:var(--font-labelMd);letter-spacing:var(--tracking-labelMd);color:var(--textTertiary)}
.faq2-list{padding:4px 0 0}
.faq2-q{border-bottom:1px solid var(--lineOverlaySubtle)}
.faq2-q__btn{display:flex;align-items:center;gap:12px;width:100%;padding:16px;border:0;background:none;text-align:left;cursor:pointer;color:inherit;font:inherit}
.faq2-q__btn:active{background:rgba(255,255,255,.04)}
.faq2-q__txt{flex:1;min-width:0}
.faq2-q__cat{display:block;margin-bottom:4px;font:var(--font-labelMd);letter-spacing:var(--tracking-labelMd);color:var(--textTertiary)}
.faq2.is-cat .faq2-q__cat{display:none}
.faq2-q__title{display:block;font:var(--font-bodyMdBold);letter-spacing:var(--tracking-bodyMdBold);color:var(--textPrimary);word-break:keep-all}
.faq2-q__title mark{background:none;color:var(--textBrand,#20EF35)}
.faq2-q__arrow{width:20px;height:20px;flex:none;opacity:.6;transition:transform .25s ease}
.faq2-q.is-open .faq2-q__arrow{transform:rotate(180deg)}
.faq2-q__panel{display:grid;grid-template-rows:0fr;transition:grid-template-rows .28s ease}
.faq2-q.is-open .faq2-q__panel{grid-template-rows:1fr}
.faq2-q__panel>div{overflow:hidden}
.faq2-a{margin:0 16px 16px;padding:16px;border-radius:var(--radius-12,12px);background:var(--bgSurface)}
.faq2-rel{margin-top:16px;padding-top:12px;border-top:1px solid var(--lineOverlaySubtle)}
.faq2-rel__h{font:var(--font-labelMd);letter-spacing:var(--tracking-labelMd);color:var(--textTertiary);margin:0 0 4px}
.faq2-rel a{display:flex;align-items:center;justify-content:space-between;gap:8px;padding:8px 0;font:var(--font-bodySmBold);letter-spacing:var(--tracking-bodySmBold);color:var(--textPrimary);text-decoration:none;cursor:pointer}
.faq2-rel a img{width:16px;height:16px;opacity:.5;flex:none}
.faq2-empty{padding:56px 16px;text-align:center;font:var(--font-bodySm);color:var(--textTertiary);display:none}
.faq2.is-empty .faq2-empty{display:block}
.faq2-more{margin:32px 16px 0;padding:20px 16px;border-radius:var(--radius-12,12px);background:var(--bgSurface);text-align:center}
.faq2-more p{margin:0 0 12px;font:var(--font-bodySm);color:var(--textSecondary)}
.faq2.is-search .faq2-tabs{display:none}
.faq2-q__btn .faq2-q__arrow{width:16px;height:16px;opacity:.45}

rx="1.5"/></g></svg></div><div class="c8-web-page faq2" data-q="비밀번호" data-view="web: FaqPage (/faq)"><div style="height:105px"></div><div class="faq2-intro" data-view="자주 묻는 질문 머리 소개"><h1 class="t-headingMd" style="margin:0;color:var(--textPrimary)">당신의 작업이 무대가 되는 곳</h1><div style="height:8px"></div><p class="t-bodySm" style="margin:0;color:var(--textSecondary)">크리에이터클럽은 작업을 알리고, 공감하는 크리에이터를 만나고, 함께 일할 사람을 찾는 앱이에요.</p></div><div class="faq2-search" data-view="질문 검색"><label class="c8-searchbar__field"><img class="ic" src="../assets/icons/search_white@3x.png" alt=""><input type="search" id="q" placeholder="찾는 질문을 검색해 보세요" autocomplete="off" enterkeyhint="search"><button class="clr" type="button" id="clr" aria-label="지우기" style="cursor:pointer" data-press="지우기 → 검색어를 지우고 고른 탭 목록으로"><img src="../assets/icons/small_close_circle@3x.png" alt=""></button></label></div><div class="faq2-tabs" data-view="카테고리 탭"><div class="faq2-tabs__row" id="tabs"></div></div><div class="faq2-count" id="count"></div><div class="faq2-list" id="list"></div><div class="faq2-empty" id="empty">검색 결과가 없어요.<br>검색어를 바꿔 다시 찾아보세요.</div><div class="faq2-more" data-view="문의 안내"><p>찾는 답이 없나요?</p><span class="c8-pill-button" data-go-screen="setting-support-email-alert" style="height:40px;line-height:40px;padding:0 20px;cursor:pointer" data-press="이메일 문의 → 고객센터 이메일 문의 안내">이메일 문의</span></div><div style="height:48px"></div></div><div class="c8-nav" style="z-index:20;position:absolute;left:0;top:47px;right:0;gap:normal" data-view="CommonWebView 머리(앱)"><span data-back="1" class="c8-glass-circle" title="뒤로"><img src="../assets/icons/back_arrow_24.svg" alt=""></span><span class="c8-web-head__title t-headingMd">자주 묻는 질문</span><span class="c8-web-head__spacer"></span></div></div><script>const FAQ={"cats": [{"num": 0, "name": "크리에이터클럽 소개"}, {"num": 1, "name": "계정과 회원 정보"}, {"num": 2, "name": "프로필"}, {"num": 3, "name": "올리기"}, {"num": 4, "name": "둘러보기"}, {"num": 5, "name": "클럽"}, {"num": 6, "name": "채팅과 인맥"}, {"num": 7, "name": "알림"}, {"num": 8, "name": "신고와 이용 제한"}], "qs": [{"id": "web-faq-detail-0-1", "cat": 0, "title": "크리에이터클럽은 어떤 서비스인가요?", "rel": [], "text": "크리에이터클럽은 「당신의 작업이 무대가 되는 곳」이에요. 작업을 알리고, 공감하는 크리에이터를 만나고, 함께 일할 사람을 찾는 앱이에요. 할 수 있는 세 가지 작업 알리기: 영감이나 포폴(포트폴리오)을 등록해 다른 크리에이터에게 내 작업을 소개해요. 크리에이터 만나기: 마음에 드는 크리에이터를 팔로우하거나 일촌을 신청할 수 있어요. 일촌은 상대가 신청을 수락해야 맺어져요. 1:1 대화를 시작하려면 노크를 보내고 상대의 수락을 기다려요. 함께 일하기: 프로젝트를 만들어 함께 작업할 사람을 모으고, 팀을 꾸려 같이 만든 작업을 팀 포폴로 보여 줘요. 누가 쓰나요 만 14세 이상이면 쓸 수 있어요. 글·그림·음악·영상 같은 작업을 하는 크리에이터가 써요. 앱 한눈에 보기 화면 하단에는 「Discovery」·「Club」·「Chatty」·「My」 탭이 있고, 가운데에는 올리기 버튼 「+」가 있어요. 「Discovery」(둘러보기): 크리에이터들의 작업을 둘러봐요. 「Club」(클럽): 새로 참여할 오픈채팅·프로젝트·팀을 찾아요. 「+」(올리기): 영감·포폴·프로젝트를 올려요. 「Chatty」(채팅): 참여 중인 대화방이 모여 있어요. 「My」(마이): 내 프로필이에요. 처음이라면 가입하고 활동명을 정해요. 「My」에서 프로필 커버를 등록해요. 커버를 등록해야 작업을 올릴 수 있어요. 첫 작업을 올리고 「Discovery」를 둘러봐요.", "go": "web-faq-detail-0-1"}, {"id": "web-faq-detail-0-2", "cat": 0, "title": "다른 SNS나 포트폴리오 사이트와 무엇이 다른가요?", "rel": [], "text": "SNS가 일상을 공유하고 포트폴리오 사이트가 작업물을 보여주는 공간이라면, 크리에이터클럽은 작업을 통해 새로운 사람을 만나고, 함께 만드는 기회까지 이어지는 공간이에요. 내 작업을 포트폴리오로 소개하고, 관심 있는 창작자에게 직접 말을 걸 수 있어요. 함께하고 싶은 일이 있다면 프로젝트를 열어 멤버를 모집하거나 팀을 만들어 협업할 수도 있죠. 함께 완성한 작업물은 팀과 팀원의 포트폴리오에 연결되어 각자의 활동 기록으로 남아요. 크리에이터클럽에서는 작업을 보여주는 데 그치지 않고, 새로운 사람을 만나 함께 작업할 기회까지 만들어 갈 수 있어요.", "go": "web-faq-detail-0-2"}, {"id": "web-faq-detail-0-3", "cat": 0, "title": "누가 가입할 수 있나요?", "rel": [], "text": "만 14세 이상이면 가입할 수 있어요. 가입할 때 생년월일을 입력하지는 않아요. 대신 약관 동의 화면의 「만 14세 이상입니다」에 직접 체크해요. 만 14세 미만인 것이 확인되면 계정 이용이 제한되거나 계정이 삭제될 수 있어요. 이미 가입된 이메일로는 가입 방법(Kakao·Google·Apple·E-mail)을 바꿔 새 계정을 만들 수 없어요. ※ 가입 정보를 거짓으로 적었거나 약관 위반 등으로 회원 자격을 잃은 적이 있으면 가입 신청이 거절될 수 있어요. 거절할 때는 그 사실과 이유를 함께 알려 드려요.", "go": "web-faq-detail-0-3"}, {"id": "web-faq-detail-0-4", "cat": 0, "title": "무료인가요?", "rel": [], "text": "네, 크리에이터클럽은 요금 없이 쓸 수 있어요. 가입하고, 작업을 올리고, 다른 크리에이터와 대화하는 데 돈이 들지 않아요.", "go": "web-faq-detail-0-4"}, {"id": "web-faq-detail-0-5", "cat": 0, "title": "PC에서도 쓸 수 있나요?", "rel": [], "text": "크리에이터클럽은 iOS·Android 앱에서 이용할 수 있어요. 작업을 올리거나 팔로우·노크·채팅을 하려면 앱이 필요해요. 휴대폰에서 공유 링크를 열면 앱이 없어도 전체 공개된 포폴·프로필·프로젝트·팀을 웹 화면에서 볼 수 있어요. 이 화면에서는 보기만 할 수 있고, 팔로우·연락·참여는 앱에서 해요.", "go": "web-faq-detail-0-5"}, {"id": "web-faq-detail-1-1", "cat": 1, "title": "가입은 어떻게 하나요?", "rel": [], "text": "앱 첫 화면에서 Kakao·Google·Apple·E-mail 중 가입할 방법을 선택해요. 가입과 로그인은 같은 화면에서 시작해요. E-mail로 가입할 때는 아래 순서를 거쳐요. 이메일 입력 약관 동의 이메일 인증 비밀번호(확인 입력 포함) 사용자 ID 활동명 Kakao·Google·Apple로 가입하면 약관 동의 → 사용자 ID → 활동명만 거쳐요. 이메일 인증과 비밀번호 단계는 없어요. 가입을 마치면 바로 로그인돼요. 작업을 올리려면 먼저 프로필 커버를 등록해야 해요. 올리기를 누르면 나오는 안내에서 「커버 등록하기」를 선택하면, 「My」의 커버 템플릿 선택 화면으로 이동해요.", "go": "web-faq-detail-1-1"}, {"id": "web-faq-detail-1-2", "cat": 1, "title": "활동명과 사용자 ID는 무엇이 다른가요?", "rel": [], "text": "활동명은 창작 활동에서 자신을 소개할 때 사용하는 이름이나 닉네임이고, 사용자 ID는 계정마다 부여되는 고유한 식별 이름이에요. 활동명: 실명이 아니어도 되고, 다른 크리에이터와 같아도 돼요. 2~8자로 한글·영문·숫자만 쓸 수 있고, 공백과 특수문자는 쓸 수 없어요. 활동명은 항상 공개되며, 공개 범위를 따로 설정할 수 없어요. 사용자 ID: 다른 크리에이터와 겹칠 수 없어요. 2~13자로 영문 소문자·숫자·마침표(.)·밑줄(_)만 쓸 수 있어요. 프로필 주소와 검색에 쓰여요. ID를 바꾸면 14일 동안 다시 바꿀 수 없어요. 이전 ID로 만든 프로필 링크는 새 프로필로 이어지지 않아요. 이전 ID는 14일 동안 다른 크리에이터도 쓸 수 없어요. ※ 활동명과 ID는 한 번 입력하면 비워 둘 수 없어요. ID의 처음과 끝에는 마침표를 쓸 수 없고, 마침표를 연속해서 쓸 수도 없어요. 욕설이나 정책에 어긋나는 단어는 활동명과 ID 모두에 쓸 수 없어요.", "go": "web-faq-detail-1-2"}, {"id": "web-faq-detail-1-3", "cat": 1, "title": "비밀번호를 바꾸고 싶어요", "rel": [], "text": "E-mail로 가입한 계정은 설정 > 계정 > 비밀번호 변경에서 바꿀 수 있어요. Kakao·Google·Apple로 가입한 계정에는 이 메뉴가 없어요. 현재 비밀번호를 입력해요. 새 비밀번호를 입력해요. 같은 비밀번호를 한 번 더 입력해요. 「비밀번호 변경」을 눌러요. 새 비밀번호는 8자 이상이어야 하고, 영문 대문자·소문자·숫자·특수문자 가운데 3가지 이상을 넣어야 해요. 특수문자는 ~!@#$%^&*()-_=+ 15개만 쓸 수 있어요. 비밀번호가 생각나지 않으면 로그인 화면의 「비밀번호를 잊으셨나요?」에서 이메일 인증을 받아 새로 정해요. ※ 비밀번호를 바꾸면 다른 기기에서는 로그아웃돼요.", "go": "web-faq-detail-1-3"}, {"id": "web-faq-detail-1-4", "cat": 1, "title": "비밀번호를 여러 번 틀려 계정이 잠겼어요", "rel": [], "text": "비밀번호와 2단계 인증번호를 틀린 횟수가 합계 5회가 되면 계정이 잠겨요. 잠긴 계정은 시간이 지나도 풀리지 않고, 비밀번호를 재설정해야 풀려요. 로그인 화면에서 E-mail을 고르고 이메일을 입력해요. 잠금 안내가 나오면 「비밀번호 재설정」을 눌러요. 이메일을 확인하고 「인증번호 받기」를 눌러요. 받은 인증번호로 인증하고 새 비밀번호를 정해요. 비밀번호 재설정을 마치면 입력 오류 횟수가 0으로 초기화되고, 모든 기기에서 로그아웃돼요. 새 비밀번호로 다시 로그인하세요. ※ 비밀번호를 맞게 넣으면 그때까지 틀린 횟수는 0으로 돌아가요. 2단계 인증 화면에서 인증번호를 다시 받아도 횟수는 0으로 돌아가지 않아요. 로그인할 때 남은 횟수는 따로 알려 주지 않아요.", "go": "web-faq-detail-1-4"}, {"id": "web-faq-detail-1-5", "cat": 1, "title": "2단계 인증은 무엇인가요?", "rel": [], "text": "2단계 인증은 E-mail 로그인 시 비밀번호에 더해 인증번호로 본인을 확인하는 기능이에요. 인증번호는 가입한 이메일로 받아 입력해요. E-mail로 가입한 계정만 쓸 수 있고, 처음에는 꺼져 있어요. 설정 > 계정 > 2단계 인증 (2FA)으로 들어가요. 「이메일 인증」을 눌러요. 가입 이메일로 온 숫자 6자리 인증번호를 3분 안에 넣어요. 켜 두면 E-mail로 로그인할 때마다 인증번호를 입력해야 해요. 한 번 인증한 기기에서도 매번 인증이 필요해요. Kakao·Google·Apple 로그인에는 쓰이지 않아요. 설정 > 계정 > 2단계 인증 (2FA) > 이메일 인증에서 스위치를 끄면 바로 꺼져요. ※ 인증 수단은 가입 이메일 인증번호 하나예요. 문자나 OTP 앱으로는 받을 수 없어요.", "go": "web-faq-detail-1-5"}, {"id": "web-faq-detail-1-6", "cat": 1, "title": "내 프로필은 누구에게 보이나요?", "rel": [], "text": "프로필 공개 범위에 따라 달라요. 설정 > 계정 > 공개 범위 > 프로필에서 전체 공개와 비공개 중 선택할 수 있고, 선택한 설정은 바로 저장돼요. 전체 공개: 다른 크리에이터가 내 프로필을 볼 수 있어요. 공유 링크로 열린 웹 화면과 외부 검색엔진에는 전체공개 항목만 보여요. 비공개: 다른 크리에이터는 내 프로필에 들어올 수 없고 「비공개 프로필이에요」 안내를 봐요. 노크와 팔로우·일촌 신청도 받지 않아요. 생년월일·성별, 활동지역, 이메일, 전화번호는 항목마다 전체공개·일촌공개·비공개를 따로 정해요. 처음 등록하면 일촌공개예요. 활동명, 팔로워·팔로잉·일촌 목록과 수는 따로 공개 범위를 정할 수 없어요. 차단 관계인 크리에이터끼리는 서로 프로필과 팔로우·일촌 목록을 볼 수 없어요. ※ 프로필을 비공개로 해도 공개로 올린 작업은 피드에 그대로 보여요. 참여한 프로젝트의 멤버 목록과 소속 팀의 팀 프로필에는 활동명과 프로필 사진이 보여요. 외부 검색엔진에 이미 저장된 내용은 바로 사라지지 않을 수 있어요.", "go": "web-faq-detail-1-6"}, {"id": "web-faq-detail-1-7", "cat": 1, "title": "탈퇴하면 내 작업물은 어떻게 되나요?", "rel": [], "text": "내 프로필과 직접 올린 포폴·영감·프로젝트는 서비스 화면에서 지워지거나 보이지 않게 돼요. 신고·분쟁에 대응하려고 탈퇴일부터 6개월 동안 보관한 뒤 파기해요. 다른 크리에이터의 게시물이나 함께 이용한 공간에 남긴 내용은 아래 기준에 따라 유지돼요. 다른 크리에이터 게시물에 단 댓글·답글·좋아요·리스펙트: 작성자만 익명으로 바뀌어 남아요. 프로젝트 글·일정·사진·댓글·노트와 그룹 채팅 메시지: 쓴 사람이 「알 수 없는 사용자」로 바뀌어 남아요. 1:1 채팅 메시지: 상대의 채팅방에 남을 수 있고, 내 이름과 프로필 사진은 보이지 않아요. 내가 올린 팀 포폴: 팀에 보이고 있어도 삭제돼요. 내가 관리자인 팀은 해체되고, 내가 방장인 그룹 채팅방은 닫혀요. 내가 리더인 진행 중 프로젝트는 종료되고, 멤버는 탈퇴일부터 14일 동안 읽기만 할 수 있어요. 탈퇴한 계정은 복구할 수 없어요. 탈퇴 전에 확인해 주세요. 남기고 싶지 않은 내용은 탈퇴 전에 직접 삭제해 주세요. 직접 지울 수 없는 것은 고객센터에 삭제를 요청할 수 있어요.", "go": "web-faq-detail-1-7"}, {"id": "web-faq-detail-1-8", "cat": 1, "title": "앱을 지우면 탈퇴되나요?", "rel": [], "text": "아니요, 휴대폰에서 앱을 지워도 계정은 그대로 남아요. 탈퇴하려면 설정 > 계정 > 회원 탈퇴로 이동해요. 탈퇴 사유를 골라요. 본인 확인을 해요. E-mail로 가입했다면 비밀번호를 넣고, Kakao·Google·Apple로 가입했다면 그 서비스에 다시 로그인해요. 최종 확인에서 「탈퇴하기」를 눌러요. 고객센터(support@cre8orclub.com)로 연락해 탈퇴할 수도 있어요.", "go": "web-faq-detail-1-8"}, {"id": "web-faq-detail-2-1", "cat": 2, "title": "프로필에는 무엇을 담나요?", "rel": [], "text": "프로필에는 나를 소개하는 커버와 내 작업이 함께 담겨요. 같은 프로필을 기본 보기와 작업물(이력서) 보기로 바꿔 볼 수 있어요. 커버: 커버 템플릿, ID, 활동명, 직업, 한 줄 소개, 표지 이미지·영상, 프로필 사진 작업물 보기: 「포폴」 「프로젝트」 「영감」 「소개」 네 탭 「소개」 탭: 자기소개, 학력·경력·수상·자격, 기본정보 생년월일·성별·이메일·전화번호·활동지역은 처음 등록하면 공개 범위가 일촌공개라서 일촌(서로 연결된 크리에이터)에게만 보여요. 다른 크리에이터에게는 그 사람에게 공개된 항목만 보이고, 등록하지 않은 섹션은 보이지 않아요. 프로필 전체를 비공개로 두면 다른 크리에이터는 내 프로필에 들어올 수 없어요.", "go": "web-faq-detail-2-1"}, {"id": "web-faq-detail-2-2", "cat": 2, "title": "커버는 어떻게 바꾸나요?", "rel": [], "text": "커버를 처음 등록한 뒤에는 커버 수정 화면에서 커버 템플릿, ID, 활동명, 직업, 한 줄 소개, 표지 이미지·영상, 프로필 사진을 각각 수정할 수 있어요. 커버 템플릿: A·B·C·D·E 가운데 골라요. 고른 커버는 내 프로필, 다른 크리에이터가 보는 프로필, 「Discovery」 프로필 카드, 공유 링크에 똑같이 보여요. 직업: 1개 이상 5개까지 한 줄 소개: 30자까지 표지: 이미지는 3:4 비율에 맞게 잘라 등록하고, 영상은 최대 5초 구간을 선택해 등록할 수 있어요. 프로필 사진: 이미지 1장(영상은 안 돼요) ※ ID를 바꾸면 14일 동안 다시 바꿀 수 없고, 이전 ID로 만든 프로필 링크는 새 프로필로 이어지지 않아요.", "go": "web-faq-detail-2-2"}, {"id": "web-faq-detail-2-3", "cat": 2, "title": "커리어는 어떻게 적나요?", "rel": [], "text": "커리어는 「소개」 탭에 보이는 학력·경력·수상·자격이에요. 커리어 관리에서 학력·경력·수상·자격을 각각 추가해요. 학력(5개까지): 학교명·전공(각 50자)과 상태(졸업·재학 중·휴학 중·수료·중퇴)는 꼭 넣고, 기간은 비워 둘 수 있어요. 경력(20개까지): 프로젝트/활동명(50자), 소개/담당 역할(150자), 시작일과 종료일 또는 「진행중」을 넣어요. 수상·자격(20개까지): 유형, 「활동명」(수상·자격 이름, 50자), 날짜를 넣어요. 유형을 「기타」로 고르면 직접 쓴 글이 프로필에 보여요. 날짜는 연도와 월을 입력해요. 항목을 누르면 고치거나 지울 수 있어요. 휴지통 아이콘을 누르면 확인 팝업 없이 해당 항목이 바로 삭제돼요. 항목 순서는 바꿀 수 없어요. 저장하지 않고 나가면 쓰던 내용은 남지 않아요. ※ 커리어는 사실대로 적어야 해요. 허위 이력을 적으면 삭제나 기능 제한 같은 조치를 받을 수 있어요.", "go": "web-faq-detail-2-3"}, {"id": "web-faq-detail-2-4", "cat": 2, "title": "대표작은 어떻게 정하나요?", "rel": [], "text": "내 개인 포폴의 상세 화면 더보기에서 「대표작 설정」으로 지정하거나 해제할 수 있어요. 올리기 화면에서는 정할 수 없어요. 새로 등록한 포폴은 대표작으로 자동 지정되지 않아요. 대표작 개수에는 제한이 없어요. 일촌공개·나만보기 포폴도 대표작으로 지정할 수 있고, 지정해도 공개 범위는 바뀌지 않아요. 보는 사람이 그 포폴을 볼 수 있을 때만 대표작으로 보여요. 프로필 「포폴」 탭 카드에 「대표작」 표시가 붙어요. 영감과 프로젝트는 대표작으로 지정할 수 없어요.", "go": "web-faq-detail-2-4"}, {"id": "web-faq-detail-2-5", "cat": 2, "title": "누가 내 프로필을 봤는지 알 수 있나요?", "rel": [], "text": "네, 오늘 내 프로필을 방문한 크리에이터를 확인할 수 있어요. 내 프로필의 「Today」 지표를 누르면 「오늘 방문한 사용자」 목록이 열려요. 목록에서 방문자를 누르면 그 크리에이터의 프로필로 가요. 다른 크리에이터가 내 프로필을 방문하면 「프로필 방문」 알림으로도 확인할 수 있어요. 이 알림은 알림 목록 「관계」 탭에 쌓여요. 다만 모든 방문에 알림이 오지는 않아요. 앱푸시는 알림 설정의 「관계 알림」으로 끌 수 있어요. 반대로 내가 다른 크리에이터의 프로필을 보면 그 크리에이터의 방문자 목록과 알림에 내 활동명과 방문 일시가 보일 수 있어요. 다른 크리에이터 프로필의 「Today」를 누르면 누적 방문 수(Total)만 보이고 방문자는 보이지 않아요. ※ 차단 관계인 크리에이터의 방문은 기록되지 않고 알림도 가지 않아요.", "go": "web-faq-detail-2-5"}, {"id": "web-faq-detail-2-6", "cat": 2, "title": "프로필을 밖으로 공유할 수 있나요?", "rel": [], "text": "네, 내 프로필을 링크로 앱 밖에 공유할 수 있어요. 「My」 탭 위쪽의 공유를 누르면 「내 프로필 미리보기」가 열려요. 「내 프로필 미리보기」에서 휴대폰 공유 메뉴를 열어 프로필 링크를 보내요. 다른 크리에이터의 프로필도 위쪽의 공유하기로 보낼 수 있어요. 링크에는 내 ID가 들어가요. ID를 바꾸면 이전 ID로 만든 링크는 새 프로필로 이어지지 않아요. 앱이 없는 휴대폰에서 링크를 열면 웹 화면으로 보여요. 이때 생년월일·성별·활동지역·이메일·전화번호는 전체공개로 둔 항목만 보이고, 활동명은 늘 보여요. 프로필이 전체 공개이면 외부 검색엔진에도 나올 수 있어요. 프로필이 비공개이면 공유되지 않고, 공개로 바꿀지 묻는 안내가 떠요. 자동으로 공개되지는 않아요.", "go": "web-faq-detail-2-6"}, {"id": "web-faq-detail-3-1", "cat": 3, "title": "무엇을 올릴 수 있나요?", "rel": [], "text": "영감, 포폴(포트폴리오), 프로젝트 세 가지를 올릴 수 있어요. 화면 아래 가운데 「+」를 누르면 올리기 화면이 열려요. 영감·포폴·프로젝트 중 원하는 유형의 탭을 선택해요. 처음에는 「영감」 탭이 선택돼 있어요. 영감: 300자 안의 글이에요. 사진·파일은 붙일 수 없어요. 포폴: 작업 결과물을 올려요. 사진·동영상, 오디오, PDF, 유튜브 링크, 긴 글 중에서 결과물을 선택해 1개 이상 첨부해요. 프로젝트: 함께 작업할 크리에이터를 모집하고, 참여가 승인된 크리에이터와 작업하는 공간이에요. ※ 본인이 저작권과 이용 권한을 가진 것만 올려야 해요. 다른 사람의 창작물을 인용하거나 참조했다면 출처를 적어야 해요.", "go": "web-faq-detail-3-1"}, {"id": "web-faq-detail-3-2", "cat": 3, "title": "영감과 포폴은 무엇이 다른가요?", "rel": [], "text": "영감은 글만 올리는 게시물이고, 포폴은 작업 결과물을 붙여 올리는 게시물이에요. 영감: 본문(300자까지)과 공개 범위만 정해요. 사진·파일은 붙일 수 없어요. 카드 배경색은 4색 가운데 하나로 자동으로 정해지고, 바꿀 수 없어요. 포폴: 제목(56자까지)을 꼭 쓰고, 결과물을 1개 이상 붙여야 다음 단계로 넘어가요. 작업 배경/과정(1,000자까지)도 적어요. 소속 팀이 있으면 팀 포폴로도 올릴 수 있어요. 내 프로필에서 포폴은 「포폴」 탭에, 영감은 「영감」 탭에 각각 표시돼요.", "go": "web-faq-detail-3-2"}, {"id": "web-faq-detail-3-3", "cat": 3, "title": "프로젝트는 어떻게 올리나요?", "rel": [], "text": "올리기 화면에서 「프로젝트」 탭을 고르거나, 클럽 홈 위쪽 「만들기」에서 「프로젝트 만들기」를 눌러 올려요. 제목(56자)과 내용(1,000자)은 꼭 써요. 모집 내용과 프로젝트 설명은 같은 내용 입력 필드에 작성해요. 맡을 역할도 같은 입력 필드에 적어요. 배경은 이미지 1장, 동영상 1개(10초까지), 기본 배경 가운데 하나를 꼭 골라요. 포인트 색은 초록·파랑·분홍·코랄 가운데 하나를 골라요. 공개 범위는 전체공개·일촌공개·나만보기 가운데 고르고, 고르지 않으면 전체공개로 올라가요. 프로젝트를 등록하면 바로 「모집 중」 상태가 돼요. 모집 기간·마감 날짜·모집 인원은 따로 받지 않아요.", "go": "web-faq-detail-3-3"}, {"id": "web-faq-detail-3-4", "cat": 3, "title": "어떤 형식과 크기까지 올릴 수 있나요?", "rel": [], "text": "포폴 결과물은 사진·동영상, 오디오, PDF, 유튜브 링크, 긴 글 가운데 골라 올려요. 이미지·동영상·PDF·오디오는 파일 하나당 1GB까지 올릴 수 있어요. 여러 파일의 합계 용량에는 제한이 없어요. 사진과 동영상은 함께 첨부할 수 있으며, 한 포폴에 합계 10개까지 등록할 수 있어요. 포폴 동영상은 길이 제한이 없고, 원하는 구간을 선택해 등록할 수도 있어요. 프로젝트 배경 동영상은 10초, 커버 표지 영상은 5초까지예요. 유튜브가 아닌 외부 링크와 문서(DOC) 파일은 포폴 결과물로 올릴 수 없어요. 크기나 형식이 맞지 않는 파일은 첨부되지 않고 안내가 떠요.", "go": "web-faq-detail-3-4"}, {"id": "web-faq-detail-3-5", "cat": 3, "title": "팀 포폴은 어떻게 올리나요?", "rel": [], "text": "소속 팀이 있으면 포폴을 올리는 마지막 단계에서 등록 위치를 「{팀 이름} 팀에 등록」으로 고르면 돼요. 팀 홈 메뉴의 「팀 포트폴리오 올리기」로 들어가면 그 팀이 미리 선택돼 있어요. 그 팀의 관리자와 팀원만 올릴 수 있어요. 공개 범위는 고를 수 없고 늘 전체공개로 올라가요. 팀 프로필과 팀원 모두의 프로필에 함께 보여요. 팀 포폴의 수정·삭제는 등록한 사람만 할 수 있어요. 팀 관리자도 다른 사람이 등록한 팀 포폴은 수정하거나 삭제할 수 없어요. 팀을 떠난 크리에이터의 프로필에서는 보이지 않아요. 팀이 해체되면 올린 사람의 개인 포폴로 남아요. ※ 팀 포폴을 올리면 다른 팀원과 공동 창작자에게 게시 동의를 받고 권리를 확보했다고 보증하는 것이에요.", "go": "web-faq-detail-3-5"}, {"id": "web-faq-detail-3-6", "cat": 3, "title": "올린 것을 고치거나 지울 수 있나요?", "rel": [], "text": "네, 올린 사람은 영감·포폴·프로젝트를 고칠 수 있고, 영감·포폴은 지울 수도 있어요. 프로젝트는 지울 수 없고 종료만 할 수 있어요. 고치기: 수정 화면에서 내용을 변경한 뒤 다시 게시해요. 포폴은 결과물·제목·작업 배경/과정을 고칠 수 있고, 개인 포폴은 공개 범위도 고칠 수 있어요. 다만 결과물 종류(예: 사진·동영상을 긴 글로)는 바꿀 수 없어요. 영감·포폴·프로젝트 사이에서 유형을 바꿀 수도 없어요. 지우기: 영감·포폴은 상세 화면 더보기의 「삭제하기」를 누르고, 확인 팝업에서 삭제를 한 번 더 확인해요. 프로젝트: 종료한 프로젝트는 고칠 수 없고 기록으로 남아요. 지워야 한다면 고객센터에 요청할 수 있어요. ※ 공개 범위를 바꾸거나 지워도, 외부 검색엔진·메신저가 이미 가져간 정보는 그쪽 갱신 주기에 따라 한동안 남을 수 있어요.", "go": "web-faq-detail-3-6"}, {"id": "web-faq-detail-3-7", "cat": 3, "title": "올리기를 누르면 커버 등록 안내가 떠요", "rel": [], "text": "커버를 등록하지 않으면 영감·포폴·프로젝트를 올릴 수 없어, 올리기 화면 대신 커버 등록 안내가 나와요. 안내에서 「커버 등록하기」를 눌러요. My 탭에서 커버 템플릿(A~E)을 골라요. 「이 스타일로 시작하기」를 눌러요. 직업 1개, 한 줄 소개, 표지 이미지·영상, 프로필 사진을 순서대로 등록해요. 커버를 일부만 등록한 상태라면 템플릿 선택을 거치지 않고 현재 탭에서 바로 커버 수정 화면으로 이동해요. 커버 등록을 마치면 My 탭의 프로필로 이동해요. 다시 올리기를 눌러 주세요. 「다음에」를 누르면 안내만 닫혀요. ※ 등록 중에 나가면 입력한 내용은 저장되지 않고, 다시 들어오면 처음부터 시작해요.", "go": "web-faq-detail-3-7"}, {"id": "web-faq-detail-3-8", "cat": 3, "title": "포폴 업로드가 실패했어요", "rel": [], "text": "「등록하기」를 누르면 등록 화면이 닫히고, 포폴 업로드는 계속 진행돼요. 앱을 보고 있지 않을 때 업로드가 완료되면 알림 설정에 따라 푸시 알림으로 알려드려요. 서버가 업로드를 거절한 경우에는 원인을 안내해요. 「수정하기」를 누르면 쓰던 내용이 그대로 남은 올리기 화면으로 돌아가요. 안내에 맞게 고쳐 다시 올려 주세요. 앱을 보고 있지 않을 때 실패하면 앱푸시로 알려요. 앱푸시를 누르면 내 포폴로 가요. 실패 앱푸시는 반응·관계·소식·채티 알림을 꺼 두어도 와요. 휴대폰 알림과 「푸시 알림 받기」는 켜져 있어야 해요. 인터넷 연결이 끊긴 것으로 확인되면 등록을 시작하지 않고, 작성 중인 화면을 유지해요. ※ 포폴이 올라가는 동안에는 영감·포폴·프로젝트 모두 새로 올릴 수 없어요.", "go": "web-faq-detail-3-8"}, {"id": "web-faq-detail-4-1", "cat": 4, "title": "피드에는 무엇이 나오나요?", "rel": [], "text": "화면 아래 「Discovery」 탭의 피드에는 크리에이터들이 올린 포폴, 영감, 프로젝트가 카드로 나와요. 한 크리에이터의 포폴·영감 카드를 최대 3장까지 묶어 보여 주고, 그 뒤에 프로필 카드를 표시해요. 프로젝트는 카드 한 장으로 보여 줘요. 카드 사이에는 배너 안내와 Weekly Best 소개 카드가 표시되기도 해요. 어떤 작업이 누구에게 보이는지는 작업마다 정한 공개 범위를 따라요. 전체공개 작업은 모든 크리에이터에게, 일촌공개 작업은 올린 크리에이터의 일촌에게만 보여요. 비공개(나만보기) 작업은 피드에 나오지 않아요. 프로필을 비공개로 둔 크리에이터의 작업도 공개 범위에 맞으면 피드에 나와요. 포폴 카드에는 리스펙트를 보내고, 영감 카드에는 좋아요를 누를 수 있어요. 서로 차단한 사이인 크리에이터의 작업과 프로필은 피드에 나오지 않아요.", "go": "web-faq-detail-4-1"}, {"id": "web-faq-detail-4-2", "cat": 4, "title": "리스펙트는 무엇인가요?", "rel": [], "text": "리스펙트는 포폴에만 보낼 수 있는 반응이에요. 영감에는 좋아요를 눌러요. 리스펙트를 보낼 때는 정해진 8가지 문구 중 하나를 선택해요. 8가지는 「내 스타일이에요」 「이런 건 처음봐요」 「별 5개 드립니다!」 「말 그대로, Respect」 「못하시는 게 뭐죠?」 「이건 좀 탐나네요」 「계속 보게 돼요」 「다음이 기대돼요」예요. 한마디 하나가 리스펙트 하나예요. 오늘 다른 포폴에 쓴 한마디는 그날 다시 고를 수 없고, 한국 시간 자정이 지나면 다시 고를 수 있어요. 포폴 하나가 받은 리스펙트가 모두 8개가 되면 그 포폴은 GOAT가 되고, 카드에 GOAT 표시가 붙어요. 리스펙트가 취소돼 8개 아래로 내려가도 GOAT는 그대로예요. ※ 내 포폴에는 리스펙트를 보낼 수 없어요.", "go": "web-faq-detail-4-2"}, {"id": "web-faq-detail-4-3", "cat": 4, "title": "Weekly Best는 어떻게 뽑나요?", "rel": [], "text": "Weekly Best에서는 한 주 동안 받은 리스펙트와 활동 점수를 기준으로 작품 부문과 크리에이터 부문의 순위를 정해요. 별도로 신청하지 않아도 순위 집계 대상에 포함돼요. 탈퇴했거나 서비스 이용이 제한된 계정은 순위에서 빠져요. 작품 부문: 전체공개 포폴이 그 주에 받은 리스펙트 수 크리에이터 부문: 전체공개 프로필로 그 주에 쌓은 활동 점수. 프로필 소개 정보, 포폴·프로젝트·영감 올리기, 팔로워 증가, 리스펙트 보내기, 채팅 메시지 수, 콘텐츠·프로필·오픈채팅 공유가 점수가 돼요. 활동별 점수는 공개하지 않아요. 한 주는 월요일 00:00에 시작해 일요일 23:59:59에 마감해요. 마감 뒤 부문별 최종 순위 1~10위가 수상 후보가 되고, 그 주에 앱에 접속한 기록과 참여 자격을 확인해 수상자를 정해요. 접속 기록이 없으면 수상에서 빠져요. Discovery 위쪽에 Weekly Best 아이콘이 보이면 눌러서 순위를 볼 수 있어요.", "go": "web-faq-detail-4-3"}, {"id": "web-faq-detail-4-4", "cat": 4, "title": "Weekly Best 순위에 나오고 싶지 않아요", "rel": [], "text": "설정 > 고객센터 > 이메일 문의로 요청하면 Weekly Best 순위에서 빠질 수 있어요. 공개 범위를 바꾸거나 포폴을 삭제해 순위에서 제외될 수도 있어요. 프로필을 비공개로 바꾸면 크리에이터 부문 순위에서 빠져요. 포폴을 삭제하거나 전체공개가 아닌 범위(일촌공개·나만보기)로 바꾸면 그 포폴은 작품 부문 순위에서 빠져요. 고객센터는 평일 10:00~18:00에 운영해요.", "go": "web-faq-detail-4-4"}, {"id": "web-faq-detail-4-5", "cat": 4, "title": "크리에이터나 작업물은 어떻게 찾나요?", "rel": [], "text": "Discovery나 Club 화면 상단의 돋보기 아이콘을 누르면 검색 화면으로 이동해요. 검색어를 입력하면 「전체」 탭에 결과가 표시되고, 「크리에이터」 「포트폴리오」 「오픈채팅」 「프로젝트」 「팀」 탭에서 유형별 결과를 볼 수 있어요. 크리에이터는 아이디, 활동명(영문 활동명 포함), 자기소개 제목, 직업, 시그니처 키워드, 지역으로 찾아요. 지역은 그 크리에이터가 공개한 범위 안에서만 검색돼요. #으로 시작하는 검색어는 「크리에이터」 「포트폴리오」 「프로젝트」 탭에서만 검색돼요. 프로필을 비공개로 둔 크리에이터는 크리에이터 검색에 나오지 않아요. 포폴은 작업마다 정한 공개 범위대로 검색에 보여요. 서로 차단한 사이인 크리에이터와 그 작업은 검색 어디에도 나오지 않아요.", "go": "web-faq-detail-4-5"}, {"id": "web-faq-detail-4-6", "cat": 4, "title": "저장한 게시물은 어디서 보나요?", "rel": [], "text": "설정 > 북마크의 「포트폴리오」 탭에서 저장한 포폴을 모아 볼 수 있어요. 다른 크리에이터의 포폴 상세에서 더보기를 눌러 「게시물 저장」을 고르면 저장돼요. 영감과 프로젝트는 저장할 수 없고, 내 포폴도 저장할 수 없어요. 나와 해당 크리에이터 중 어느 한쪽이 상대를 차단하면, 저장한 포폴도 북마크 목록에서 제외돼요.", "go": "web-faq-detail-4-6"}, {"id": "web-faq-detail-4-7", "cat": 4, "title": "내가 쓴 댓글은 어디서 보나요?", "rel": [], "text": "설정 > 콘텐츠 > 댓글 및 답글에서 내가 쓴 댓글과 답글을 모아 볼 수 있어요. 「포폴」 「영감」 「프로젝트」 「채팅」 탭으로 나뉘어요. 「포폴」 「영감」: 포폴과 영감에 단 댓글·답글 「프로젝트」: 프로젝트 게시글과 일정에 단 댓글·답글 「채팅」: 채팅방 노트에 단 댓글·답글 설정 > 콘텐츠에서는 내가 남긴 리스펙트와 좋아요도 확인할 수 있어요.", "go": "web-faq-detail-4-7"}, {"id": "web-faq-detail-4-8", "cat": 4, "title": "내 댓글을 고칠 수 있나요?", "rel": [], "text": "네, 포폴과 영감에 단 내 댓글·답글은 고칠 수 있어요. 내 댓글·답글의 더보기를 누르면 수정과 삭제 메뉴가 나와요. 포폴과 영감에서는 답글이 달린 내 댓글을 지워도 답글은 남아요. 댓글과 답글은 쓴 사람만 지울 수 있어요.", "go": "web-faq-detail-4-8"}, {"id": "web-faq-detail-5-1", "cat": 5, "title": "클럽에서는 무엇을 하나요?", "rel": [], "text": "Club은 새로 참여할 오픈채팅, 프로젝트, 팀을 찾는 곳이에요. 화면 아래 「Club」 탭에서 열어요. 오픈채팅: 크리에이터가 만들어 함께 이야기하는 공개 그룹 채팅방 프로젝트: 함께 작업할 크리에이터를 모집하고 지원을 받는 곳 팀: 함께 작업한 결과물을 소개하려고 크리에이터들이 만드는 모임 화면 상단에서 「전체」 「오픈채팅」 「프로젝트」 「팀」 탭을 선택해 유형별로 볼 수 있어요. 내가 만들었거나 참여 중인 곳은 내 클럽에 모여요. 직접 만들려면 오른쪽 위 만들기 메뉴에서 「오픈채팅방 만들기」 「프로젝트 만들기」 「팀 만들기」 가운데 골라요.", "go": "web-faq-detail-5-1"}, {"id": "web-faq-detail-5-2", "cat": 5, "title": "오픈채팅은 무엇인가요?", "rel": [], "text": "오픈채팅은 Club에서 만드는 공개 그룹 채팅방이에요. 따로 승인받지 않아도 누구나 참여할 수 있어요. 다만 방장이 나를 내보낸 방에는 참여 이력을 보관하는 동안 다시 들어갈 수 없어요. Club의 「전체」 탭과 「오픈채팅」 탭에는 아직 참여하지 않은 오픈채팅이 최근에 대화가 오간 순서로 표시돼요. 카드를 누르면 바로 그 채팅방에 들어가요. 직접 만들려면 Club 오른쪽 위 만들기 메뉴에서 「오픈채팅방 만들기」를 골라요. 이름은 꼭 넣어야 하고 30자까지, 소개는 100자까지 쓸 수 있어요. 방장이 방을 나가면 오픈채팅이 종료돼요. 방장 권한은 다른 크리에이터에게 이전되지 않아요. ※ 오픈채팅에 보낸 메시지는 참여하지 않은 크리에이터에게도 보일 수 있어요. 개인정보나 공개하고 싶지 않은 내용은 보내지 마세요.", "go": "web-faq-detail-5-2"}, {"id": "web-faq-detail-5-3", "cat": 5, "title": "프로젝트는 무엇인가요?", "rel": [], "text": "프로젝트는 함께 작업할 크리에이터를 모집하고, 지원이 수락된 멤버와 함께 작업하는 공간이에요. 프로젝트를 만든 크리에이터가 리더가 돼요. 리더가 지원을 수락하면 그 크리에이터는 멤버가 되고 프로젝트 채팅방에도 들어가요. 리더와 멤버는 프로젝트 안에서 게시글을 쓰고, 일정을 만들고, 자료를 올려요. 프로젝트 상태는 모집 중, 지원 마감, 종료로 구분돼요. 지원 마감 상태에서는 새 지원을 받지 않고, 프로젝트를 종료하면 이전 상태로 되돌릴 수 없어요. 참여하려면 Club > 「프로젝트」 탭에서 프로젝트를 찾아 지원해요. 직접 모집하려면 Club 오른쪽 위 만들기 메뉴에서 「프로젝트 만들기」를 골라요.", "go": "web-faq-detail-5-3"}, {"id": "web-faq-detail-5-4", "cat": 5, "title": "프로젝트에 지원하려면 어떻게 하나요?", "rel": [], "text": "모집 중인 프로젝트의 모집 공고에서 「지원하기」를 눌러 지원해요. Club > 「프로젝트」 탭의 「새로운 프로젝트」에서 프로젝트 카드를 눌러 모집 공고를 열어요. 아래쪽 「지원하기」를 눌러요. 자기소개를 300자 안으로 쓰고 [지원하기]를 눌러요. 지원 결과를 기다리는 프로젝트는 「프로젝트」 탭의 「지원한 프로젝트」에서 확인할 수 있어요. 리더가 지원을 수락하면 그 프로젝트가 내 클럽으로 옮겨져요. 이때 멤버가 되어 프로젝트 채팅방에 들어가요. 참여가 수락된 이후에 등록된 메시지와 첨부자료부터 볼 수 있어요. ※ 지원 마감된 프로젝트에는 새로 지원할 수 없어요. 다만 마감 전에 낸 지원은 마감 뒤에도 리더가 수락하거나 거절할 수 있어요.", "go": "web-faq-detail-5-4"}, {"id": "web-faq-detail-5-5", "cat": 5, "title": "지원을 취소하고 싶어요", "rel": [], "text": "아직 지원 결과가 나오지 않았다면 직접 취소할 수 있어요. 다만 프로젝트 지원은 모집 중일 때만 취소할 수 있어요. 프로젝트: Club > 「프로젝트」 탭의 「지원한 프로젝트」에서 그 프로젝트를 눌러 모집 공고를 열고, 아래쪽 「지원 취소」를 누른 뒤 확인 팝업에서 「지원 취소」를 한 번 더 눌러요. 팀: 그 팀 홈의 「연락하기」에서 「지원 취소」를 누른 뒤 확인 팝업에서 「지원 취소」를 한 번 더 눌러요. 취소하면 리더나 팀 관리자는 그 지원서를 더 볼 수 없고, 취소했다는 알림도 가지 않아요. 취소한 뒤 바로 다시 지원할 수 있어요. ※ 지원 마감된 프로젝트의 지원은 취소할 수 없어요. 리더가 다시 모집을 시작하면 취소할 수 있어요. 리더나 팀 관리자가 이미 수락하거나 거절한 지원도 취소할 수 없어요.", "go": "web-faq-detail-5-5"}, {"id": "web-faq-detail-5-6", "cat": 5, "title": "지원이 거절되면 다시 지원할 수 있나요?", "rel": [], "text": "프로젝트와 팀이 달라요. 프로젝트: 지원이 거절된 프로젝트나 리더가 나를 내보낸 프로젝트에는 다시 지원할 수 없어요. 다만 이 제한은 지원·참여 이력을 보관하는 동안에만 적용돼요. 수락된 뒤 스스로 나간 프로젝트는 모집 중일 때 다시 지원할 수 있어요. 팀: 지원이 거절돼도 같은 팀에 다시 지원할 수 있어요. 다시 제출한 지원은 새 지원으로 접수돼요.", "go": "web-faq-detail-5-6"}, {"id": "web-faq-detail-5-7", "cat": 5, "title": "팀은 무엇인가요?", "rel": [], "text": "팀은 크리에이터들이 함께 작업한 결과물을 소개하려고 만드는 모임이에요. 팀을 만든 크리에이터가 팀 관리자가 되고, 초대를 수락하거나 지원이 수락된 크리에이터가 팀원이 돼요. 팀을 만들면 팀 프로필과 팀원만 쓰는 팀 채팅방이 함께 생겨요. 팀 홈에는 그 팀에 등록한 팀 포폴과 팀원이 전체공개로 올린 개인 포폴이 함께 보여요. 팀원이 아니어도 팀을 팔로우할 수 있어요. 팀 메뉴의 「연락하기」에서 지원하기, 의뢰하기, 기타 중 하나를 선택해 팀 관리자에게 연락할 수 있어요. 직접 만들려면 Club 오른쪽 위 만들기 메뉴에서 「팀 만들기」를 골라요.", "go": "web-faq-detail-5-7"}, {"id": "web-faq-detail-5-8", "cat": 5, "title": "팀은 어떻게 만들고 초대하나요?", "rel": [], "text": "Club 오른쪽 위 만들기 메뉴에서 「팀 만들기」를 골라 만들어요. 준비된 기본 깃발 가운데 하나를 좌우로 넘겨 골라요. 팀 이름은 필수로 입력해야 하며, 30자까지 쓸 수 있어요. 다른 팀과 같은 이름은 쓸 수 없어요. 한 줄 슬로건을 써요. 아래쪽 「팀 만들기」를 눌러요. 팀을 만들면 팀 프로필과 팀원만 쓰는 팀 채팅방이 함께 생기고, 만든 사람이 팀 관리자가 돼요. 팀 소개는 만든 뒤에 따로 써요. 초대는 팀 관리자만 할 수 있어요. 멤버 관리의 [멤버 초대]에서 이름을 검색해 초대를 보내요. 초대받은 크리에이터는 Club > 「팀」 탭에서 확인 창을 거쳐 수락하거나 거절해요. 수락하면 팀원이 되어 팀 채팅방에 들어가고, 들어온 뒤의 메시지와 첨부물부터 볼 수 있어요. ※ 팀 관리자는 관리자 권한을 다른 사람에게 넘기거나 팀을 탈퇴할 수 없어요. 팀을 해체하거나 회원 탈퇴할 때만 빠질 수 있고, 팀 관리자가 회원 탈퇴하면 그 팀은 해체돼요.", "go": "web-faq-detail-5-8"}, {"id": "web-faq-detail-5-9", "cat": 5, "title": "프로젝트나 팀이 끝나면 내 글은 어떻게 되나요?", "rel": [], "text": "프로젝트가 종료되거나 팀이 해체돼도 내가 쓴 글과 올린 작업은 남아요. 다만 팀이 해체되면 팀 프로필은 지워져요. 프로젝트 종료: 게시판 글, 일정, 자료실의 「일반」 폴더와 추가 폴더 자료는 기록으로 남아요. 리더와 멤버 모두 해당 기록을 조회하거나 다운로드하는 것만 가능해요. 멤버는 종료 뒤 2주 동안 프로젝트 채팅방의 기존 대화만 읽을 수 있고, 그 뒤에는 채팅방과 자료실 「채팅방」 폴더가 함께 닫혀요. 리더는 프로젝트를 종료하면 바로 채팅방에서 나가요. 팀 해체: 팀 포폴은 올린 크리에이터의 개인 포폴로 남아요. 해체 때 팀원이던 크리에이터는 2주 동안 팀 채팅방의 기존 대화를 보고 첨부물을 저장할 수 있어요. 종료된 프로젝트에 남은 글을 지우고 싶다면 고객센터에 요청할 수 있어요. 다만 리더가 탈퇴해 종료된 프로젝트는 탈퇴일부터 14일이 지나면 서비스에서 보이지 않아요.", "go": "web-faq-detail-5-9"}, {"id": "web-faq-detail-6-1", "cat": 6, "title": "노크는 무엇인가요?", "rel": [], "text": "노크는 다른 크리에이터에게 보내는 1:1 대화 요청이에요. 상대가 받아주어야 1:1 채팅이 시작돼요. 크리에이터의 프로필이나 더보기, 인맥 관리에서 「노크하기」를 눌러 보내요. 「같이 작업해요」 「피드백 주세요」 「잡담해요」처럼 정해진 용건 8가지 가운데 하나 이상을 골라요. Chatty의 새 채팅에서 첫 메시지를 직접 써서 보낼 수도 있어요. 노크를 받으면 상대의 프로필 카드와 메시지를 확인한 뒤 「받아주기」나 「관심없음」을 선택해요. 받아주기 전에는 두 크리에이터 모두 메시지를 쓸 수 없고, 받아주면 그때부터 자유롭게 대화해요. 답을 기다리는 노크는 시간이 지나도 저절로 사라지지 않아요.", "go": "web-faq-detail-6-1"}, {"id": "web-faq-detail-6-2", "cat": 6, "title": "모르는 크리에이터에게 메시지를 보낼 수 있나요?", "rel": [], "text": "노크로 대화를 요청할 수 있어요. 상대가 받아주어야 1:1 채팅이 시작돼요. Chatty의 새 채팅에서는 아직 채팅방이 없는 상대에게 직접 쓴 첫 메시지를 1개만 보낼 수 있고, 사진이나 파일은 붙일 수 없어요. 이 첫 메시지도 노크 요청으로 전달돼요. 노크를 보낼 수 없는 경우도 있어요. 상대가 「노크 받지 않음」으로 설정했다면 노크가 가지 않고, 대화를 시작할 수 없다는 안내만 보여요. 프로필을 비공개로 둔 크리에이터에게는 노크할 수 없어요. 이미 대화 중이거나 답을 기다리는 방이 있으면 「노크하기」 대신 「채팅하기」가 보여요.", "go": "web-faq-detail-6-2"}, {"id": "web-faq-detail-6-3", "cat": 6, "title": "노크를 거절하면 상대가 알 수 있나요?", "rel": [], "text": "「관심없음」으로 거절해도 상대에게 거절 알림이나 이유가 전달되지 않아요. 상대의 채팅방은 답변을 기다리는 화면으로 유지돼요. 「관심없음」을 누르면 확인 팝업이 뜨고, 「거절하기」를 눌러야 거절돼요. 거절한 노크는 내 채팅 목록에서 빠지지만 알림 목록의 노크 알림은 남아 있어요. 그 알림으로 들어가면 「받아주기」나 「관심없음」을 다시 고를 수 있어요. 알림 목록에는 최근 7일 동안 온 알림만 보여요. 답하지 않고 채팅방을 나가도 상대에게 알리지 않아요. 다시 들어가면 같은 노크에 답할 수 있어요.", "go": "web-faq-detail-6-3"}, {"id": "web-faq-detail-6-4", "cat": 6, "title": "노크를 받고 싶지 않아요", "rel": [], "text": "My 탭의 내 프로필에서 「노크 수신 설정」을 「노크 받지 않음」으로 바꾸면 돼요. 확인 팝업에서 「변경하기」를 눌러야 바뀌어요. 이 설정은 나만 바꿀 수 있고, 처음 가입하면 「노크 환영」으로 시작해요. 「노크 받지 않음」이면 다른 크리에이터가 「노크하기」를 눌러도 노크는 전송되지 않고, 대화를 시작할 수 없다는 안내만 표시돼요. 다시 받고 싶으면 같은 곳에서 「노크 환영」으로 바꿔요. ※ 팀 관리자라면 팀에 오는 「연락하기」(의뢰·기타)는 「노크 받지 않음」이어도 노크로 받아요. 팀 연락은 받지 않도록 설정할 수 없어요. 다만 나와 차단 관계인 크리에이터의 연락은 오지 않아요.", "go": "web-faq-detail-6-4"}, {"id": "web-faq-detail-6-5", "cat": 6, "title": "일촌과 팔로우는 무엇이 다른가요?", "rel": [], "text": "일촌은 신청 후 상대가 수락해야 맺어지는 관계예요. 팔로우는 상대의 수락 없이 바로 연결되는 관계예요. 일촌: 수락을 기다리는 동안은 「일촌 대기중」으로 보이고, 그동안 신청을 취소할 수 있어요. 일촌을 끊으려면 더보기에서 「일촌 해제」를 눌러요. 팔로우: 상대의 수락 없이 맺어져요. 팔로우한 크리에이터의 새 포폴과 새 프로젝트 소식을 알림으로 받을 수 있어요. 팔로우를 취소할 때는 확인 팝업에서 「팔로우 취소」를 눌러요. 내 일촌·팔로워·팔로잉은 인맥 관리에서 탭별로 볼 수 있어요. 인맥 관리는 Chatty 위쪽의 「인맥 관리」 아이콘이나 My > 설정 > 인맥 관리에서 열어요.", "go": "web-faq-detail-6-5"}, {"id": "web-faq-detail-6-6", "cat": 6, "title": "다이얼은 무엇인가요?", "rel": [], "text": "다이얼은 팔로우를 따라가며 새 크리에이터를 찾는 기능이에요. 처음에는 내가 팔로우한 크리에이터가 휠에 표시돼요. 그중 한 명을 선택하면 그 크리에이터가 팔로우한 사람들을 이어서 볼 수 있어요. Chatty 위쪽의 「인맥 둘러보기」 아이콘으로 들어가요. 바로 옆의 「인맥 관리」 아이콘과는 다른 아이콘이에요. 팔로잉이 8명 이상일 때 쓸 수 있고, 8명보다 적으면 다이얼 대신 팔로우를 권하는 화면이 나와요. 휠에는 크리에이터의 사진, 활동명, 직업이 보여요. 나와 차단 관계인 크리에이터, 내가 신고한 크리에이터, 나에게 프로필을 공개하지 않은 크리에이터는 휠에 나오지 않아요.", "go": "web-faq-detail-6-6"}, {"id": "web-faq-detail-6-7", "cat": 6, "title": "보낸 메시지를 고치거나 지울 수 있나요?", "rel": [], "text": "내가 보낸 메시지는 수정할 수 없지만 삭제할 수 있어요. 사진·동영상·파일 같은 첨부 메시지도 같아요. 지우기 전에 확인 팝업이 한 번 뜨고, 지운 자리에는 「삭제된 메시지입니다」가 보여요. 다른 크리에이터가 보낸 메시지는 지울 수 없어요. 오픈채팅 방장이나 프로젝트 리더도 마찬가지예요. 문제가 있는 메시지라면 그 메시지를 보낸 크리에이터를 신고해 주세요.", "go": "web-faq-detail-6-7"}, {"id": "web-faq-detail-6-8", "cat": 6, "title": "채팅방을 나가면 보낸 메시지는 어떻게 되나요?", "rel": [], "text": "내가 보낸 메시지는 상대에게 그대로 남아요. 1:1 채팅방에서 나가면 내 채팅 목록에서만 방이 지워지고, 상대의 방과 대화는 그대로예요. 나갔다는 사실도 상대에게 알리지 않아요. 나간 뒤에는 이전 대화를 다시 볼 수 없어요. 같은 상대와 다시 채팅해도 이전 대화는 보이지 않아요. 내가 메시지를 보내야 채팅 목록에 대화방이 다시 표시돼요. 두 크리에이터가 모두 나갔다면 노크부터 다시 해야 대화할 수 있어요. 노크를 받아주기 전에 보낸 쪽이 나가면 노크가 취소돼요. 프로젝트·팀 멤버가 채팅방에서 나가면 그 프로젝트·팀에서도 함께 나가요. 내가 보낸 메시지는 다른 참여자에게 남을 수 있어요. 프로젝트 리더는 프로젝트를 종료해야, 팀 관리자는 팀을 해체해야 채팅방을 나갈 수 있어요. ※ 1:1 채팅방은 나간 뒤에 이전 대화가 보이지 않으니, 지우고 싶은 메시지는 나가기 전에 지워 두세요.", "go": "web-faq-detail-6-8"}, {"id": "web-faq-detail-7-1", "cat": 7, "title": "어떤 알림이 오나요?", "rel": [], "text": "알림은 휴대폰 푸시 알림과 앱 안의 알림 목록에서 확인할 수 있어요. 알림 목록은 Discovery와 Chatty 화면 위쪽의 알림(🔔)에서 열고, 「전체」 「반응」 「관계」 「소식」 탭으로 나눠 볼 수 있어요. 반응: 내 포폴·영감·댓글과 프로젝트 게시판·일정·노트에 달린 댓글, 좋아요, 리스펙트, 멘션 관계: 팔로우, 일촌, 프로필 방문, 노크, 프로젝트 지원과 수락, 팀 초대 소식: GOAT 달성, 팔로우한 크리에이터의 새 포폴·새 프로젝트, 팔로우한 팀의 새 포폴, 참여 중인 프로젝트의 게시판·일정, 내 팀의 팀 포폴 등록, 「크리에이터 클럽」 알림 채팅방 새 메시지, 프로젝트·팀의 새 멤버 입장, 포폴 업로드 결과는 앱푸시로만 오고 알림 목록에는 남지 않아요.", "go": "web-faq-detail-7-1"}, {"id": "web-faq-detail-7-2", "cat": 7, "title": "알림을 끄고 싶어요", "rel": [], "text": "설정 > 알림 설정에서 앱푸시를 끌 수 있어요. 알림 목록 위쪽의 설정 아이콘으로도 들어가요. 스위치는 다섯 개예요. 「푸시 알림 받기」가 켜져 있을 때 「반응 알림」 「관계 알림」 「소식 알림」 「채티 알림」을 하나씩 켜고 끌 수 있어요. 채팅방 하나만 끄고 싶다면 그 채팅방 메뉴의 알림 스위치를 꺼요. 채팅방 알림을 꺼도 읽지 않은 메시지 수는 계속 집계돼요. ※ 이 설정으로 끌 수 있는 것은 휴대폰 푸시 알림이에요. 앱 안의 알림 목록에는 알림이 그대로 쌓여요.", "go": "web-faq-detail-7-2"}, {"id": "web-faq-detail-7-3", "cat": 7, "title": "알림은 얼마나 보관되나요?", "rel": [], "text": "알림 목록에는 최근 7일 동안 온 알림만 보여요. 7일이 지난 알림은 목록에서 빠져요. 알림을 하나씩 지우는 기능은 없어요.", "go": "web-faq-detail-7-3"}, {"id": "web-faq-detail-7-4", "cat": 7, "title": "소식 알림을 껐는데 팀·프로젝트 알림이 와요", "rel": [], "text": "내가 참여한 프로젝트와 내가 속한 팀의 알림 가운데 아래 세 가지는 「소식 알림」이 아니라 그 프로젝트·팀의 설정에서 꺼요. 프로젝트의 새 글과 새 공지: 프로젝트 설정의 「게시판 알림」 프로젝트의 새 일정, 일정 수정·삭제, 전날 안내: 프로젝트 설정의 「일정 알림」 내 팀의 팀 포폴 등록: 팀 설정의 「팀 포트폴리오 새 게시물」 프로젝트 지원·수락·거절, 멤버 내보내기, 팀 초대 등과 관련된 알림은 프로젝트·팀 설정에서 끌 수 없어요. 「관계 알림」 설정에서 꺼 주세요. 팔로우한 팀의 새 포폴 알림은 「소식 알림」이나 그 팀 더보기의 알림을 끄면 오지 않아요.", "go": "web-faq-detail-7-4"}, {"id": "web-faq-detail-7-5", "cat": 7, "title": "휴대폰 알림은 켰는데 앱 알림이 안 와요", "rel": [], "text": "아래 순서대로 앱푸시가 켜져 있는지 확인해 보세요. 1번과 2번은 모든 알림에서 확인해 주세요. 3번과 4번은 받으려는 알림 종류에 맞는 설정만 추가로 확인해 주세요. 휴대폰 설정의 Cre8orClub 알림 설정 > 알림 설정의 「푸시 알림 받기」 설정 > 알림 설정의 분류 스위치(반응·관계·소식·채티) 프로젝트·팀·채팅방마다 있는 알림 스위치, 팔로우한 크리에이터·팀 더보기의 알림 ※ 꺼 둔 동안의 앱푸시는 다시 켜도 뒤늦게 오지 않아요. 알림 목록에는 남아 있어요.", "go": "web-faq-detail-7-5"}, {"id": "web-faq-detail-7-6", "cat": 7, "title": "광고성 알림도 오나요?", "rel": [], "text": "광고성 알림은 받겠다고 따로 동의한 크리에이터에게만 보내요. 동의하지 않았다면 앱푸시도 오지 않고 알림 목록에도 남지 않아요. 동의했더라도 앱으로 보내는 광고성 알림은 오후 9시부터 다음 날 오전 8시(한국 시간)까지 보내지 않아요. 수신 동의는 언제든 철회할 수 있어요.", "go": "web-faq-detail-7-6"}, {"id": "web-faq-detail-7-7", "cat": 7, "title": "설정과 관계없이 오는 알림이 있나요?", "rel": [], "text": "네. 보안이나 오류처럼 서비스 이용에 꼭 필요한 알림은 알림 설정과 관계없이 보낼 수 있어요. 포폴 업로드에 실패했다는 알림은 반응·관계·소식·채티 스위치를 꺼 두어도 와요. 다만 「푸시 알림 받기」를 끄면 이 푸시 알림을 받을 수 없어요. 앱을 보고 있을 때도 이 푸시 알림은 발송되지 않아요.", "go": "web-faq-detail-7-7"}, {"id": "web-faq-detail-8-1", "cat": 8, "title": "부적절한 콘텐츠나 크리에이터를 신고하고 싶어요", "rel": [], "text": "신고할 대상의 더보기나 채팅방 메뉴에서 신고를 선택한 뒤, 사유 하나를 선택해 제출해요. 크리에이터: 프로필 더보기의 「사용자 신고」 포폴·영감: 게시물 더보기의 「게시물 신고」 채팅방: 채팅방 메뉴의 「채팅방 신고」. 1:1 채팅방은 노크를 받아주기 전에도 신고할 수 있어요. 프로젝트 리더와 팀 관리자는 자기 채팅방을 신고할 수 없으니, 기준에 어긋나는 참여자를 「사용자 신고」로 신고해 주세요. 맞는 사유가 없으면 「기타(직접 입력)」를 골라 내용을 적어요. 크리에이터와 게시물을 신고할 때는 사진·영상을 4개까지 함께 첨부할 수 있어요. 신고가 접수되면 내가 신고한 크리에이터나 콘텐츠는 내 피드와 다이얼에서 보이지 않고, 다른 크리에이터에게는 그대로 보여요. 신고만으로 차단되지는 않아요. 크리에이터클럽은 신고된 내용을 이용약관과 이용자 콘텐츠 약관에 비추어 확인해요.", "go": "web-faq-detail-8-1"}, {"id": "web-faq-detail-8-2", "cat": 8, "title": "신고하면 상대에게 알려지나요?", "rel": [], "text": "아니요, 누가 신고했는지는 신고 대상에게 알리지 않아요. 크리에이터·게시물·채팅방 신고는 익명으로 처리해요. 크리에이터클럽이 신고를 확인해 조치하면, 해당 크리에이터에게 조치 사유와 이의신청 방법을 안내해요. 다만 지적재산권 침해 신고는 익명으로 처리하지 않아요. 권리자인지 확인해야 해서, 신고한 크리에이터가 누구인지 상대에게 알려질 수 있어요. 신고가 접수되면 내가 신고한 크리에이터나 콘텐츠는 내 피드와 다이얼에서만 보이지 않고, 다른 크리에이터에게는 그대로 보여요. 신고와 차단은 따로 있는 기능이라, 신고만으로 상대가 차단되지는 않아요.", "go": "web-faq-detail-8-2"}, {"id": "web-faq-detail-8-3", "cat": 8, "title": "차단하면 어떻게 되나요?", "rel": [], "text": "차단하면 두 크리에이터가 서로의 프로필·콘텐츠·메시지를 볼 수 없게 돼요. 차단한 사실은 상대에게 알리지 않아요. 상대는 나에게 새로 노크하거나 1:1 채팅을 이어 갈 수 없어요. 둘 사이의 1:1 채팅방은 양쪽 목록에서 사라지고, 차단한 동안에는 그 대화를 볼 수 없어요. 두 사람의 팔로우와 일촌 관계가 해제되고, 일촌 신청도 취소돼요. 그룹 채팅방에서 일반 참여자끼리라면 서로의 메시지가 보이지 않아요. 방장·프로젝트 리더·팀 관리자와 차단 관계가 되면 그 방이나 프로젝트·팀에서 내보내지거나 들어갈 수 없게 돼요. 차단하려면 상대의 프로필이나 게시물·댓글의 더보기에서 「사용자 차단」을 눌러요. 채팅방 메뉴에는 차단이 없어서, 채팅방에서는 상대의 프로필이나 참여자 목록에서 차단해요. 차단을 풀려면 설정 > 계정 > 공개 범위 > 차단한 사용자에서 「차단 해제하기」를 눌러요. 차단을 해제해도 이전 팔로우·일촌 관계는 복구되지 않아 다시 맺어야 해요.", "go": "web-faq-detail-8-3"}, {"id": "web-faq-detail-8-4", "cat": 8, "title": "내 작업물이 도용됐어요", "rel": [], "text": "내 작업물을 허락 없이 쓴 콘텐츠를 찾았다면 그 게시물이나 크리에이터를 「지적재산권 침해」 사유로 신고해 주세요. 고객센터로 신고할 수도 있어요. 원본 작업 화면이나 처음 게시한 곳의 화면 등, 직접 만든 작업임을 보여 주는 사진을 함께 첨부하면 확인에 도움이 돼요. 크리에이터와 게시물 신고에는 사진·영상을 4개까지 붙일 수 있어요. 다른 크리에이터의 작업물을 자기 것처럼 올리는 것은 이용자 콘텐츠 약관이 금지하는 행위예요. 권리자는 저작권법 같은 법령이 정한 절차에 따라 게시중단이나 삭제를 요청할 수 있고, 크리에이터클럽은 법령과 정해진 절차에 따라 조치할 수 있어요. ※ 지적재산권 침해 신고는 익명으로 처리하지 않아, 신고한 크리에이터가 누구인지 상대에게 알려질 수 있어요.", "go": "web-faq-detail-8-4"}, {"id": "web-faq-detail-8-5", "cat": 8, "title": "이용이 제한됐어요, 어떻게 하나요?", "rel": [], "text": "먼저 크리에이터클럽이 보낸 조치 안내 메일을 확인해 주세요. 이용을 제한할 때는 지정한 이메일 주소로 사유와 기간, 이의신청 방법을 미리 안내해요. 긴급히 조치해야 하는 경우에는 조치 후에 안내해요. 메일함과 스팸메일함을 함께 봐 주세요. 위반의 종류와 정도에 따라 아래와 같은 조치를 받을 수 있어요. 경고 콘텐츠 게시중단·삭제·노출제한·전송 차단 게시·댓글·채팅 같은 일부 기능 제한 일정 기간 이용정지 이용계약 해지 계정 도용 신고가 들어왔다면 조사가 끝날 때까지 이용이 정지될 수 있어요. 정지된 계정으로는 로그인할 수 없어요. 로그인할 수 없다면 가입할 때 사용한 이메일 주소를 적어 support@cre8orclub.com으로 문의해 주세요.", "go": "web-faq-detail-8-5"}, {"id": "web-faq-detail-8-6", "cat": 8, "title": "이용 제한에 이의를 신청하고 싶어요", "rel": [], "text": "조치 안내 메일을 받은 날부터 14일 안에 support@cre8orclub.com으로 이의신청서를 보내 주세요. 어떤 조치에 대한 것인지와 동의하지 않는 이유를 적고, 판단에 도움이 될 자료가 있으면 함께 보내요. 크리에이터클럽은 이의신청서를 받은 날부터 15일 안에 이메일 등으로 답해요. 15일 안에 답하기 어려우면, 그 이유와 처리 일정을 안내할 수 있어요. 이의가 받아들여지면 조치를 해제하거나 필요한 범위에서 수정해요. 이용정지나 이용계약 해지, 만 14세 미만으로 확인돼 받은 계정 조치도 같은 방법으로 신청해요. ※ 프로젝트·팀 같은 모임의 관리자가 참여를 거절하거나 나를 내보낸 것은 크리에이터클럽의 조치가 아니라서 이의신청 대상이 아니에요. 부당하다고 느끼면 그 관리자를 신고할 수 있어요.", "go": "web-faq-detail-8-6"}], "core": {"name": "한눈에 보기", "ids": ["web-faq-detail-0-1", "web-faq-detail-0-2", "web-faq-detail-0-3", "web-faq-detail-1-1", "web-faq-detail-3-1", "web-faq-detail-4-2", "web-faq-detail-6-1", "web-faq-detail-5-1", "web-faq-detail-5-2", "web-faq-detail-5-3", "web-faq-detail-5-7", "web-faq-detail-4-3"]}};</script><script>(() => {
  const $ = id => document.getElementById(id);
  const page = document.querySelector(".faq2"), list = $("list"), tabs = $("tabs"), q = $("q"), count = $("count");
  const catName = Object.fromEntries(FAQ.cats.map(c => [c.num, c.name]));
  const byId = Object.fromEntries(FAQ.qs.map(x => [x.id, x]));
  const core = FAQ.core.ids.map(id => byId[id]);  // 첫 탭 = 핵심 질문만, 사용자 흐름 순서(core.json)
  let cur = "core";
  const esc = s => s.replace(/[&<>"]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
  const norm = s => s.replace(/\s+/g, "").toLowerCase();
  const tabList = [{ key: "core", name: FAQ.core.name, press: "핵심 질문 목록" }, ...FAQ.cats.map(c => ({ key: String(c.num), name: c.name, press: "그 카테고리 질문 목록" }))];
  tabs.innerHTML = tabList.map(t => `<button type="button" class="faq2-tab" data-tab="${t.key}" style="cursor:pointer" data-press="${esc(t.name)} 탭 → ${t.press}">${esc(t.name)}</button>`).join("");
  tabs.addEventListener("click", e => { const b = e.target.closest("[data-tab]"); if (b) setTab(b.dataset.tab, true); });
  const mark = (t, ws) => ws.length ? esc(t).replace(new RegExp(ws.map(w => [...w.replace(/\s+/g, "")].map(c => esc(c).replace(/[.*+?^${}()|[\]\\]/g, "\\$&")).join("\\s*")).join("|"), "gi"), m => `<mark>${m}</mark>`) : esc(t);  // 한 번에 바꿔야 «mark» 같은 검색어가 앞서 넣은 태그를 깨지 않고, 글자 사이 띄어쓰기를 허용해야 검색(띄어쓰기 무시)과 강조가 맞는다
  const row = (x, ws) => `<div class="faq2-q"><div class="faq2-q__btn" data-go-screen="${x.go}" role="link" style="cursor:pointer" data-press="${esc(x.title)} 줄 → 답 화면"><span class="faq2-q__txt"><span class="faq2-q__cat">${esc(catName[x.cat])}</span><span class="faq2-q__title">${mark(x.title, ws)}</span></span><img class="faq2-q__arrow" src="../assets/icons/list_next@3x.png" alt=""></div></div>`;
  function render() {
    const words = q.value.trim().split(/\s+/).filter(Boolean), search = words.length > 0;
    page.classList.toggle("is-search", search);
    page.classList.toggle("is-cat", !search && cur !== "core");
    let rows;
    if (search) {
      const ws = words.map(norm);
      const a = FAQ.qs.filter(x => ws.every(w => norm(x.title).includes(w)));
