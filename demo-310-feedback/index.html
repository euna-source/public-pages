<!doctype html>
<html lang="ko">
<head>
<meta name="robots" content="noindex, nofollow">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>3.1.0 — 지난 피드백 반영</title>
<style>
  :root { --ink:#111; --sub:#8a8a8a; --line:#e6e6e6; --bg:#fff; }
  * { box-sizing:border-box; }
  body { margin:0; background:var(--bg); color:var(--ink); font-family:-apple-system,"Apple SD Gothic Neo","Pretendard","Noto Sans KR",sans-serif; line-height:1.3; }
  main { max-width:1000px; margin:0 auto; padding:56px 40px 72px; }
  header { margin-bottom:44px; }
  header span { font-size:14px; color:var(--sub); }
  h1 { font-size:30px; margin:6px 0 0; font-weight:700; letter-spacing:-0.01em; }
  h1 b { color:var(--sub); font-weight:400; margin:0 6px; }
  .big { display:grid; grid-template-columns:56px 1fr; gap:16px; padding:30px 0; border-top:1px solid var(--ink); align-items:baseline; }
  .big .n { font-size:26px; font-weight:700; color:var(--sub); }
  .big .was { font-size:20px; color:var(--sub); margin:0 0 6px; }
  .big .now { font-size:34px; font-weight:700; letter-spacing:-0.015em; margin:0; }
  .big .how { font-size:17px; color:var(--sub); margin:8px 0 0; }
  .etc { border-top:1px solid var(--line); padding:22px 0 0; margin-top:6px; font-size:17px; color:var(--sub); }
  .etc b { color:var(--ink); font-weight:600; margin-right:10px; }
  footer { display:grid; grid-template-columns:1fr 1fr; gap:32px; margin-top:48px; }
  footer div { border-top:2px solid var(--ink); padding-top:12px; }
  footer h3 { font-size:13px; color:var(--sub); letter-spacing:0.04em; margin:0 0 6px; font-weight:600; }
  footer p { margin:0; font-size:22px; font-weight:700; }
  footer p small { display:block; font-size:15px; font-weight:400; color:var(--sub); margin-top:4px; }
  @media (max-width:720px){ main{padding:32px 20px;} h1{font-size:22px;} .big .now{font-size:26px;} footer{grid-template-columns:1fr;} }
</style>
</head>
<body>
<main>
  <header>
    <span>크리에이터클럽 3.1.0 · 2026. 9. 11 · 지난주 지적 → 이번 반영</span>
    <h1>발견<b>→</b>노크<b>→</b>채팅<b>→</b>라운지<b>→</b>팀</h1>
  </header>

  <div class="big"><div class="n">1</div><div><p class="now">노크를 한 뒤 다음은 무엇을? 안내 부재</p></div></div>

  <div class="big"><div class="n">2</div><div><p class="now">노크까지의 대화가 멀어, 내 인맥과 바로 채팅 가능</p></div></div>

  <div class="big"><div class="n">3</div><div><p class="now">팀 강조</p></div></div>

  <p class="etc"><b>그 밖에</b>모션배너 문구 클럽 톤 · O/X 답하면 닫힘 · 키워드 문구 수정, 고르면 끝 · 다이얼 처음으로/뒤로/나가기 — 당연히 반영.</p>

  <footer>
    <div><h3>추가</h3><p>앱 흔들기<small>캡처와 함께 바로 피드백. 서포터즈 기간에 먼저.</small></p></div>
    <div><h3>아직</h3><p>유튜브 연동<small>API 연동 중 실효성 있다고 판단. 실행 전.</small></p></div>
  </footer>
</main>
</body>
</html>
