-width:0}.stats{display:flex;gap:18px;flex-wrap:wrap;padding-bottom:19px;margin-bottom:20px;border-bottom:1px solid var(--line)}.stats strong{font-size:24px;margin-right:5px}.cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:14px}.card{background:#fff;border:1px solid var(--line);border-radius:13px;padding:20px}.card.action:hover{border-color:var(--blue)}.card .big{font-size:24px;font-weight:700}.summary{display:flex;justify-content:space-between;align-items:center;gap:12px}.list{display:grid;grid-template-columns:repeat(auto-fill,minmax(245px,1fr));gap:9px}.node{display:block;width:100%;padding:13px 15px;min-height:74px}.node .title{display:block;font-weight:600}.node small{display:block;font-size:12px;overflow-wrap:anywhere}.node.related{border-color:#b18a36;background:#fff8e9}.node.selected{border-color:var(--blue);box-shadow:inset 3px 0 var(--blue)}.columns{display:grid;grid-template-columns:minmax(0,1fr) minmax(270px,.85fr);gap:18px}.section{background:#fff;border:1px solid var(--line);border-radius:13px;padding:20px;margin-bottom:16px;min-width:0}.detail{scroll-margin-top:15px}.flowcols{display:grid;grid-template-columns:1fr 1fr;gap:16px}.flowrows{display:flex;flex-direction:column;gap:6px;max-height:440px;overflow:auto}.flowrows button{font-size:13px}.flowrows small{display:block}.warning{border-left:3px solid #ca8e38;padding:8px 13px;background:#fff7e8;color:#684923}.evidence{padding:11px 0;border-top:1px solid var(--line);font-size:13px}.evidence code{word-break:break-all}.source-text{white-space:pre-wrap;font-size:13px;background:#f7f9fc;padding:12px;border-radius:8px;overflow-wrap:anywhere;max-height:280px;overflow:auto}.kv{display:grid;grid-template-columns:105px minmax(0,1fr);gap:8px;font-size:13px}.kv div:nth-child(odd){color:var(--muted)}.diagram{overflow:auto;border:1px solid var(--line);border-radius:10px;background:#fbfcfe}.diagram svg{display:block;transform-origin:top left}.diagram text{font:12px -apple-system,sans-s </style></head><body><header class="top"><div class="brand">CRE8ORCLUB / APP MAP</div><h1>C8 기능 지도 · 공개 범위</h1><p id="scope"></p><span class="badge">공식 소개의 기능 요약</span><div class="toolbar"><input id="search" type="search" aria-label="화면 검색" placeholder="공개 기능 검색"><button id="home">전체 숲</button></div></header><div class="layout"><nav id="nav" class="nav" aria-label="메뉴 그룹"></nav><main id="main"></main></div><script id="map-data" type="application/json">{"version": "26.46.0", "snapshot": "26.46.0-20261105.1", "mode": "public", "scope": "공식 공개 소개에서 확인한 C8 기능만 담았습니다. 26.46 전체 기획·구현 검증본이 아닙니다.", "groups": {"discovery": "Discovery", "club": "Club", "chatty": "Chatty", "my": "My", "finder": "Finder", "upload": "올리기", "first": "가입·로그인", "setting": "설정", "notice": "알림·토스트", "outside": "앱 밖·권한", "web": "웹", "common": "공통"}, "nodes": [{"id": "chatty-room", "title": "채팅", "group": "chatty", "kind": "screen", "public_basis": "https://apps.apple.com/kr/app/cre8orclub-creative-network/id6737261549"}, {"id": "club-main-project-apply", "title": "프로젝트 지원", "group": "chatty", "kind": "screen", "public_basis": "https://apps.apple.com/kr/app/cre8orclub-creative-network/id6737261549"}, {"id": "club-main-project", "title": "프로젝트 모집", "group": "chatty", "kind": "screen", "public_basis": "https://apps.apple.com/kr/app/cre8orclub-creative-network/id6737261549"}, {"id": "club-main-team", "title": "팀", "group": "chatty", "kind": "screen", "public_basis": "https://apps.apple.com/kr/app/cre8orclub-creative-network/id6737261549"}, {"id": "club-team-intro", "title": "팀 소개", "group": "chatty", "kind": "screen", "public_basis": "https://apps.apple.com/kr/app/cre8orclub-creative-network/id6737261549"}, {"id": "club-team-members", "title": "팀 멤버", "group": "chatty", "kind": "screen", "public_basis": "https://apps.apple.com/kr/app/cre8orclub-creative-network/id6737261549"}, {"id": "club-team-portfolio", "title": "팀 포트폴리오", "group": "chatty", "kind": "screen", "public_basis": "https://apps.apple.com/kr/ orclub-creative-network/id6737261549"}], "menus": [], "entry_points": []}</script><script>
'use strict';const D=JSON.parse(document.querySelector('#map-data').textContent),N=new Map(D.nodes.map(n=>[n.id,n]));let group='',query='',selected='',zoom=1;const $=x=>document.querySelector(x),esc=x=>String(x??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function btn(id){let n=N.get(id);return n?`<button class="node" data-node="${esc(id)}"><span class="title">${esc(n.title)}</span><small>${esc(D.groups[n.group])}</small></button>`:'';}
function render(){const groups=Object.entries(D.groups).filter(([g])=>D.nodes.some(n=>n.group===g));$('#nav').innerHTML='<h3>기능 묶음</h3><button data-group="" class="'+(!group?'active':'')+'">전체 '+D.nodes.length+'</button>'+groups.map(([g,t])=>`<button data-group="${g}" class="${group===g?'active':''}">${esc(t)} <small>${D.nodes.filter(n=>n.group===g).length}</small></button>`).join('');let body='';
if(selected){const n=N.get(selected),ins=D.edges.filter(e=>e.to===selected),outs=D.edges.filter(e=>e.from===selected);body=`<section class="section detail"><div class="split"><div><span class="badge">${esc(D.groups[n.group])}</span><h2>${esc(n.title)}</h2></div><button id="list">목록으로</button></div><p class="muted">공식 소개에서 설명한 기능 관계입니다. 실제 중간 화면은 생략될 수 있습니다.</p><div class="controlrow"><strong>주변 흐름</strong><button data-zoom="-.15" aria-label="축소">−</button><span>${Math.round(zoom*100)}%</span><button data-zoom=".15" aria-label="확대">＋</button><button data-zoom="reset">크기 맞춤</button></div><div class="diagram"><svg role="img" aria-label="기능 관계" width="${800*zoom}" height="${Math.max(180,(outs.length+ins.length)*55)*zoom}" viewBox="0 0 800 ${Math.max(180,(outs.length+ins.length)*55)}"><rect class="chosen" x="290" y="65" width="220" height="45" rx="7"/><text x="305" y="92">${esc(n.title)}</text>${ins.map((e,i)=>`<g data-node="${esc(e.from)}"><path d="M225 ${30+i*55} L290 87"/><rect x="10" y="${10+i*55}" width="215" height="40" rx="7"/><text x="20" y="${35+i*55}">${esc(N.get(e.from).title)}</text></g>`).join('')}${outs.map((e,i)=>`<g data-node="${esc(e.to)}"><path d="M510 87 L575 ${30+i*55}"/><rect x="575" y="${10+i*55}" width="215" height="40" rx="7"/><text x="585" y="${35+i*55}">${esc(N.get(e.to).title)}</text></g>`).join('')}</svg></div><p class="mobile-flow muted">아래 연결 목록에서 기능을 선택하세요.</p><div class="flowcols"><div><h3>들어오는 길 ${ins.length}</h3>${ins.map(e=>btn(e.from)+`<p class="subtle">${esc(e.label)}</p>`).join('')||'<p class="muted">공개 소개의 연결 정보 없음</p>'}</div><div><h3>나가는 길 ${outs.length}</h3>${outs.map(e=>btn(e.to)+`<p class="subtle">${esc(e.label)}</p>`).join('')||'<p class="muted">공개 소개의 연결 정보 없음</p>'}</div></div></section><section class="section"><h3>공개 근거</h3><a href="${esc(n.public_basis)}" target="_blank" rel="noopener noreferrer">Cre8orClub 공식 App Store 소개</a></section>`;}
else if(group||query){let ns=D.nodes.filter(n=>(!group||n.group===group)&&(!query||n.title.toLowerCase().includes(query.toLowerCase())));body=`<h2>${esc(D.groups[group]||'공개 기능')} · ${ns.length}</h2><div class="list">${ns.map(n=>btn(n.id)).join('')}</div>`;}
else{body=`<div class="stats"><div><strong>${D.nodes.length}</strong>공개 기능</div><div><strong>${D.edges.length}</strong>소개에 나온 기능 관계</div></div><h2>전체 숲에서 시작하세요</h2><p class="muted">기능 묶음을 고른 뒤 연결된 기능과 공개 근거를 확인하세요.</p><div class="cards">${groups.map(([g,t])=>`<button class="card" data-group="${g}"><strong>${esc(t)}</strong><p>${esc(D.nodes.filter(n=>n.group===g).slice(0,3).map(n=>n.title).join(' · '))}</p><small>공개 기능 보기 →</small></button>`).join('')}</div>`;}
$('#main').innerHTML=body+'<footer>공식 공개 소개의 기능 요약입니다. 전체 화면·정책·구현을 검증한 지도는 아닙니다.</footer>';}
$('#scope').textContent=D.scope;$('#search').oninput=e=>{query=e.target.value;selected='';render()};$('#home').onclick=()=>{group='';query='';selected='';$('#search').value='';render()};document.addEventListener('click',e=>{const b=e.target.closest('[data-node],[data-group],[data-zoom],#list');if(!b)return;if(b.hasAttribute('data-node')){selected=b.dataset.node;zoom=1;window.scrollTo(0,0)}else if(b.hasAttribute('data-group')){group=b.dataset.group;selected=''}else if(b.hasAttribute('data-zoom')){zoom=b.dataset.zoom==='reset'?1:Math.min(1.8,Math.max(.5,zoom+Number(b.dataset.zoom)))}else selected='';render()});render();
</script></body></html>
