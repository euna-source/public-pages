<!doctype html>
<html lang="ko">
<head>
<meta name="robots" content="noindex, nofollow">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>크루네 크루 프로필 미리보기</title>
<style>
  body { margin: 0; font-family: -apple-system, "Apple SD Gothic Neo", "Noto Sans KR", sans-serif; background: #f4f3f8; color: #1d1d22; }
  main { max-width: 860px; margin: 0 auto; padding: 24px 16px 48px; }
  h1 { font-size: 22px; margin: 0 0 6px; }
  p.lead { margin: 0 0 20px; color: #5c5c66; line-height: 1.55; }
  .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(240px, 1fr)); gap: 18px; }
  figure { margin: 0; background: #fff; border-radius: 16px; padding: 12px; box-shadow: 0 1px 3px rgb(0 0 0 / .06); }
  figure img { width: 100%; height: auto; border-radius: 10px; display: block; }
  figcaption { font-size: 14px; line-height: 1.5; margin-top: 10px; }
  figcaption b { display: block; font-size: 15px; }
</style>
</head>
<body>
<main>
  <h1>크루 프로필 미리보기</h1>
  <p class="lead">크루 화면에서 카드를 누르면 프로필이 열려요. 맡은 일·성격·말투·좋아하는 것이 담겨 있고, 맡은 일은 직접 더할 수 있어요. 채팅방에서 크루 얼굴을 눌러도 같은 프로필이 아래에서 올라와요.</p>
  <div class="grid">
    <figure><img src="gallery-320-light.jpg" alt="크루 화면 카드 목록"><figcaption><b>크루 화면</b>카드를 누르면 프로필, 말 걸기는 바로 채팅방</figcaption></figure>
    <figure><img src="kiki-320-light.jpg" alt="키키 프로필 화면"><figcaption><b>키키 프로필</b>큰 캐릭터를 누르면 다른 동작을 보여 줘요</figcaption></figure>
    <figure><img src="edit-320-light.jpg" alt="프로필 고치기 화면"><figcaption><b>프로필 고치기</b>맡은 일 더하기, 성격·말투 고치기, 좋아하는 것 넣고 빼기</figcaption></figure>
    <figure><img src="sheet-390-dark.jpg" alt="채팅방에서 연 키키 프로필"><figcaption><b>채팅방에서 얼굴 누르기</b>더한 역할에는 「샐리가 더함」 표시</figcaption></figure>
    <figure><img src="group-390-dark.jpg" alt="그룹방에서 연 크루 고르기"><figcaption><b>그룹방</b>위 얼굴 줄에서 크루를 바꿔 봐요</figcaption></figure>
  </div>
</main>
</body>
</html>
