<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><title>Cre8orClub · Weekly Best 이메일 시안</title><style>*{box-sizing:border-box}body{margin:0;background:#ffffff;color:#181818;font-family:-apple-system,BlinkMacSystemFont,'Apple SD Gothic Neo','Malgun Gothic',sans-serif}.toolbar{max-width:960px;margin:auto;padding:32px 20px 24px}.top{display:flex;justify-content:space-between;gap:20px;align-items:baseline}.brand{font-size:20px;font-weight:800;letter-spacing:-.6px}.subtitle{font-size:13px;color:#51564e}.controls{display:flex;flex-wrap:wrap;gap:8px;margin:22px 0 12px}button,a{font:inherit}button{border:0;border-radius:999px;background:#f2f3f4;padding:11px 16px;cursor:pointer;font-size:14px;color:#181818}button[aria-pressed=true]{background:#121212;color:#fff;border-color:#121212}a{font-size:13px;color:#181818;text-underline-offset:4px}.note{font-size:13px;line-height:1.7;color:#555e4f;margin:0}.frame{max-width:600px;margin:0 auto 40px}iframe{display:block;border:0;width:100%;background:#ffffff;min-height:0;height:2200px}@media(max-width:620px){.toolbar{padding:22px 20px}.top{display:block}.subtitle{margin-top:8px}.controls{gap:6px}button{padding:10px 12px}}</style></head><body><header class="toolbar"><div class="top"><div class="brand">Cre8orClub</div><div class="subtitle">Weekly Best · 화이트 안내 이메일</div></div><div class="controls"><button type="button" data-case="single" aria-pressed="false">작품 1개 수상</button><button type="button" data-case="multiple" aria-pressed="true">작품 2개 수상</button></div><p class="note" id="note">작품 2개 + 크리에이터 부문 수상 예시입니다. 두 번째 작품의 4위·1만 원은 예시이며 실제 수상 내역이 아닙니다.</p><p><a id="download" href="multiple.html" download="Cre8orClub-Weekly-Best.html">현재 이메일 HTML 다운로드</a></p></header><main class="frame"><iframe id="email" title="수상 안내 이메일 미리보기" src="multiple.html"></iframe></main><footer class="toolbar" style="padding-top:0"><p class="note">화이트 배경과 일반 안내 메일 구성을 기본으로, 총 경품 한 곳만 블랙으로 강조했습니다. 이름과 작품명은 발송 전에 입력해야 합니다.</p></footer><script>const frame=document.getElementById('email');function fit(){try{frame.style.height=Math.ceil(frame.contentDocument.body.getBoundingClientRect().height)+'px'}catch(e){}}frame.addEventListener('load',()=>{fit();frame.contentDocument.fonts.ready.then(fit)});window.addEventListener('resize',fit);function choose(name){frame.src=name+'.html';document.querySelectorAll('button[data-case]').forEach(b=>b.setAttribute('aria-pressed',String(b.dataset.case===name)));document.getElementById('download').href=name+'.html';document.getElementById('note').textContent=name==='multiple'?'작품 2개 + 크리에이터 부문 수상 예시입니다. 두 번째 작품의 4위·1만 원은 예시이며 실제 수상 내역이 아닙니다.':'작품 부문 2위 + 크리에이터 부문 5위, 총 상품권 4만 원의 원문 예시입니다. 작품명은 발송 전에 입력해야 합니다.';}document.querySelectorAll('button[data-case]').forEach(b=>b.addEventListener('click',()=>choose(b.dataset.case)));if(new URLSearchParams(location.search).get('case')==='single')choose('single');</script></body></html>
