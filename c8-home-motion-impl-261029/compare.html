<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><link rel="icon" href="data:,"><title>C8 웹·릴스 모션 대조</title><link rel="stylesheet" href="generated/tokens.css"><style>
@font-face{font-family:C8Caption;src:url('assets/caption.woff2') format('woff2');font-weight:700;font-display:block}*{box-sizing:border-box}body{margin:0;padding:24px;color:#1f1f1f;background:#fff;font-family:system-ui,sans-serif;line-height:1.6}main{max-width:1100px;margin:auto}h1{font-size:clamp(28px,5vw,44px);line-height:1.3}a{color:inherit}button,input{font:inherit}button{padding:10px 20px;min-height:44px;border:1px solid #888;background:white;border-radius:8px;cursor:pointer}.pair{display:grid;grid-template-columns:1fr 1fr;gap:24px}.stage{position:relative;aspect-ratio:9/16;border:1px solid #aaa;overflow:hidden}.web-stage{display:grid;place-items:center}.web-copy{position:absolute;left:10%;top:39.583333%;width:80%;font-family:C8Caption,sans-serif;font-weight:700;font-size:var(--caption-size);line-height:1.5;text-align:center;margin:.67em 0;white-space:nowrap}.web-word{display:inline-block;white-space:pre}.web-ending{position:absolute;left:10%;top:39.583333%;width:80%;font-family:C8Caption,sans-serif;font-weight:700;font-size:var(--logo-size);line-height:normal;text-align:center}.web-ending p{font-size:var(--ending-copy-size);margin:var(--ending-gap) 0 0}.reel{width:1080px;height:1920px;border:0;position:absolute;inset:0;transform-origin:0 0}input{width:100%}[hidden]{display:none!important}@media(max-width:600px){body{padding:16px}.pair{gap:8px}}
</style></head><body><main><a href="index.html">검증 목록</a><h1>같은 토큰을 웹과 릴스에 넣었어요</h1><p>어절 시차 50ms. 웹은 CSS linear(), 릴스는 GSAP 해석해를 써요. 이 화면은 시간 고정 대조용이에요.</p><label for="time">시각 <output id="timeOut">0.00</output>초</label><input id="time" type="range" min="0" max="6" step="0.01" value="0"><button id="play" type="button">나란히 재생</button><p id="reduce"></p><div class="pair"><section><h2>웹</h2><div class="stage web-stage"><div class="web-copy" id="webCopy"><span class="web-word">300자,</span><span class="web-word"> 다</span><span class="web-word"> 채웠을까요?</span></div><div class="web-ending" id="webEnding" hidden><div class="web-logo" id="webLogo">C8</div><p>크리에이터클럽</p></div></div></section><section><h2>릴스</h2><div class="stage" id="reelStage"><iframe title="릴스 자막과 엔딩 로고" class="reel" id="reel" src="reel.html"></iframe></div></section></div></main><script type="module">
import {springs,stagger} from './generated/motion.mjs';
const frame=document.querySelector('#reel'),slider=document.querySelector('#time'),pref=matchMedia('(prefers-reduced-motion: reduce)');
while(!frame.contentWindow.__reelReady)await new Promise(r=>setTimeout(r,20));
await frame.contentWindow.document.fonts.ready;await document.fonts.load('700 20px C8Caption');
const css=getComputedStyle(document.documentElement),animations=[];
function make(el,frames,key,delay=0){const s=springs[key],n=key.replace('.','-');const a=el.animate(frames,{duration:s.duration*1000,easing:css.getPropertyValue(`--${n}-ease`).trim(),fill:'both',delay:delay*1000});a.pause();animations.push(a);}
let wordDistance=document.querySelector('.web-stage').clientWidth/1080*48;
document.querySelectorAll('.web-word').forEach((w,i)=>{make(w,[{transform:`translateY(${wordDistance}px)`},{transform:'translateY(0)'}],'spatial.default',i*stagger);make(w,[{opacity:0},{opacity:1}],'effects.fast',i*stagger);});
make(document.querySelector('#webLogo'),[{transform:'scale(.8)'},{transform:'scale(1)'}],'spatial.fast',3);
function scale(){const ratio=document.querySelector('#reelStage').clientWidth/1080;const stage=document.querySelector('.web-stage');for(const [key,size] of Object.entries({'caption-size':76,'logo-size':200,'ending-copy-size':44,'ending-gap':40}))stage.style.setProperty('--'+key,`${size*ratio}px`);frame.style.transform=`scale(${document.querySelector('#reelStage').clientWidth/1080})`;wordDistance=document.querySelector('.web-stage').clientWidth/1080*48;for(const a of animations){if(a.effect.target.classList.contains('web-word')&&'transform'in a.effect.getKeyframes()[0])a.effect.setKeyframes([{transform:`translateY(${wordDistance}px)`},{transform:'translateY(0)'}]);}}
new ResizeObserver(scale).observe(document.querySelector('#reelStage'));scale();
function seek(t){slider.value=t;document.querySelector('#timeOut').value=t.toFixed(2);const reduced=pref.matches;animations.forEach(a=>a.currentTime=reduced?6000:t*1000);document.querySelector('#webCopy').hidden=t>=3;document.querySelector('#webEnding').hidden=t<3;frame.contentWindow.seekReel(reduced?(t>=3?6:2):t);}
let raf=null;slider.addEventListener('input',()=>{cancelAnimationFrame(raf);raf=null;document.querySelector('#play').textContent='나란히 재생';seek(+slider.value);});
document.querySelector('#play').onclick=()=>{if(raf!==null){cancelAnimationFrame(raf);raf=null;document.querySelector('#play').textContent='나란히 재생';return;}const start=performance.now();document.querySelector('#play').textContent='멈춤';const tick=now=>{const t=Math.min(6,(now-start)/1000);seek(t);if(t<6)raf=requestAnimationFrame(tick);else{raf=null;document.querySelector('#play').textContent='나란히 재생';}};raf=requestAnimationFrame(tick);};
pref.addEventListener('change',()=>seek(+slider.value));document.querySelector('#reduce').textContent=pref.matches?'움직임 줄이기 · 완성 상태로 대조해요':'';window.__compare={seek,animations,frame,get wordDistance(){return wordDistance;},ready:true};seek(0);
</script></body></html>
