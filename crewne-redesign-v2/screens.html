const NOTE = {cb: "A Carbon — IBM Plex를 만든 IBM의 아이콘이에요. 글꼴과 같은 가족이라 획 끝과 모서리가 Plex처럼 반듯해요. 웹앱에 써도 되는 공개 라이선스예요.",
  ph: "B Phosphor — 둥글고 부드러운 공개 아이콘이에요. 작은 자리는 굵은 획, 큰 자리는 보통 획으로 굵기를 맞췄어요. 웹앱에 써도 돼요.",
  sf: "C SF Symbols — iOS 26 기본 아이콘이에요. 이번엔 정사각 틀에 넣어 크기를 맞추고 눈 대신 체크로 바꿨어요. 애플 기기 앱용 라이선스라 웹앱엔 확인이 필요해요."};
function apply(set) {
  document.querySelectorAll('.sets button').forEach(b => b.classList.toggle('on', b.dataset.set === set));
  document.getElementById('note').textContent = NOTE[set];
  document.querySelectorAll('i.ic').forEach(el => {
    const k = el.dataset.i;
    if (set === 'sf') { el.innerHTML = ''; el.classList.add('mask'); el.style.setProperty('--m', `url(sf2/${k}.png)`); }
    else { el.classList.remove('mask'); el.style.removeProperty('--m'); el.innerHTML = ICONS[set][k] || ''; }
  });
  try { history.replaceState(null, '', '#' + set); } catch (e) {}
}
document.querySelectorAll('.sets button').forEach(b => b.onclick = () => apply(b.dataset.set));
apply(['cb', 'ph', 'sf'].includes(location.hash.slice(1)) ? location.hash.slice(1) : 'cb');
</script></body></html>
