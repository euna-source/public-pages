<html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>크루네 리디자인 · 기록</title><meta name="robots" content="noindex">

<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+KR:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600;700&display=swap">
<style>:root { --bg: #F2F2F7; --blk: #fff; --ink: #121212; --ink2: rgba(18,18,18,.7); --ink3: rgba(18,18,18,.5); --ac: #3A46E0; --tint: rgba(58,70,224,.1); --gray: rgba(18,18,18,.06); --warn: #FF9500; --cl: #D97757; --cx: #6E7BF2; }
* { box-sizing: border-box; margin: 0; }
body { background: #E9E9EE; color: var(--ink); font-family: "IBM Plex Sans KR", "Apple SD Gothic Neo", sans-serif; -webkit-font-smoothing: antialiased; }
/* 고정폭은 숫자만 — 한글이 섞인 메타에 Mono를 걸면 자간이 벌어진다 */
.num, .tm, .sb, .cnt { font-family: "IBM Plex Mono", "IBM Plex Sans KR", monospace; }
.m, .meta, .dev { font-variant-numeric: tabular-nums; }
.top { padding: 20px 20px 4px; max-width: 1320px; margin: 0 auto; }
.setbar { position: sticky; top: 0; z-index: 9; padding: 8px 20px; background: rgba(233,233,238,.88); -webkit-backdrop-filter: blur(16px); backdrop-filter: blur(16px); }
.setbar .sets { max-width: 1280px; margin: 0 auto; }
.top h1 { font-size: 24px; font-weight: 700; } .top p { font-size: 13px; color: var(--ink2); margin-top: 2px; }
.sets { display: flex; gap: 6px; flex-wrap: wrap; }
.sets button { font: 600 14px "IBM Plex Sans KR", sans-serif; height: 36px; padding: 0 14px; border-radius: 18px; border: 0; background: rgba(18,18,18,.08); color: var(--ink); cursor: pointer; }
.sets button.on { background: var(--ink); color: #fff; }
.note { font-size: 13px; color: var(--ink2); line-height: 1.5; max-width: 1280px; margin: 6px auto 0; padding: 0 20px; }
.grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(340px, 1fr)); gap: 28px 24px; padding: 12px 20px 60px; max-width: 1320px; margin: 0 auto; }
.ph-wrap figcaption { font-size: 13px; font-weight: 600; color: var(--ink2); margin: 0 0 8px 4px; }
.phone { position: relative; width: 100%; max-width: 393px; height: 880px; border-radius: 44px; overflow: hidden; background: var(--bg); box-shadow: 0 1px 0 rgba(0,0,0,.04), 0 18px 40px rgba(0,0,0,.08); }
.sb { height: 46px; padding: 16px 30px 0; font-size: 14px; font-weight: 600; }
.scr { position: absolute; inset: 46px 0 0; padding: 0 16px; overflow: hidden; }
/* 아이콘 — 크기마다 정사각 틀. SF는 그림을 마스크로 써서 글자색을 따른다 */
i.ic { display: inline-flex; align-items: center; justify-content: center; flex: none; color: inherit; }
i.ic svg { width: 100%; height: 100%; display: block; }
i.ic.s { width: 15px; height: 15px; } i.ic.m { width: 21px; height: 21px; } i.ic.l { width: 26px; height: 26px; }
i.ic.mask { background: currentColor; -webkit-mask: var(--m) center / contain no-repeat; mask: var(--m) center / contain no-repeat; }
i.ic.mask.s { width: 19px; height: 19px; margin: -2px; } i.ic.mask.m { width: 26px; height: 26px; margin: -2.5px; } i.ic.mask.l { width: 30px; height: 30px; margin: -2px; }
.lt { display: flex; align-items: center; justify-content: space-between; margin: 8px 2px 14px; }
.lt h1 { font-size: 30px; font-weight: 700; letter-spacing: -.01em; }
.pill { font-size: 13px; font-weight: 500; padding: 6px 12px; border-radius: 16px; background: var(--gray); color: var(--ink2); }
.ib { width: 36px; height: 36px; border-radius: 18px; display: inline-flex; align-items: center; justify-content: center; } .ib.g { background: var(--gray); }
.blk { background: var(--blk); border-radius: 22px; padding: 14px 16px; margin-bottom: 12px; } .blk.pad0 { padding: 6px 16px; }
.bh { display: flex; align-items: center; gap: 8px; font-size: 13px; font-weight: 500; color: var(--ink2); margin-bottom: 10px; }
.bh .r { margin-left: auto; display: flex; align-items: center; gap: 8px; color: var(--ink3); }
/* 크루는 원·배경 없이 누끼로 */
.av { height: 26px; width: auto; max-width: 34px; object-fit: contain; display: block; margin: -3px 0; }
.dev { font-size: 11px; display: inline-flex; align-items: center; gap: 4px; } .d { width: 6px; height: 6px; border-radius: 50%; background: var(--ac); display: inline-block; }
.bd { display: inline-flex; align-items: center; gap: 4px; height: 22px; padding: 0 7px; border-radius: 6px; background: var(--gray); color: var(--ink2); font-size: 12px; font-weight: 600; white-space: nowrap; }
.bd.a { background: var(--tint); color: var(--ac); }
.hero { display: flex; justify-content: space-between; gap: 8px; } .hero > div { min-width: 0; }
.meta { font-size: 11.5px; color: var(--ink3); margin-left: 6px; }
.hero h2, .blk > h2 { font-size: 21px; font-weight: 700; line-height: 1.3; margin: 8px 0 3px; letter-spacing: -.01em; }
.sub { font-size: 14px; color: var(--ink2); line-height: 1.5; } .sub.c { text-align: center; margin: 2px 0 10px; }
.plush { width: 72px; height: 92px; object-fit: contain; object-position: center bottom; flex: none; margin-top: -6px; }
.sl { font-size: 12.5px; font-weight: 500; color: var(--ink3); margin: 14px 0 4px; } .sl.out { margin: 4px 6px 6px; }
.row { display: flex; align-items: center; gap: 10px; min-height: 42px; font-size: 15px; }
.row .t { flex: 1; min-width: 0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.row .m { font-size: 11.5px; color: var(--ink3); display: inline-flex; align-items: center; gap: 4px; white-space: nowrap; }
.tm { font-size: 14px; font-weight: 600; width: 44px; }
.dot { width: 7px; height: 7px; border-radius: 50%; background: var(--ac); display: inline-block; flex: none; }
.cn { font-weight: 600; margin-right: 10px; }
.more { text-align: right; font-size: 12px; color: var(--ink3); }
.search { display: flex; align-items: center; gap: 8px; height: 38px; padding: 0 12px; border-radius: 12px; background: rgba(18,18,18,.07); color: var(--ink3); font-size: 15px; margin-bottom: 12px; }
.room { display: flex; gap: 12px; padding: 10px 0; align-items: center; }
.rav { width: 52px; height: 48px; object-fit: contain; object-position: center bottom; flex: none; }
.rav.crewgrp { position: relative; display: inline-block; } .rav.crewgrp img { position: absolute; height: 30px; width: auto; }
.rav.crewgrp img:nth-child(1) { left: 0; top: 0; } .rav.crewgrp img:nth-child(2) { right: 0; top: 4px; } .rav.crewgrp img:nth-child(3) { left: 12px; bottom: -2px; }
.rav.ch { display: inline-flex; align-items: center; justify-content: center; background: var(--tint); color: var(--ac); font-weight: 600; font-size: 17px; }
.rb { flex: 1; min-width: 0; } .rn { display: flex; font-size: 16px; font-weight: 600; } .rn .m { margin-left: auto; font-size: 11.5px; color: var(--ink3); font-weight: 400; }
.rp { display: flex; align-items: center; gap: 8px; font-size: 14px; color: var(--ink2); margin-top: 2px; } .rp > span:first-child { flex: 1; min-width: 0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.cnt { min-width: 20px; height: 20px; border-radius: 10px; background: var(--ac); color: #fff; font-size: 11px; font-weight: 600; display: inline-flex; align-items: center; justify-content: center; padding: 0 6px; }
.tab { position: absolute; left: 14px; right: 14px; bottom: 18px; height: 64px; border-radius: 32px; display: flex; justify-content: space-around; align-items: center; padding: 0 6px;
  background: rgba(255,255,255,.72); -webkit-backdrop-filter: blur(20px) saturate(1.6); backdrop-filter: blur(20px) saturate(1.6); border: 1px solid rgba(255,255,255,.7); box-shadow: 0 8px 28px rgba(0,0,0,.1); }
.tab div { display: flex; flex-direction: column; align-items: center; gap: 2px; font-size: 10.5px; font-weight: 500; color: var(--ink2); width: 76px; height: 52px; justify-content: center; border-radius: 26px; }
.tab .on { background: rgba(255,255,255,.95); color: var(--ink); font-weight: 600; box-shadow: 0 1px 4px rgba(0,0,0,.07); }
.nav { display: grid; grid-template-columns: 36px 1fr 36px; align-items: center; height: 52px; margin-bottom: 6px; }
.nt { display: flex; justify-content: center; align-items: center; gap: 8px; } .nt .av { height: 34px; max-width: 44px; } .nt b { font-size: 16px; font-weight: 600; display: block; } .nt small { font-size: 11px; color: var(--ink3); }
.ntt { text-align: center; font-size: 17px; font-weight: 600; }
.me-b { margin-left: auto; width: fit-content; max-width: 80%; background: var(--ac); color: #fff; font-size: 15px; padding: 10px 14px; border-radius: 20px 20px 6px 20px; }
.tsm { text-align: right; font-size: 11px; color: var(--ink3); margin: 4px 4px 10px; font-variant-numeric: tabular-nums; }
.card { width: 92%; } .card h3 { font-size: 17px; font-weight: 600; margin: 8px 0 4px; } .card p { font-size: 15px; }
.btn { height: 46px; border-radius: 23px; display: flex; align-items: center; justify-content: center; font-size: 15px; font-weight: 600; margin-top: 8px; }
.btn.p { background: var(--ac); color: #fff; } .btn.g { background: var(--gray); }
.lnk { display: flex; align-items: center; justify-content: center; gap: 4px; color: var(--ac); font-size: 15px; font-weight: 600; margin-top: 12px; }
.dock { position: absolute; left: 0; right: 0; bottom: 0; padding: 10px 14px 26px; display: flex; gap: 8px; align-items: center; background: rgba(242,242,247,.75); -webkit-backdrop-filter: blur(20px); backdrop-filter: blur(20px); }
.inp { flex: 1; height: 40px; border-radius: 20px; background: var(--blk); display: flex; align-items: center; padding: 0 14px; color: var(--ink3); font-size: 15px; }
.send { width: 40px; height: 40px; border-radius: 20px; background: var(--ac); color: #fff; display: inline-flex; align-items: center; justify-content: center; }
.seg { display: flex; background: rgba(18,18,18,.07); border-radius: 10px; padding: 2px; margin-bottom: 12px; }
.seg b { flex: 1; text-align: center; font-size: 13px; font-weight: 500; padding: 7px 0; border-radius: 8px; color: var(--ink2); } .seg .on { background: var(--blk); color: var(--ink); font-weight: 600; box-shadow: 0 1px 3px rgba(0,0,0,.08); }
.prof { display: flex; gap: 12px; align-items: center; } .pav { width: 52px; height: 52px; border-radius: 50%; background: var(--gray); display: inline-flex; align-items: center; justify-content: center; font-size: 20px; font-weight: 600; color: var(--ink2); }
.prof b { font-size: 17px; font-weight: 600; display: block; } .prof small { font-size: 13px; color: var(--ink2); }
.two { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; } .sq { min-height: 168px; margin-bottom: 12px; }
.lab { font-size: 12.5px; color: var(--ink2); } .big { font-size: 34px; font-weight: 700; letter-spacing: -.02em; line-height: 1.15; margin: 2px 0; } .big.ac { color: var(--ac); margin-top: 12px; } .big.warn { color: var(--warn); font-size: 44px; }
.sq .meta, .us .meta { margin: 0; display: block; }
.gauge { height: 5px; border-radius: 3px; background: rgba(18,18,18,.08); margin: 8px 0; overflow: hidden; } .gauge i { display: block; height: 100%; background: var(--ink); border-radius: 3px; } .gauge.w i { background: var(--warn); }
.set .row { min-height: 48px; } .set .row .t { font-size: 15px; }
.eng { width: 9px; height: 9px; border-radius: 50%; display: inline-block; flex: none; } .eng.cl { background: var(--cl); } .eng.cx { background: var(--cx); }
.us { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; } .un { font-size: 15px; font-weight: 600; display: flex; align-items: center; gap: 6px; }
.ur { border-left: 1px solid var(--gray); padding-left: 12px; display: flex; flex-direction: column; justify-content: center; gap: 12px; }
.ur div { display: flex; align-items: center; gap: 7px; font-size: 13.5px; } .ur .m { margin-left: auto; font-size: 13px; color: var(--ink); }
.acc { display: flex; align-items: center; gap: 12px; padding: 10px 0; } .acc > div { flex: 1; } .acc b { font-size: 15px; font-weight: 600; display: block; } .acc small { font-size: 12px; color: var(--ink3); }
.acc .m { font-size: 15px; font-weight: 600; } .acc > i.ic { color: var(--ink3); }
.sw { display: flex; align-items: center; gap: 12px; } .sw b { font-size: 15px; font-weight: 600; display: block; } .sw small { font-size: 12.5px; color: var(--ink2); }
.tg { width: 51px; height: 31px; border-radius: 16px; background: var(--ac); position: relative; flex: none; } .tg::after { content: ""; position: absolute; right: 2px; top: 2px; width: 27px; height: 27px; border-radius: 50%; background: #fff; box-shadow: 0 2px 4px rgba(0,0,0,.15); }
.behind { position: absolute; inset: 0; padding: 0 16px; } .scrim { position: absolute; inset: -46px 0 0; background: rgba(0,0,0,.3); }
.sheet { position: absolute; left: 0; right: 0; bottom: 0; height: 74%; background: var(--blk); border-radius: 28px 28px 0 0; padding: 8px 16px; }
.grab { width: 36px; height: 5px; border-radius: 3px; background: rgba(18,18,18,.2); margin: 0 auto 10px; }
.sh { display: grid; grid-template-columns: 60px 1fr 60px; align-items: center; } .sh b { text-align: center; font-size: 17px; font-weight: 600; } .tb { font-size: 16px; color: var(--ink2); } .tb.ac { color: var(--ac); font-weight: 600; text-align: right; }
.grp { background: var(--bg); border-radius: 16px; padding: 2px 14px; } .opt { display: flex; align-items: center; gap: 12px; min-height: 56px; } .opt > div { flex: 1; } .opt b { font-size: 15px; font-weight: 600; display: block; } .opt small { font-size: 12px; color: var(--ink3); }
.ck { width: 24px; height: 24px; display: inline-flex; align-items: center; justify-content: center; color: var(--ac); }
/* 다크 */
.phone.dark { --bg: #121212; --blk: #1E1E1E; --ink: #fff; --ink2: rgba(255,255,255,.7); --ink3: rgba(255,255,255,.5); --ac: #A3ABFF; --tint: rgba(163,171,255,.18); --gray: rgba(255,255,255,.1); color: var(--ink); }
.phone.dark .tab { background: rgba(36,36,36,.74); border-color: rgba(255,255,255,.08); } .phone.dark .tab .on { background: rgba(255,255,255,.14); }
.phone.dark .btn.p { color: #121212; }
@media (max-width: 440px) { .grid { padding: 8px 10px 40px; } .phone { border-radius: 36px; } }
.bul { list-style: none; padding: 0; } .bul li { position: relative; padding: 6px 0 6px 16px; font-size: 15px; line-height: 1.45; } .bul li::before { content: ""; position: absolute; left: 2px; top: 14px; width: 6px; height: 6px; border-radius: 50%; background: var(--ac); }

/* 상태별 배지 색 — 강조(인디고)·주의(주황)·막힘(빨강) */
.bd.o { background: rgba(255,149,0,.14); color: #C25E00; } .bd.w { background: rgba(255,149,0,.14); color: #C25E00; } .bd.r { background: rgba(255,59,48,.12); color: #D70015; }
.phone.dark .bd.o, .phone.dark .bd.w { color: #FFB340; } .phone.dark .bd.r { color: #FF6961; }
.row > i.ic { color: var(--ink2); } .acc > i.ic, .row .m i.ic { color: var(--ink3); }
.cf { height: 24px; width: 26px; object-fit: contain; flex: none; margin-right: -4px; } .dot.live { display: none; }
/* 탭 아이콘 상태 — 기본 선(잉크 60%) · 선택 채움(잉크) · 확인 필요 숫자 · 새 소식 점 */
.tab div { color: rgba(18,18,18,.6); } .tab .on { color: var(--ink); }
.ti { position: relative; display: inline-flex; }
.tb-n { position: absolute; top: -5px; right: -11px; min-width: 18px; height: 18px; padding: 0 5px; border-radius: 9px; background: var(--ac); color: #fff; font: 600 11px/18px "IBM Plex Mono", monospace; text-align: center; box-shadow: 0 0 0 2px rgba(255,255,255,.9); }
.tb-d { position: absolute; top: -1px; right: -3px; width: 9px; height: 9px; border-radius: 50%; background: var(--ac); box-shadow: 0 0 0 2px rgba(255,255,255,.9); }
.phone.dark .tab div { color: rgba(255,255,255,.6); } .phone.dark .tab .on { color: #fff; } .phone.dark .tb-n { color: #121212; box-shadow: 0 0 0 2px #242424; } .phone.dark .tb-d { box-shadow: 0 0 0 2px #242424; }
.off { color: rgba(18,18,18,.25); display: inline-flex; gap: 10px; }
.statecard { background: #fff; border-radius: 28px; padding: 20px; align-self: start; box-shadow: 0 18px 40px rgba(0,0,0,.06); }
.statecard h2 { font-size: 20px; font-weight: 700; } .statecard > .sub { margin: 4px 0 10px; }
.st { display: grid; grid-template-columns: 132px 1fr; gap: 12px; align-items: center; padding: 10px 0; border-top: 1px solid var(--gray); }
.st b { font-size: 14px; font-weight: 600; display: block; } .st small { font-size: 12.5px; color: var(--ink2); line-height: 1.45; display: block; }
.sd { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; color: var(--ink2); } .sd > i.ic { margin-right: 4px; }
.tdemo { display: inline-flex; width: 64px; height: 46px; border-radius: 23px; align-items: center; justify-content: center; color: rgba(18,18,18,.6); background: rgba(18,18,18,.04); }
.tdemo.on { background: #fff; color: var(--ink); box-shadow: 0 1px 4px rgba(0,0,0,.12); }
/* 얼굴 누끼는 아래를 부드럽게 흐려 잘린 선이 안 보이게 */
.av, img.rav, .cf, .rav.crewgrp img { -webkit-mask-image: linear-gradient(#000 72%, transparent 100%); mask-image: linear-gradient(#000 72%, transparent 100%); }

/* 탭 — 아이콘만. 28px, 선택은 채움 + 흰 알약, 누를 자리 56×48 */
i.ic.t { width: 28px; height: 28px; } i.ic.k { width: 18px; height: 18px; }
.tab { height: 62px; } .tab div { width: 64px; height: 48px; gap: 0; color: rgba(18,18,18,.55); }
.tab .on { color: #121212; } .tdemo { color: rgba(18,18,18,.55); }
/* 종류 타일 — 아이콘만 */
.kd { width: 30px; height: 30px; border-radius: 9px; background: var(--gray); color: var(--ink2); display: inline-flex; align-items: center; justify-content: center; flex: none; }
.hero .kd { vertical-align: middle; }
.phone.dark .tab .on { color: #fff; }
.hero + .row { margin-top: 6px; }

/* ── 10/25 수정 13건 ── */
/* 탭: 선택 표시는 채운 아이콘과 진한 잉크만. 안쪽 알약 도형 없음 */
.tab .on, .phone.dark .tab .on { background: none; box-shadow: none; }
.tab div { color: rgba(18,18,18,.5); } .phone.dark .tab div { color: rgba(255,255,255,.5); }
.tdemo.on { background: rgba(18,18,18,.04); box-shadow: none; color: #121212; }
.acts { display: inline-flex; gap: 2px; }
.date { font-size: 13px; color: var(--ink3); margin: -10px 2px 10px; }
.kline { display: flex; align-items: center; gap: 8px; font-size: 14px; color: var(--ink2); margin: 0 2px 12px; }
/* 할 일 세 칸 — 위 숫자와 아래 목록이 같은 표시를 쓴다 */
.tri { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; margin-bottom: 12px; }
.tri div { background: var(--blk); border-radius: 18px; padding: 10px 12px; display: grid; grid-template-columns: auto 1fr; align-items: center; column-gap: 6px; }
.tri .num { font-size: 26px; font-weight: 700; line-height: 1.1; text-align: right; }
.tri span:last-child { grid-column: 1 / -1; font-size: 12.5px; font-weight: 600; color: var(--ink2); margin-top: 2px; }
.tri .on { box-shadow: inset 0 0 0 2px var(--ink); }
.tri-i { display: inline-flex; } .tri-i.todo { color: var(--ink); } .tri-i.doing { color: var(--ac); } .tri-i.done { color: var(--ink3); }
.sh2 { display: flex; align-items: baseline; justify-content: space-between; margin-bottom: 2px; } .sh2 b { font-size: 17px; font-weight: 700; } .cnt2 { font-size: 12px; color: var(--ink3); }
.row.r2 { min-height: 54px; } .row .t small { display: block; font-size: 12px; color: var(--ink3); margin-top: 1px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.mk { position: relative; width: 26px; height: 26px; display: inline-flex; align-items: center; justify-content: center; flex: none; }
.mk i.ic { width: 24px; height: 24px; } .mk.todo { color: rgba(18,18,18,.45); } .mk.doing { color: var(--ac); } .mk.wait { color: var(--ac); } .mk.done { color: var(--ink3); }
.phone.dark .mk.todo { color: rgba(255,255,255,.5); }
.mkf { position: absolute; right: -7px; bottom: -6px; height: 17px; width: auto; -webkit-mask-image: linear-gradient(#000 72%, transparent); mask-image: linear-gradient(#000 72%, transparent); }
.due { font-weight: 500; color: var(--ink3); } .due.hot { color: #C25E00; } .phone.dark .due.hot { color: #FFB340; }
