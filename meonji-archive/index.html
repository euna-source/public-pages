<!doctype html>
<html lang="ko">
<head>
<meta name="robots" content="noindex, nofollow">
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="light">
  <meta name="description" content="마음이 머문 물건과 장면을 서랍과 파일에 모으는 먼지의 수집함.">
  <title>먼지의 서랍 — 취향 모음집</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect x='4' y='12' width='56' height='43' rx='4' fill='%23ffffff' stroke='%23141414' stroke-width='3'/%3E%3Cpath d='M22 31v8h20v-8' fill='none' stroke='%23141414' stroke-width='3'/%3E%3C/svg%3E">
  <link rel="stylesheet" href="./style.css">
</head>
<body>
  <a class="skip" href="#main">본문으로</a>
  <header class="topbar">
    <a class="brand" href="./#home"><svg class="dust-logo" aria-hidden="true" viewBox="0 0 40 40"><path fill="currentColor" stroke="none" d="M20 2 24 5 30 4 32 10 37 13 35 19 38 24 32 28 31 34 25 34 20 38 15 34 9 35 7 29 2 26 5 20 2 14 8 11 9 5 15 6Z"/><ellipse fill="white" stroke="none" cx="15" cy="19" rx="5" ry="6"/><ellipse fill="white" stroke="none" cx="27" cy="19" rx="5" ry="6"/><circle fill="#141414" stroke="none" cx="16.5" cy="20" r="2"/><circle fill="#141414" stroke="none" cx="28.5" cy="20" r="2"/></svg>먼지의 서랍<span>meonji’s archive</span></a>
    <nav aria-label="주 메뉴"><a href="./#home">서랍</a><a href="./#collection/all">모음집</a><a href="./#deck">취향 고르기</a><a href="./#taste">나의 감각</a></nav>
    <button class="primary small" id="add-open">＋ 담기</button>
  </header>
  <div class="preview-strip"><span>디자인 체험판 · 물건과 문장</span><a href="../meonji-collect/#/list" id="actual-app">내 실제 수집함 ↗</a></div>
  <div id="compose-home"><section id="composer" class="inline-composer" hidden aria-label="새 수집물 기록">
    <div class="composer-heading"><h2>지금 남겨두기</h2><button id="composer-close" aria-label="입력 접기">접기 −</button></div>
    <div class="composer-tabs" role="group" aria-label="담을 내용"><button data-compose="letter" aria-pressed="true">글귀와 생각</button><button data-compose="url" aria-pressed="false">페이지 속 내용</button></div>
    <form id="letter-form"><label for="letter-quote">남기고 싶은 글귀</label><p class="hint" id="letter-help">Enter 저장 · Shift+Enter 줄바꿈</p><textarea id="letter-quote" rows="3" maxlength="8000" required aria-describedby="letter-help letter-status" placeholder="책에서 밑줄 그은 문장, 오래 기억하고 싶은 말."></textarea><details class="letter-extras"><summary>출처와 그때의 기록 <span class="hint">선택</span></summary><label for="letter-book">책·출처</label><input id="letter-book" maxlength="200" placeholder="책 제목 또는 직접 쓴 글"><div class="letter-source-row"><div><label for="letter-author">저자</label><input id="letter-author" maxlength="100"></div><div><label for="letter-page">쪽수</label><input id="letter-page" maxlength="30" placeholder="예: 42"></div></div><label for="letter-memo">그때의 기록</label><textarea id="letter-memo" rows="2" maxlength="2000" placeholder="이 문장이 나에게 남은 이유"></textarea></details><div class="composer-foot"><p id="letter-status" role="status" class="hint">글귀는 이 브라우저에 저장돼요.</p><button class="primary" type="submit">글귀 저장 ↵</button></div></form>
    <form id="capture-form" hidden><label for="source-url">내용을 담을 페이지 주소</label><p class="hint">목록은 현재 페이지 안에서만 스크롤해요.</p><div class="url-entry"><input id="source-url" type="url" placeholder="https://…" required><button class="primary" type="submit">내용 담기 ↗</button></div><p class="hint">Enter를 누르면 실제 수집함에서 페이지 내용을 읽어요.</p></form>
  </section></div>
  <main id="main" tabindex="-1"></main>
  <footer class="footer"><span>먼지의 서랍 <i>Things that stay with you.</i></span><span>서랍은 달라도, 물건은 하나.</span></footer>
  <dialog id="item-dialog" aria-labelledby="item-title" class="detail-layer"><div id="item-content"></div></dialog>
  <output id="toast" role="status" aria-live="polite"></output>
  <script type="module" src="./app.js"></script>
</body>
</html>
