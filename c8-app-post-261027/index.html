<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>오늘 올릴 영감 글 미리보기</title>
<style>
body{margin:0;background:#111;color:#eee;font-family:-apple-system,"Apple SD Gothic Neo",sans-serif}
main{max-width:480px;margin:0 auto;padding:20px 16px 40px}
h1{font-size:18px;margin:0 0 4px}
p{margin:0 0 14px;color:#aaa;font-size:14px;line-height:1.5}
img{width:100%;height:auto;border-radius:12px;display:block}
pre{white-space:pre-wrap;background:#1d1d1d;border-radius:12px;padding:16px;font-family:inherit;font-size:15px;line-height:1.6;margin:16px 0 8px}
button{width:100%;padding:14px;border:0;border-radius:12px;background:#22d34b;color:#111;font-size:16px;font-weight:700}
</style>
</head>
<body>
<main>
<h1>오늘 올릴 영감 글</h1>
<p>크리에이터클럽 공식 계정 · 영감 · 배경 초록 · 오전 11시</p>
<img src="preview.png" alt="앱 영감 카드 미리보기">
<pre id="t">지난주 Weekly Best,
결과 나왔어요.

명예의 전당에서 확인해요.
수상자분들께는 따로 연락드려요.

그리고 이번 주 순위는
다시 0부터예요.
일요일 밤 11시 59분까지
리스펙트도 활동도 새로 쌓여요.

#WeeklyBest #작품도프로필도뽐내봐</pre>
<button onclick="navigator.clipboard.writeText(document.getElementById('t').innerText).then(()=>this.textContent='복사했어요')">글 복사하기</button>
</main>
</body>
</html>
