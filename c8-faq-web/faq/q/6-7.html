<main class="faq"><article class="answer"><a class="cat" href="../c/6.html">채팅과 인맥</a><h1>보낸 메시지를 고치거나 지울 수 있나요?</h1><p>보낸 메시지는 고칠 수 없지만, 내가 보낸 메시지는 지울 수 있어요. 사진·동영상·파일 같은 첨부 메시지도 같아요.</p><p>지우기 전에 확인 팝업이 한 번 뜨고, 지운 자리에는 「삭제된 메시지입니다」가 보여요.</p><p>다른 크리에이터가 보낸 메시지는 지울 수 없어요. 오픈채팅 방장이나 프로젝트 리더도 마찬가지예요. 문제가 있는 메시지라면 그 메시지를 보낸 크리에이터를 신고해 주세요.</p></article><h2 class="sec">관련 질문</h2><nav class="list"><a class="row" href="8-1.html"><span class="row__label">부적절한 콘텐츠나 크리에이터를 신고하고 싶어요</span><svg class="chev" viewBox="0 0 16 16" aria-hidden="true"><path d="M6 3.5 10.5 8 6 12.5" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></svg></a></nav><section class="contact"><p>해결되지 않았나요?</p><a class="pill" href="mailto:support@cre8orclub.com">이메일 문의</a></section></main>
