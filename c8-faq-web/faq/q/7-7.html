<main class="faq"><article class="answer"><a class="cat" href="../c/7.html">알림</a><h1>설정과 관계없이 오는 알림이 있나요?</h1><p>네, 있을 수 있어요. 보안이나 오류처럼 서비스 이용에 꼭 필요한 알림은 알림 설정과 관계없이 보낼 수 있어요.</p><p>포폴 업로드에 실패했다는 알림은 반응·관계·소식·채티 스위치를 꺼 두어도 와요. 다만 「푸시 알림 받기」를 끄면 이 알림도 앱푸시로는 오지 않고, 앱을 보고 있을 때도 오지 않아요.</p></article><h2 class="sec">관련 질문</h2><nav class="list"><a class="row" href="3-8.html"><span class="row__label">포폴 업로드가 실패했어요</span><svg class="chev" viewBox="0 0 16 16" aria-hidden="true"><path d="M6 3.5 10.5 8 6 12.5" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></svg></a></nav><section class="contact"><p>해결되지 않았나요?</p><a class="pill" href="mailto:support@cre8orclub.com">이메일 문의</a></section></main>
