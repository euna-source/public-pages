<main class="faq"><article class="answer"><a class="cat" href="../c/4.html">둘러보기</a><h1>저장한 게시물은 어디서 보나요?</h1><p>설정 &gt; 북마크의 「포트폴리오」 탭에서 저장한 포폴을 모아 볼 수 있어요.</p><p>다른 크리에이터의 포폴 상세에서 더보기를 눌러 「게시물 저장」을 고르면 저장돼요. 영감과 프로젝트는 저장할 수 없고, 내 포폴도 저장할 수 없어요.</p><p>저장해 둔 포폴이라도 올린 크리에이터와 차단 관계가 되면(어느 쪽이 차단했든) 북마크 목록에서 빠져요.</p></article><h2 class="sec">관련 질문</h2><nav class="list"><a class="row" href="4-7.html"><span class="row__label">내가 쓴 댓글은 어디서 보나요?</span><svg class="chev" viewBox="0 0 16 16" aria-hidden="true"><path d="M6 3.5 10.5 8 6 12.5" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></svg></a></nav><section class="contact"><p>해결되지 않았나요?</p><a class="pill" href="mailto:support@cre8orclub.com">이메일 문의</a></section></main>
