<main class="faq"><article class="answer"><a class="cat" href="../c/0.html">크리에이터클럽 소개</a><h1>PC에서도 쓸 수 있나요?</h1><p>크리에이터클럽은 모바일 앱(iOS·Android)으로 제공해요. 작업을 올리거나 팔로우·노크·채팅을 하려면 앱이 필요해요.</p><p>휴대폰에서 공유 링크를 열면 앱이 없어도 전체 공개된 포폴·프로필·프로젝트·팀을 웹 화면에서 볼 수 있어요. 이 화면에서는 보기만 할 수 있고, 팔로우·연락·참여는 앱에서 해요.</p></article><h2 class="sec">관련 질문</h2><nav class="list"><a class="row" href="2-6.html"><span class="row__label">프로필을 밖으로 공유할 수 있나요?</span><svg class="chev" viewBox="0 0 16 16" aria-hidden="true"><path d="M6 3.5 10.5 8 6 12.5" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></svg></a></nav><section class="contact"><p>해결되지 않았나요?</p><a class="pill" href="mailto:support@cre8orclub.com">이메일 문의</a></section></main>
