<main class="faq"><article class="answer"><a class="cat" href="../c/4.html">둘러보기</a><h1>내가 쓴 댓글은 어디서 보나요?</h1><p>설정 &gt; 콘텐츠 &gt; 댓글 및 답글에서 내가 쓴 댓글과 답글을 모아 볼 수 있어요. 「포폴」 「영감」 「프로젝트」 「채팅」 탭으로 나뉘어요.</p><ul><li>「포폴」 「영감」: 포폴과 영감에 단 댓글·답글</li><li>「프로젝트」: 프로젝트 게시글과 일정에 단 댓글·답글</li><li>「채팅」: 채팅방 노트에 단 댓글·답글</li></ul><p>같은 설정 &gt; 콘텐츠에서 내가 남긴 리스펙트와 좋아요도 볼 수 있어요.</p></article><h2 class="sec">관련 질문</h2><nav class="list"><a class="row" href="4-8.html"><span class="row__label">내 댓글을 고칠 수 있나요?</span><svg class="chev" viewBox="0 0 16 16" aria-hidden="true"><path d="M6 3.5 10.5 8 6 12.5" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></svg></a></nav><section class="contact"><p>해결되지 않았나요?</p><a class="pill" href="mailto:support@cre8orclub.com">이메일 문의</a></section></main>
