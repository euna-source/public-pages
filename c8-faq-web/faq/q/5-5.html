<main class="faq"><article class="answer"><a class="cat" href="../c/5.html">클럽</a><h1>지원이 거절되면 다시 지원할 수 있나요?</h1><p>프로젝트와 팀이 달라요.</p><ul><li>프로젝트: 지원이 거절된 프로젝트나 리더가 나를 내보낸 프로젝트에는 다시 지원할 수 없어요. 다만 이 제한은 지원·참여 이력을 보관하는 동안에만 적용돼요. 수락된 뒤 스스로 나간 프로젝트는 모집 중일 때 다시 지원할 수 있어요.</li><li>팀: 지원이 거절돼도 같은 팀에 다시 지원할 수 있고, 다시 낸 지원은 새 지원으로 받아요.</li></ul></article><h2 class="sec">관련 질문</h2><nav class="list"><a class="row" href="8-6.html"><span class="row__label">이용 제한에 이의를 신청하고 싶어요</span><svg class="chev" viewBox="0 0 16 16" aria-hidden="true"><path d="M6 3.5 10.5 8 6 12.5" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></svg></a></nav><section class="contact"><p>해결되지 않았나요?</p><a class="pill" href="mailto:support@cre8orclub.com">이메일 문의</a></section></main>
