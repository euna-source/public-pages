<!doctype html>
<html lang="ko">
<head>
<meta name="robots" content="noindex, nofollow">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>수상 안내 메일 편집기</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css">
<style>
:root{--bg:#f4f4f2;--panel:#ffffff;--ink:#141414;--muted:#6b6b6b;--line:#e3e3df;--field:#fafaf8;--accent:#07ED21;--accent-ink:#111111;--dark:#141414;--ok:#0a7a1c}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#121212;--panel:#1c1c1c;--ink:#f0f0f0;--muted:#a0a0a0;--line:#2e2e2e;--field:#232323;--dark:#f0f0f0;--ok:#4ade80}}
:root[data-theme="dark"]{--bg:#121212;--panel:#1c1c1c;--ink:#f0f0f0;--muted:#a0a0a0;--line:#2e2e2e;--field:#232323;--dark:#f0f0f0;--ok:#4ade80}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:'Pretendard',-apple-system,'Apple SD Gothic Neo',sans-serif;word-break:keep-all}
header{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap;padding:16px 20px;border-bottom:1px solid var(--line);background:var(--panel);position:sticky;top:0;z-index:5}
h1{font-size:17px;margin:0;font-weight:700}
.sub{font-size:12px;color:var(--muted);margin-top:2px}
.actions{display:flex;gap:8px;flex-wrap:wrap}
button{font:inherit;font-size:13px;font-weight:600;border-radius:8px;border:1px solid var(--line);background:var(--field);color:var(--ink);padding:8px 12px;cursor:pointer}
button.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
button:focus-visible,input:focus-visible,textarea:focus-visible{outline:2px solid var(--accent);outline-offset:1px}
main{display:grid;grid-template-columns:minmax(320px,440px) 1fr;gap:0;min-height:calc(100vh - 70px)}
.form{background:var(--panel);border-right:1px solid var(--line);padding:16px 20px 40px;overflow:auto}
.tabs{display:flex;gap:6px;margin-bottom:14px}
.tabs button[aria-selected="true"]{background:var(--dark);color:var(--panel);border-color:var(--dark)}
fieldset{border:0;padding:0;margin:0 0 18px}
legend{font-size:12px;font-weight:700;color:var(--muted);margin-bottom:8px;letter-spacing:.2px}
label{display:block;font-size:13px;font-weight:600;margin:10px 0 4px}
.hint{font-weight:400;color:var(--muted);font-size:12px}
input,textarea{width:100%;font:inherit;font-size:14px;color:var(--ink);background:var(--field);border:1px solid var(--line);border-radius:8px;padding:9px 10px}
textarea{resize:vertical;min-height:64px;line-height:1.55}
#raw{min-height:60vh;font-family:ui-monospace,Menlo,monospace;font-size:12px;white-space:pre}
.row{display:flex;gap:8px}.row>*{flex:1}
.copyline{display:flex;gap:6px}.copyline input{flex:1}
.preview{padding:16px 20px 40px;display:flex;flex-direction:column;align-items:center;gap:10px}
.ptools{display:flex;gap:6px;align-items:center;font-size:12px;color:var(--muted)}
.ptools button[aria-pressed="true"]{background:var(--dark);color:var(--panel);border-color:var(--dark)}
iframe{border:1px solid var(--line);border-radius:10px;background:#f2f2f2;width:640px;max-width:100%;height:1500px}
.toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);background:var(--dark);color:var(--panel);padding:10px 16px;border-radius:8px;font-size:13px;opacity:0;transition:opacity .2s;pointer-events:none}
.toast.show{opacity:1}
.warn{font-size:12px;color:var(--muted);background:var(--field);border:1px dashed var(--line);border-radius:8px;padding:8px 10px;margin-bottom:10px}
@media (max-width:860px){main{grid-template-columns:1fr}.form{border-right:0;border-bottom:1px solid var(--line)}header{position:static;padding:14px 16px}.form,.preview{padding-left:16px;padding-right:16px}iframe{height:1700px}}
</style>
</head>
<body>
<header>
  <div>
    <h1>위클리 베스트 수상 안내 메일</h1>
    <div class="sub">내용을 고치면 오른쪽 미리보기가 바로 바뀌어요. 고친 내용은 이 브라우저에만 저장돼요.</div>
  </div>

</header>
<main>

    <div id="paneForm">

      </fieldset>
      <fieldset>
        <legend>인사</legend>
        <div class="row">

          <div><label for="week">주차</label><input id="week"></div>
        </div>
        <label for="intro">위클리 베스트 소개</label>
        <textarea id="intro" style="min-height:96px"></textarea>
      </fieldset>
      <fieldset>

        <label for="awards">수상 내역 <span class="hint">한 줄에 하나씩 · [10월 3주차]처럼 대괄호로 쓰면 소제목</span></label>
        <textarea id="awards"></textarea>
        <label for="total">총 경품</label>
        <input id="total">
      </fieldset>
      <fieldset>

        <label for="prize">경품</label><input id="prize">
        <label for="schedule">발송 일정</label><input id="schedule">
        <label for="method">발송 방법</label><input id="method">
        <label for="option">변경 안내</label><textarea id="option" style="min-height:84px"></textarea>
      </fieldset>
      <fieldset>
        <legend>경품 수령 안내</legend>

        <textarea id="receipt" style="min-height:84px"></textarea>
      </fieldset>
      <fieldset>
        <legend>맺음말</legend>

        <legend>하단 고지</legend>

    </div>

      <textarea id="raw" spellcheck="false"></textarea>
    </div>
  </section>

  <section class="preview">
    <div class="ptools">미리보기

    </div>

</main>
<div class="toast" id="toast" role="status" aria-live="polite"></div>

<script>

const KEYS=Object.keys(DEFAULTS);
const STORE='c8-weeklybest-mail-v1';
const TPL='261103-7';
const OLD_AWARDS=['작품 부문 2위 (3만 원)\n크리에이터 부문 5위 (1만 원)','작품 부문 2위 「나비효과 (Butterfly Effect)」 (3만 원)\n크리에이터 부문 5위 (1만 원)'];

const $=id=>document.getElementById(id);
const esc=s=>String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
const br=s=>esc(s).replace(/\n/g,'<br>\n                  ');

  return `<!doctype html>

</head>
<body style="margin:0; padding:0; background-color:#f2f2f2;">
<div style="display:none; max-height:0; overflow:hidden; mso-hide:all;">${esc(v.preheader)}</div>
<table role="presentation" width="100%" cellpadding="0" cellspacing="0" border="0" style="background-color:#f2f2f2;">

    <td align="center" style="padding:24px 12px;">
      <table role="presentation" width="600" cellpadding="0" cellspacing="0" border="0" style="width:100%; max-width:600px; background-color:#ffffff; border-radius:12px; overflow:hidden; word-break:keep-all; font-family:'Pretendard','Apple SD Gothic Neo','Malgun Gothic','맑은 고딕',sans-serif; color:#111111;">
        <tr>
          <td style="background-color:#111111; padding:24px 32px 28px;">
            <table role="presentation" cellpadding="0" cellspacing="0" border="0">
              <tr>
                <td valign="middle" style="vertical-align:middle; line-height:0; font-size:0;"><img src="${LOGO}" width="18" height="30" alt="Cre8orClub" style="display:block; width:18px; height:30px; border:0;"></td>
                <td valign="middle" style="vertical-align:middle; padding-left:10px; font-size:24px; line-height:30px; font-weight:700; color:#ffffff; padding-top:4px;">Cre8orClub</td>
              </tr>
            </table>
            <div style="margin-top:22px; font-size:25px; line-height:1.45; font-weight:700; color:#ffffff;">위클리 베스트 선정을<br>진심으로 축하드립니다! 🎉</div>
          </td>
        </tr>
        <tr>
          <td style="padding:28px 32px 8px; font-size:15px; line-height:1.7;">
            안녕하세요, <strong>${esc(v.name)} 님!</strong><br>
            크리에이터클럽 운영팀입니다.<br><br>
            <strong>${esc(v.week)} 위클리 베스트</strong>에 선정되어 명예의 전당에 이름을 올리셨어요. 🏆
          </td>
        </tr>
        <tr>
          <td style="padding:16px 32px 0;">
            <table role="presentation" width="100%" cellpadding="0" cellspacing="0" border="0" style="border-left:3px solid #07ED21;">
              <tr>
                <td style="padding:2px 0 2px 14px; font-size:14px; line-height:1.7; color:#444444;">
                  ${br(v.intro)}<br>
                  <a href="${EVENT}" target="_blank" style="font-weight:700; color:#111111; text-decoration:underline;">이벤트 자세히 보기 →</a>
                </td>
              </tr>
            </table>
          </td>
        </tr>
        <tr>
          <td style="padding:16px 32px 0;">
            <table role="presentation" width="100%" cellpadding="0" cellspacing="0" border="0" style="background-color:#f7f7f7; border-radius:10px;">
              <tr>
                <td style="padding:20px 22px; font-size:15px; line-height:1.8;">
                  <div style="font-size:16px; font-weight:700; margin-bottom:8px;">🏆 선정 내역</div>
${awards}
                  <div style="margin-top:10px; padding-top:10px; border-top:1px solid #e2e2e2; font-weight:700;">총 경품: ${esc(v.total)}</div>
                </td>
              </tr>
            </table>
          </td>
        </tr>
        <tr>
          <td style="padding:16px 32px 0;">
            <table role="presentation" width="100%" cellpadding="0" cellspacing="0" border="0" style="background-color:#f7f7f7; border-radius:10px;">
              <tr>
                <td style="padding:20px 22px; font-size:15px; line-height:1.8;">
                  <div style="font-size:16px; font-weight:700; margin-bottom:8px;">🎁 경품 지급 안내</div>
                  • 경품: ${esc(v.prize)}<br>
                  • 발송 일정: ${esc(v.schedule)}<br>
                  • 발송 방법: ${esc(v.method)}${v.option.trim()?`
                  <div style="margin-top:12px; font-size:14px; line-height:1.7; color:#444444;">${br(v.option)}</div>`:''}
                </td>
              </tr>
            </table>
          </td>
        </tr>
        <tr>
          <td style="padding:16px 32px 0;">
            <table role="presentation" width="100%" cellpadding="0" cellspacing="0" border="0" style="border:2px solid #07ED21; border-radius:10px;">
              <tr>
                <td style="padding:20px 22px; font-size:15px; line-height:1.8;">
                  <div style="font-size:16px; font-weight:700; margin-bottom:8px;">📩 경품 수령 안내</div>

          <td style="padding:28px 32px 32px; font-size:15px; line-height:1.7;">
            ${closing}<br>
            <strong>크리에이터클럽 드림</strong>
          </td>
        </tr>
        <tr>
          <td style="padding:0 32px;"><div style="border-top:1px solid #e5e5e5; font-size:0; line-height:0;">&nbsp;</div></td>
        </tr>
        <tr>
          <td align="center" style="padding:36px 32px 36px; font-size:20px; line-height:1.55; font-weight:700; color:#111111;">
            당신의 작업이 무대가 되는 곳, Cre8orClub
          </td>

        <tr>
          <td style="background-color:#f3f3f3; padding:20px 32px 22px; font-size:11px; line-height:1.6; color:#777777;">

`;
}

let rawMode=false;
function values(){const v={};KEYS.forEach(k=>v[k]=$(k).value);return v}
function current(){return rawMode?$('raw').value:build(values())}
function render(){
  $('frame').srcdoc=current();
  try{localStorage.setItem(STORE,JSON.stringify({tpl:TPL,v:values(),raw:rawMode?$('raw').value:null,rawMode}))}catch(e){}
}
function load(){
  let saved=null;
  try{saved=JSON.parse(localStorage.getItem(STORE)||'null')}catch(e){}
  KEYS.forEach(k=>$(k).value=(saved&&saved.v&&saved.v[k]!=null)?saved.v[k]:DEFAULTS[k]);
  if(OLD_SUBJECTS.includes($('subject').value))$('subject').value=DEFAULTS.subject;
  if(OLD_AWARDS.includes($('awards').value))$('awards').value=DEFAULTS.awards;
  if(saved&&saved.tpl!==TPL&&saved.raw){saved.raw=null;saved.rawMode=false;setTimeout(()=>toast('양식이 바뀌어 직접 고친 HTML은 새 양식으로 다시 만들었어요.'),300)}
  if(saved&&saved.rawMode&&saved.raw){$('raw').value=saved.raw;setMode(true,false)}else render();
}
function setMode(raw,regen=true){
  rawMode=raw;
  $('tabForm').setAttribute('aria-selected',String(!raw));
  $('tabRaw').setAttribute('aria-selected',String(raw));
  $('paneForm').hidden=raw;$('paneRaw').hidden=!raw;
  if(raw&&regen)$('raw').value=build(values());
  render();
}
let tt;function toast(m){const t=$('toast');t.textContent=m;t.classList.add('show');clearTimeout(tt);tt=setTimeout(()=>t.classList.remove('show'),1800)}
async function copyText(s,msg){
  try{await navigator.clipboard.writeText(s)}catch(e){const ta=document.createElement('textarea');ta.value=s;document.body.appendChild(ta);ta.select();document.execCommand('copy');ta.remove()}
  toast(msg);
}
async function copyRich(){
  const html=current();
  try{
    await navigator.clipboard.write([new ClipboardItem({'text/html':new Blob([html],{type:'text/html'}),'text/plain':new Blob([$('frame').contentDocument.body.innerText],{type:'text/plain'})})]);
    toast('메일 본문으로 복사했어요. 메일 쓰기 창에 붙여 넣으세요.');
  }catch(e){
    const d=$('frame').contentDocument;const r=d.createRange();r.selectNodeContents(d.body);const s=d.getSelection();s.removeAllRanges();s.addRange(r);d.execCommand('copy');s.removeAllRanges();
    toast('메일 본문으로 복사했어요.');
  }
}
KEYS.forEach(k=>$(k).addEventListener('input',render));
$('raw').addEventListener('input',render);
$('tabForm').onclick=()=>{if(rawMode&&!confirm('직접 고친 HTML 대신 양식 내용으로 다시 만들어요. 계속할까요?'))return;setMode(false)};
$('tabRaw').onclick=()=>{if(!rawMode)setMode(true)};
$('copyHtml').onclick=()=>copyText(current(),'HTML 소스를 복사했어요.');
$('copyRich').onclick=copyRich;
$('copySubject').onclick=()=>copyText($('subject').value,'제목을 복사했어요.');
$('download').onclick=()=>{const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([current()],{type:'text/html'}));a.download='위클리베스트_수상안내메일.html';a.click();URL.revokeObjectURL(a.href)};
$('reset').onclick=()=>{if(!confirm('고친 내용을 모두 지우고 처음 양식으로 돌아갈까요?'))return;try{localStorage.removeItem(STORE)}catch(e){}KEYS.forEach(k=>$(k).value=DEFAULTS[k]);setMode(false)};
$('wDesk').onclick=()=>{$('frame').style.width='640px';$('wDesk').setAttribute('aria-pressed','true');$('wMobile').setAttribute('aria-pressed','false')};
$('wMobile').onclick=()=>{$('frame').style.width='390px';$('wMobile').setAttribute('aria-pressed','true');$('wDesk').setAttribute('aria-pressed','false')};
load();
</script>
</body>
