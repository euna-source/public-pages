<!doctype html>
<html lang="ko"><head>
<meta name="robots" content="noindex, nofollow"><meta charset="utf-8"><link rel="icon" href="data:,"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#121212"><title>C8 응원 리액션 비교</title>
<style>*{box-sizing:border-box}html,body{margin:0;height:100%;background:#0b0b0b;color:#f5f5f5;font-family:system-ui,sans-serif}body{height:100dvh;display:flex;flex-direction:column}header{flex:none;padding:12px 16px 10px;border-bottom:1px solid #2b2b2b}section{max-width:640px;margin:auto}.top{display:flex;align-items:center;justify-content:space-between;gap:12px}h1{font-size:14px;margin:0}p{font-size:12px;color:#aaa;margin:6px 0 10px}nav{display:grid;grid-template-columns:repeat(6,1fr);gap:6px}nav button{grid-column:span 2}nav button:nth-child(n+4){grid-column:span 3}.custom{margin-top:10px;display:flex;align-items:center;gap:10px}.custom label{font-size:12px;white-space:nowrap}.custom input{width:100%;min-width:0;background:#202020;border:1px solid #444;color:#fff;border-radius:10px;padding:9px 12px;font-size:20px}.hint{font-size:11px;color:#aaa;margin:5px 0 0}button{font:inherit;cursor:pointer}nav button{flex:1;min-height:44px;border:1px solid #3a3a3a;border-radius:12px;background:#202020;color:#eee;font-size:20px}nav button span{font-size:11px;margin-left:4px}nav button[aria-pressed=true]{background:#07ed21;color:#111;border-color:#07ed21}button:focus-visible,a:focus-visible{outline:2px solid white;outline-offset:3px}.reset{background:none;border:0;color:#bbb;font-size:12px;padding:8px}iframe{width:100%;flex:1;min-height:0;border:0}footer{flex:none;text-align:center;padding:6px;font-size:11px;color:#888}a{color:#aaa}</style></head>
<body><header><section><div class="top"><h1>C8 · 응원 리액션</h1><button class="reset" id="reset">다시 보기 ↻</button></div><p>버전을 고르고 말풍선을 눌러보세요.</p><nav aria-label="리액션 버전"><button data-mode="hands" aria-pressed="false" aria-label="🙌 개별 버전">🙌</button><button data-mode="rock" aria-pressed="false" aria-label="🤘 개별 버전">🤘</button><button data-mode="star" aria-pressed="false" aria-label="🤩 개별 버전">🤩</button><button data-mode="mix" aria-pressed="true" aria-label="🙌 🤘 🤩 조합형">🙌🤘🤩</button><button data-mode="fire" aria-pressed="false" aria-label="🤘 🔥 🤩 조합형">🤘🔥🤩</button></nav><div class="custom"><label for="emoji">직접 입력</label><input id="emoji" type="text" placeholder="예: 😎 ⚡ 💚" maxlength="240" autocomplete="off" aria-describedby="hint"></div><p class="hint" id="hint" aria-live="polite">이모지를 입력하면 바로 미리보기 · 최대 8개</p></section></header><iframe title="선택한 응원 리액션 데모" src="mix.html"></iframe><footer>개별 3종 + 조합 2종 + 직접 입력 · <a id="direct" href="mix.html" target="_blank" rel="noopener">선택 버전만 열기 ↗</a></footer>
<script>
const frame=document.querySelector('iframe'),buttons=[...document.querySelectorAll('[data-mode]')],input=document.getElementById('emoji'),hint=document.getElementById('hint');let timer;
function show(url){frame.src=url;document.getElementById('direct').href=url}
function select(mode){clearTimeout(timer);if(!buttons.some(b=>b.dataset.mode===mode))mode='mix';buttons.forEach(b=>b.setAttribute('aria-pressed',String(b.dataset.mode===mode)));show(mode+'.html');hint.textContent='이모지를 입력하면 바로 미리보기 · 최대 8개';history.replaceState(null,'','#'+mode)}
buttons.forEach(b=>b.addEventListener('click',()=>select(b.dataset.mode)));
input.addEventListener('input',()=>{clearTimeout(timer);timer=setTimeout(()=>{const all=Array.from(new Intl.Segmenter(undefined,{granularity:'grapheme'}).segment(input.value),s=>s.segment).filter(s=>/\p{Extended_Pictographic}|\p{Regional_Indicator}|\u20e3/u.test(s));if(!all.length){hint.textContent='이모지를 입력해 주세요. 현재 선택한 버전은 유지됩니다.';return}const pool=all.slice(0,8);buttons.forEach(b=>b.setAttribute('aria-pressed','false'));show('custom.html?'+new URLSearchParams({emoji:pool.join(''),preview:'1'}));hint.textContent=all.length>8?'앞의 이모지 8개를 적용했어요.':'입력한 이모지 적용 완료 · 말풍선을 눌러 다시 볼 수 있어요.';history.replaceState(null,'','#custom');},250)});
document.getElementById('reset').addEventListener('click',()=>{clearTimeout(timer);frame.src=frame.src});select(location.hash.slice(1)||'mix');
</script></body></html>
