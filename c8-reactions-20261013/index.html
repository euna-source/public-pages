<!doctype html>
<html lang="ko"><head>
<meta name="robots" content="noindex, nofollow"><meta charset="utf-8"><link rel="icon" href="data:,"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#121212"><title>C8 응원 리액션 비교</title>
<style>*{box-sizing:border-box}html,body{margin:0;height:100%;background:#0b0b0b;color:#f5f5f5;font-family:system-ui,sans-serif}body{height:100dvh;display:flex;flex-direction:column}header{flex:none;padding:12px 16px 10px;border-bottom:1px solid #2b2b2b}section{max-width:1200px;margin:auto}.top{display:flex;align-items:center;justify-content:space-between;gap:12px}h1{font-size:14px;margin:0}p{font-size:12px;color:#aaa;margin:6px 0 10px}nav{display:flex;gap:8px;overflow-x:auto;padding:6px 6px 9px;scroll-snap-type:x proximity;scrollbar-width:thin;scrollbar-color:#555 transparent}nav button{scroll-snap-align:start}.custom{margin-top:10px;display:grid;grid-template-columns:56px minmax(0,1fr) 44px;align-items:center;gap:8px;max-width:640px}.custom .meaning{font-size:12px;padding:9px 12px;grid-column:2 / 4}.custom .add{width:44px;height:44px;border:1px solid #555;border-radius:10px;background:#07ed21;color:#111;font-size:25px}.custom .add:disabled{background:#242424;color:#666;cursor:default}.custom label{font-size:12px;white-space:nowrap}.custom input{width:100%;min-width:0;background:#202020;border:1px solid #444;color:#fff;border-radius:10px;padding:9px 12px;font-size:20px}.hint{font-size:11px;color:#aaa;margin:5px 0 0}button{font:inherit;cursor:pointer}nav button{flex:1 0 132px;min-height:76px;padding:10px 8px;border:1px solid #3a3a3a;border-radius:12px;background:#202020;color:#eee;font-size:20px}nav button .emoji{display:block;font-size:23px;line-height:1.35}nav button small{display:block;font-size:11px;line-height:1.4;color:#bbb;margin-top:5px;white-space:nowrap;max-width:100%;overflow:hidden;text-overflow:ellipsis}nav button[aria-pressed=true] small{color:#16321a}@media(max-width:600px){nav button{flex:0 0 132px}.custom{max-width:100%}}nav button[aria-pressed=true]{background:#07ed21;color:#111;border-color:#07ed21}button:focus-visible,a:focus-visible{outline:2px solid white;outline-offset:3px}.reset{background:none;border:0;color:#bbb;font-size:12px;padding:8px}iframe{width:100%;flex:1;min-height:360px;border:0}footer{flex:none;text-align:center;padding:6px;font-size:11px;color:#888}a{color:#aaa}</style></head>
<body><header><section><div class="top"><h1>C8 · 응원 리액션</h1><button class="reset" id="reset">다시 보기 ↻</button></div><p>버튼을 옆으로 넘겨 고르고, 말풍선을 눌러보세요.</p><nav aria-label="리액션 버전"><button data-mode="hands" aria-pressed="false" aria-label="🙌 좋다! 응원해"><span class="emoji" aria-hidden="true">🙌</span><small>좋다! 응원해</small></button><button data-mode="rock" aria-pressed="false" aria-label="🤘 록온! 함께 가자"><span class="emoji" aria-hidden="true">🤘</span><small>록온! 함께 가자</small></button><button data-mode="star" aria-pressed="false" aria-label="🤩 와, 멋있다!"><span class="emoji" aria-hidden="true">🤩</span><small>와, 멋있다!</small></button><button data-mode="mix" aria-pressed="true" aria-label="🙌🤘🤩 신나게 응원!"><span class="emoji" aria-hidden="true">🙌🤘🤩</span><small>신나게 응원!</small></button><button data-mode="fire" aria-pressed="false" aria-label="🤘🔥🤩 에너지 폭발!"><span class="emoji" aria-hidden="true">🤘🔥🤩</span><small>에너지 폭발!</small></button><button data-mode="awesome" aria-pressed="false" aria-label="🤩🔥💯 Awesome! 완전 인정"><span class="emoji" aria-hidden="true">🤩🔥💯</span><small>Awesome! 완전 인정</small></button><button data-mode="perfect" aria-pressed="false" aria-label="😎👌💯 Perfect! 딱 좋다"><span class="emoji" aria-hidden="true">😎👌💯</span><small>Perfect! 딱 좋다</small></button><button data-mode="stage" aria-pressed="false" aria-label="🤘🤩🔥 무대 찢었다!"><span class="emoji" aria-hidden="true">🤘🤩🔥</span><small>무대 찢었다!</small></button></nav><div class="custom"><label for="emoji">직접 입력</label><input id="emoji" type="text" placeholder="예: 😎 ⚡ 💚" maxlength="240" autocomplete="off" aria-describedby="hint"><button class="add" id="add" type="button" aria-label="입력한 조합 추가" disabled>+</button><label for="meaning">짧은 뜻</label><input class="meaning" id="meaning" type="text" placeholder="선택 · 예: 완전 내 취향!" maxlength="24" autocomplete="off"></div><p class="hint" id="hint" aria-live="polite">입력하면 미리보기 · [+]로 저장 · 이모지 최대 8개</p></section></header><iframe title="선택한 응원 리액션 데모" src="mix.html"></iframe><footer>개별 3종 + 조합 5종 + 직접 입력 · <a id="direct" href="mix.html" target="_blank" rel="noopener">선택 버전만 열기 ↗</a> · <button id="remove" hidden type="button" style="background:none;border:0;color:#aaa;font-size:11px;text-decoration:underline;cursor:pointer">저장 조합 삭제</button></footer>
<script>
const frame=document.querySelector('iframe'),nav=document.querySelector('nav'),input=document.getElementById('emoji'),meaning=document.getElementById('meaning'),hint=document.getElementById('hint'),add=document.getElementById('add');
const storageKey='c8-reactions-saved-v1',defaultHint='입력하면 미리보기 · [+]로 저장 · 이모지 최대 8개';let timer,saved=[];
const buttons=()=>[...nav.querySelectorAll('[data-mode]')];
function split(value){return Array.from(new Intl.Segmenter(undefined,{granularity:'grapheme'}).segment(value),s=>s.segment).filter(s=>/\p{Extended_Pictographic}|\p{Regional_Indicator}|\u20e3/u.test(s)).slice(0,8)}
function customUrl(emoji,preview=false){return 'custom.html?'+new URLSearchParams({emoji,preview:preview?'1':'0'})}
function show(url){frame.src=url;document.getElementById('direct').href=url}
function append(item){const b=document.createElement('button');b.type='button';b.dataset.mode=item.id;b.dataset.saved='true';b.setAttribute('aria-pressed','false');b.setAttribute('aria-label',item.emoji+' '+item.meaning);const e=document.createElement('span');e.className='emoji';e.setAttribute('aria-hidden','true');e.textContent=item.emoji;const d=document.createElement('small');d.textContent=item.meaning;d.title=item.meaning;b.append(e,d);nav.append(b)}
try{const raw=JSON.parse(localStorage.getItem(storageKey)||'[]');if(Array.isArray(raw)){for(const x of raw){if(x&&typeof x.id==='string'&&/^saved-[a-z0-9-]+$/.test(x.id)&&typeof x.emoji==='string'&&typeof x.meaning==='string'){const emoji=split(x.emoji).join('');if(emoji&&!saved.some(s=>s.id===x.id||s.emoji===emoji)){const item={id:x.id,emoji,meaning:Array.from(x.meaning).slice(0,24).join('')||'내 응원 조합'};saved.push(item);append(item)}}}}}catch(e){}
function select(mode,reveal=false){clearTimeout(timer);if(!buttons().some(b=>b.dataset.mode===mode))mode='mix';buttons().forEach(b=>b.setAttribute('aria-pressed',String(b.dataset.mode===mode)));const item=saved.find(s=>s.id===mode);document.getElementById('remove').hidden=!item;show(item?customUrl(item.emoji):mode+'.html');hint.textContent=defaultHint;history.replaceState(null,'','#'+mode);if(reveal){const active=buttons().find(b=>b.dataset.mode===mode);nav.scrollTo({left:Math.max(0,active.offsetLeft-nav.offsetLeft-8),behavior:matchMedia('(prefers-reduced-motion: reduce)').matches?'instant':'smooth'})}}
nav.addEventListener('click',e=>{const b=e.target.closest('[data-mode]');if(b)select(b.dataset.mode,true)});
function preview(){const pool=split(input.value);add.disabled=!pool.length;if(!pool.length){hint.textContent='이모지를 입력해 주세요. 현재 선택한 버전은 유지됩니다.';return}buttons().forEach(b=>b.setAttribute('aria-pressed','false'));document.getElementById('remove').hidden=true;show(customUrl(pool.join(''),true));hint.textContent='입력한 이모지 적용 완료 · 마음에 들면 [+]로 저장하세요.';history.replaceState(null,'','#custom')}
input.addEventListener('input',()=>{clearTimeout(timer);add.disabled=!split(input.value).length;timer=setTimeout(preview,250)});
add.addEventListener('click',()=>{clearTimeout(timer);const emoji=split(input.value).join('');if(!emoji)return;const existing=buttons().find(b=>b.querySelector('.emoji').textContent===emoji);if(existing){select(existing.dataset.mode,true);hint.textContent='이미 있는 조합이에요. 해당 버튼을 선택했어요.';return}const item={id:'saved-'+Date.now().toString(36)+'-'+Math.random().toString(36).slice(2,8),emoji,meaning:Array.from(meaning.value.trim()).slice(0,24).join('')||'내 응원 조합'};saved.push(item);append(item);let persistent=true;try{localStorage.setItem(storageKey,JSON.stringify(saved))}catch(e){persistent=false}select(item.id,true);hint.textContent=persistent?'버튼에 추가했어요. 같은 브라우저에 저장됩니다.':'버튼에 추가했어요. 브라우저 저장이 불가능해 이 화면에서만 유지됩니다.'});
document.getElementById('remove').addEventListener('click',()=>{const active=buttons().find(b=>b.dataset.saved&&b.getAttribute('aria-pressed')==='true');if(!active)return;saved=saved.filter(s=>s.id!==active.dataset.mode);active.remove();let persistent=true;try{localStorage.setItem(storageKey,JSON.stringify(saved))}catch(e){persistent=false}select('mix');hint.textContent=persistent?'저장한 조합을 삭제했어요.':'이 화면에서 삭제했어요. 저장이 불가능해 다시 열면 나타날 수 있습니다.'});
document.getElementById('reset').addEventListener('click',()=>{clearTimeout(timer);frame.src=frame.src});select(location.hash.slice(1)||'mix');
</script></body></html>
