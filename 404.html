<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>주소를 찾는 중</title>
<style>
:root{color-scheme:light dark}
body{margin:0;min-height:100svh;display:grid;place-items:center;padding:32px;
background:#fbfbfa;color:#181818;
font-family:-apple-system,BlinkMacSystemFont,"Pretendard","Apple SD Gothic Neo","Noto Sans KR",sans-serif}
@media (prefers-color-scheme:dark){body{background:#131313;color:#ededed}}
.card{max-width:560px;text-align:center}
h1{font-size:20px;font-weight:650;margin:0 0 12px;letter-spacing:-.01em}
p{font-size:15px;line-height:1.7;margin:0 0 16px;opacity:.75}
code{font-size:13px;opacity:.6;word-break:break-all}
a{color:inherit}
</style>
</head>
<body>
<div class="card">
<h1 id="h">주소를 찾는 중입니다</h1>
<p id="m">잠시만 기다려 주세요.</p>
<p><code id="u"></code></p>
</div>
<script>
(function () {
  var BASE = "/public-pages/";
  var out = document.getElementById("u");
  var h = document.getElementById("h");
  var m = document.getElementById("m");

  function decodeLoose(s) { try { return decodeURIComponent(s); } catch (e) { return s; } }

  // 주소가 깨지는 경로는 네 가지다 — 자모 분해형(NFD), 대소문자, 두 번 인코딩, 그리고 그 조합.
  // 배포 장부(_manifest.json)의 키가 소문자·결합형으로 접힌 값이라, 요청 경로도 같은 방식으로 접어 맞춘다.
  function fold(s) {
    var t = decodeLoose(s);
    if (/%[0-9a-fA-F]{2}/.test(t)) t = decodeLoose(t);   // 두 번 인코딩된 경우
    if (t.normalize) t = t.normalize("NFC");
    return t.toLowerCase();
  }

  var path = location.pathname;
  out.textContent = decodeLoose(path);

  var rest = path.indexOf(BASE) === 0 ? path.slice(BASE.length) : path.replace(/^\//, "");
  var slug = rest.split("/")[0];

  function giveUp() {
    h.textContent = "페이지를 찾을 수 없습니다";
    m.innerHTML = '주소를 다시 확인해 주세요. <a href="' + BASE + '">목록으로</a>';
  }

  if (!slug) { giveUp(); return; }

  var want = fold(slug);

  fetch(BASE + "_manifest.json", { cache: "no-store" })
    .then(function (r) { return r.ok ? r.json() : null; })
    .then(function (map) {
      if (!map) return giveUp();
      var entry = map[want];
      if (!entry || !entry.url) return giveUp();
      var tail = rest.slice(slug.length);          // 하위 경로는 그대로 이어 붙인다
      var target = entry.url.replace(/\/$/, "") + (tail || "/") + (location.search || "") + (location.hash || "");
      if (target === location.href) return giveUp();
      location.replace(target);
    })
    .catch(giveUp);
})();
</script>
</body>
</html>
