<title>기획의 흐름</title>

<body>
<div class="app">
<header class="topbar">
 <div><div class="brand"><span class="brand-mark" aria-hidden="true"></span><h1>기획의 흐름</h1></div><p class="subtitle">생각을 남기고, 결과로 다음 판단을 고칩니다.</p></div>
 <div class="top-actions">
  <span id="save-state" class="save-state" role="status"></span>
  <button id="undo" class="icon-button" aria-label="되돌리기" title="되돌리기 (⌘Z)"></button><button id="redo" class="icon-button" aria-label="다시 실행" title="다시 실행 (⌘⇧Z)"></button>
  <button id="theme" class="icon-button" aria-label="어두운 테마로 전환" title="테마 전환"></button>
  <div class="file-menu-wrap"><button id="file-menu-toggle" class="primary" aria-expanded="false" aria-controls="file-menu">파일<span aria-hidden="true">⌄</span></button>
   <div id="file-menu" class="file-menu" hidden>
    <button id="save-html"><span>수정한 HTML 저장<small>내용과 배치를 담아, 다른 컴퓨터에서도 열 수 있는 HTML 파일로 저장합니다.</small></span></button>
    <button id="export-json"><span>데이터 내보내기<small>단계와 기록의 백업입니다.</small></span></button>
    <button id="import-json"><span>데이터 가져오기<small>내보낸 데이터를 다시 엽니다.</small></span></button>
    <button id="export-memory"><span>기억으로 이어가기<small>업무 기록을 문서로 내려받습니다.</small></span></button>
   </div>
  </div>
 </div>
</header>
<div class="workspace-bar">
 <div class="project-context"><label for="project-title" class="sr-only">워크플로우 이름</label><input id="project-title" class="project-title" maxlength="100"><span id="project-count" class="project-count"></span></div>
 <nav class="views" aria-label="흐름 강조"><button data-view="all" class="active" aria-pressed="true">전체 흐름</button><button data-view="decision" aria-pressed="false">판단과 선택</button><button data-view="learning" aria-pressed="false">검증과 학습</button></nav>
</div>
<div id="storage-warning" class="notice" hidden role="alert"></div>
<main class="workarea">
 <section class="canvas-shell" aria-label="워크플로우 편집 영역">
  <div class="canvas-head"><div class="canvas-head-text"><strong id="canvas-mode">나의 기획 지도</strong><small>단계를 눌러 기록하고, 끌어서 배치하세요.</small></div><div class="canvas-tools"><button id="add-node">＋ 단계 추가</button><button id="connect">연결하기</button><button id="arrange" title="단계를 구역에 맞춰 다시 배치">정렬</button></div></div>
  <div id="viewport" class="canvas-viewport" aria-label="이동하고 확대할 수 있는 흐름도. 아래 단계 목록으로도 편집할 수 있습니다.">
   <div id="world" class="world"><div id="lanes" class="lanes"></div><svg id="edges" class="edges" aria-label="단계 사이의 연결"></svg><div id="nodes"></div><div id="cycle-note" class="cycle-note"><b>다음 기획이 달라지는 순간</b><br>이전 경험 때문에 바꾼<br>판단 하나를 남깁니다.</div></div>
  </div>
  <div class="canvas-foot"><div class="legend" aria-label="단계 유형 범례"><span class="legend-item" style="color:var(--cyan)"><i class="legend-mark"></i>판단</span><span class="legend-item" style="color:var(--green)"><i class="legend-mark"></i>설계·실행</span><span class="legend-item" style="color:var(--rose)"><i class="legend-mark"></i>검토</span><span class="legend-item" style="color:var(--purple)"><i class="legend-mark"></i>기억</span></div><div class="zoom-tools"><button id="zoom-out" aria-label="축소">−</button><span id="zoom-level" class="zoom-level">100%</span><button id="zoom-in" aria-label="확대">＋</button><button id="fit">전체 보기</button></div></div>
  <div id="mobile-list" class="mobile-list" aria-label="단계 목록"></div>
 </section>
 <aside id="inspector" class="inspector" aria-label="선택 단계 편집"></aside>
</main>
<footer class="page-foot"><p>이 브라우저에 자동 저장됩니다. 오래 보관하려면 <b>파일 › 수정한 HTML 저장</b>을 사용하세요.</p><button id="help" class="ghost">사용 방법</button></footer>
</div>
<input type="file" id="file-input" accept=".json,application/json" hidden aria-label="워크플로우 데이터 파일">

$('help').onclick=()=>{const body=el('div');['단계를 누르면 오른쪽에서 업무 기록·단계 설정·연결을 고칩니다.','단계를 끌어 위치를 바꿉니다. 빈 격자를 끌어 화면을 이동하고, 아래의 확대·축소 버튼을 사용하세요.','연결하기를 누른 뒤 도착 단계를 선택합니다. 연결선이나 연결 탭에서 조건을 수정할 수 있습니다.','⌘Z(Ctrl+Z)로 되돌리고, ⌘⇧Z(Ctrl+Shift+Z)로 다시 실행합니다. 입력 중에는 글 편집 단축키가 우선합니다.','지금 기록 남기기는 시점별 기록을 보존합니다. 단계 완료 표시와 실제 결과는 따로 확인하세요.','브라우저 저장은 같은 브라우저에서만 유지됩니다. 수정한 HTML 저장으로 옮겨 쓰고, 기억으로 이어가기에서 업무 기록을 내려받습니다.'].forEach(t=>body.append(el('p',{},t)));showDialog('흐름도를 사용하는 방법',body,[['확인',closeDialog,'primary']])};
$('viewport').addEventListener('pointerdown',e=>{if(e.button!==0||e.target.closest('.node,.edge-hit'))return;userView=true;pan={x:e.clientX,y:e.clientY,vx:viewBox.x,vy:viewBox.y};$('viewport').setPointerCapture(e.pointerId);$('viewport').classList.add('panning')});$('viewport').addEventListener('pointermove',e=>{if(!pan)return;viewBox.x=pan.vx+e.clientX-pan.x;viewBox.y=pan.vy+e.clientY-pan.y;applyView()});for(const event of ['pointerup','pointercancel'])$('viewport').addEventListener(event,()=>{pan=null;$('viewport').classList.remove('panning')});$('viewport').addEventListener('wheel',e=>{if(e.ctrlKey||e.metaKey){e.preventDefault();zoom(e.deltaY<0?1.07:1/1.07)}},{passive:false});
document.addEventListener('click',e=>{if(!e.target.closest('.file-menu-wrap'))menu(false)});document.addEventListener('keydown',e=>{if(e.isComposing||e.keyCode===229||$('dialog').open)return;if(e.target.closest('input,textarea,select,[contenteditable]'))return;if(e.key==='Escape'){const wasConnecting=!!connecting,wasMenuOpen=!$('file-menu').hidden;connecting=null;menu(false);if(wasConnecting){render();$('connect').focus()}else if(wasMenuOpen)$('file-menu-toggle').focus();return}if((e.metaKey||e.ctrlKey)&&e.key.toLowerCase()==='z'){e.preventDefault();historyStep(!e.shiftKey)}if((e.metaKey||e.ctrlKey)&&e.key.toLowerCase()==='s'){e.preventDefault();exportHTML()}});
window.addEventListener('storage',e=>{if(e.key===key&&e.newValue&&e.newValue!==lastPersisted)warnStorage('다른 탭에서 같은 파일을 수정했습니다. 충돌을 피하려면 현재 작업을 HTML로 저장한 뒤 새로 여세요. 자동 덮어쓰기를 멈췄습니다.')});
$('dialog').addEventListener('cancel',e=>{e.preventDefault();closeDialog()});
new ResizeObserver(entries=>{const r=entries[0].contentRect;if(!drag&&!pan){if(!userView)fit();else{if(previousViewport){viewBox.x+=(r.width-previousViewport.width)/2;viewBox.y+=(r.height-previousViewport.height)/2}applyView()}}previousViewport={width:r.width,height:r.height}}).observe($('viewport'));
selected=state.nodes[0].id;render();fit();if(!storageBlocked){$('save-state').replaceChildren(el('span',{class:'saved-dot'}),document.createTextNode(lastPersisted?'이 브라우저에 저장됨':'편집하면 자동 저장'));}
})();
</script>
</body>
</html>
