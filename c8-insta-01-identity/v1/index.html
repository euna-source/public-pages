<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Cre8orClub 인스타 콘텐츠 미리보기</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css">

<style>
:root{
  --bg:#FFFFFF; --line:#DBDBDB; --text:#0E100F; --muted:#737373; --soft:#EFEFEF; --panel:#FAFAFA;
  --brand:#07ED21; --ink:#0E100F; --card:#FFFFFF; --card2:#F5F5F5;
}
*{box-sizing:border-box;margin:0;padding:0}
html{scroll-behavior:smooth}
body{background:var(--bg);color:var(--text);
  font-family:Pretendard,'Apple SD Gothic Neo','Noto Sans KR',-apple-system,sans-serif;
  -webkit-font-smoothing:antialiased}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}

/* 상단 */
.top{position:sticky;top:0;z-index:10;background:rgba(255,255,255,.94);backdrop-filter:blur(10px);
  border-bottom:1px solid var(--line)}
.top-in{max-width:470px;margin:auto;padding:12px 16px 10px}
.top-row{display:flex;align-items:center;gap:10px}
.top h1{font-size:15px;font-weight:700;letter-spacing:-.02em;flex:1}
.tabs{display:flex;background:var(--soft);border-radius:9px;padding:3px}
.tabs button{font-size:12px;padding:5px 10px;border-radius:7px;color:var(--muted)}
.tabs button.on{background:#fff;color:var(--ink);font-weight:700;box-shadow:0 1px 3px rgba(0,0,0,.12)}
.jump{display:flex;gap:6px;overflow-x:auto;margin-top:10px;scrollbar-width:none}
.jump::-webkit-scrollbar{display:none}
.jump a{flex:none;font-size:12px;padding:6px 11px;border-radius:999px;background:var(--soft);
  color:var(--ink);text-decoration:none;white-space:nowrap}
.jump a.wk{background:linear-gradient(transparent 58%,var(--brand) 58%);border-radius:0;color:var(--ink);font-weight:800;padding-left:4px;padding-right:2px}

.wrap{max-width:470px;margin:auto;padding-bottom:80px}
[hidden]{display:none!important}

/* 프로필 그리드 */
.profile{padding:18px 16px 14px;display:flex;gap:18px;align-items:center}
.profile .pic{width:78px;height:78px;border-radius:50%;background:var(--ink);border:2px solid var(--brand);
  display:grid;place-items:center;color:var(--brand);font-weight:900;font-size:22px;flex:none}
.profile b{font-size:15px}
.profile p{font-size:13px;color:#333;line-height:1.5;margin-top:4px}
.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:2px}
.grid button{display:block;position:relative;text-align:left}
.grid .card{pointer-events:none}
.grid .gno{position:absolute;left:6px;top:6px;font-size:11px;font-weight:700;background:rgba(0,0,0,.55);
  color:#fff;padding:1px 6px;border-radius:5px;z-index:2}
.flow{padding:18px 16px 0;font-size:13.5px;line-height:1.65;color:#333}
.flow h2{font-size:14px;color:var(--ink);margin:14px 0 6px}
.flow h2:first-child{margin-top:0}
.flow .path{display:flex;flex-wrap:wrap;gap:5px;align-items:center;margin:6px 0 4px}
.flow .path span{font-size:12px;padding:4px 9px;border-radius:999px;background:var(--soft);color:var(--ink)}
.flow .path i{font-style:normal;color:#999;font-size:12px}
.flow .sum{color:var(--muted);font-size:12.5px}

/* 게시물 */
.post{border-bottom:1px solid var(--line);padding-bottom:18px;scroll-margin-top:92px}
.post-head{display:flex;align-items:center;gap:10px;padding:12px 14px}
.avatar{width:32px;height:32px;border-radius:50%;background:var(--ink);
  border:1.5px solid var(--brand);display:grid;place-items:center;
  font-size:10px;font-weight:900;color:var(--brand);letter-spacing:-.04em}
.who{flex:1;line-height:1.25}
.who b{font-size:13.5px;font-weight:700}
.who span{display:block;font-size:11.5px;color:var(--muted)}
.more{font-size:18px;color:var(--ink);letter-spacing:1px}

.carousel{position:relative}
.track{display:flex;overflow-x:auto;scroll-snap-type:x mandatory;scrollbar-width:none}
.track::-webkit-scrollbar{display:none}
.counter{position:absolute;top:12px;right:12px;background:rgba(0,0,0,.6);color:#fff;z-index:3;
  font-size:12px;padding:3px 9px;border-radius:999px;pointer-events:none}
.nav-btn{position:absolute;top:50%;transform:translateY(-50%);width:28px;height:28px;border-radius:50%;z-index:3;
  background:rgba(255,255,255,.85);color:#000;font-size:15px;display:grid;place-items:center;
  opacity:0;transition:opacity .15s}
.carousel:hover .nav-btn{opacity:1}
.nav-btn.prev{left:10px}.nav-btn.next{right:10px}
.nav-btn[disabled]{display:none}
@media (hover:none){.nav-btn{display:none}}

/* 카드 (4:5) — 바탕 셋: t-w 흰색 · t-k 검정 · t-g 초록. 강조 방식은 바탕마다 다르다 */
.card{flex:none;width:100%;aspect-ratio:4/5;scroll-snap-align:center;container-type:inline-size;
  position:relative;overflow:hidden;background:var(--c-bg);color:var(--c-fg)}
.t-w{--c-bg:#FFFFFF;--c-fg:#0E100F;--c-mu:#6B6B6B;--c-pg:#9A9A9A;--c-soft:#EFEFEF;--c-line:#D0D0D0;--c-dim:#B5B5B5;
  --c-acc:#07ED21;--c-on:#0E100F;--c-box:#FFFFFF;--c-dot:#D6D6D6;--c-bar:#0E100F;
  --em-bg:linear-gradient(transparent 58%,#07ED21 58%);--em-fg:inherit;--num-fg:#0E100F;--num-ul:#07ED21}
.t-k{--c-bg:#0E100F;--c-fg:#FFFFFF;--c-mu:#A3A3A3;--c-pg:#6A6A6A;--c-soft:#242624;--c-line:#3A3C3A;--c-dim:#5E605E;
  --c-acc:#07ED21;--c-on:#0E100F;--c-box:#181A18;--c-dot:#2A2C2A;--c-bar:#000000;
  --em-bg:none;--em-fg:#07ED21;--num-fg:#07ED21;--num-ul:transparent}
.t-g{--c-bg:#07ED21;--c-fg:#0E100F;--c-mu:rgba(14,16,15,.72);--c-pg:rgba(14,16,15,.5);--c-soft:rgba(255,255,255,.6);--c-line:rgba(14,16,15,.35);--c-dim:rgba(14,16,15,.4);
  --c-acc:#0E100F;--c-on:#07ED21;--c-box:#FFFFFF;--c-dot:rgba(14,16,15,.16);--c-bar:#0E100F;
  --em-bg:#0E100F;--em-fg:#07ED21;--num-fg:#0E100F;--num-ul:transparent}
.ci{position:absolute;inset:0;display:flex;flex-direction:column;padding:9cqw 8cqw 7cqw}
.ci>*{position:relative;z-index:1}
.card .pg{font-size:3.2cqw;font-weight:700;color:var(--c-pg);letter-spacing:.04em;display:flex;justify-content:space-between}
.card .body{margin-top:auto;margin-bottom:auto}
.card .ey{display:inline-block;font-size:3.4cqw;font-weight:800;letter-spacing:.08em;color:var(--c-on);background:var(--c-acc);padding:.8cqw 2.2cqw;border-radius:1cqw;margin-bottom:4cqw}
.card .pre{font-size:5cqw;color:var(--c-mu);line-height:1.45;margin-bottom:3cqw;font-weight:500;word-break:keep-all}
.card h3{font-size:8.4cqw;line-height:1.3;letter-spacing:-.045em;font-weight:800;word-break:keep-all}
.card h3.m{font-size:7cqw}
.card h3.b{font-size:18cqw;letter-spacing:-.02em;margin-top:2cqw}
.card h3 .dim{color:var(--c-dim)}
.card em{font-style:normal;background:var(--em-bg);color:var(--em-fg);-webkit-box-decoration-break:clone;box-decoration-break:clone}
.t-g em{padding:0 .15em}
.card p{font-size:4.4cqw;color:var(--c-mu);margin-top:4.5cqw;line-height:1.5;word-break:keep-all}
.card .foot{display:flex;justify-content:space-between;align-items:center;font-size:3cqw;color:var(--c-pg);font-weight:700;margin-top:auto}
.card .foot i{font-style:normal;color:var(--c-acc)}
.card .cont{font-size:3.2cqw;color:var(--c-pg);margin-top:6cqw}
.card .cont em{font-weight:800}

.card .num{font-size:15cqw;font-weight:900;color:var(--num-fg);line-height:1.1;margin-bottom:4cqw;letter-spacing:-.04em;text-decoration:underline;text-decoration-color:var(--num-ul);text-decoration-thickness:2.4cqw;text-underline-offset:1cqw;text-decoration-skip-ink:none}
.card .chips{display:flex;flex-wrap:wrap;gap:2cqw;margin-top:4.5cqw}
.card .chips span{font-size:3.8cqw;font-weight:700;padding:1.6cqw 3.4cqw;border-radius:999px;border:.35cqw solid var(--c-line)}
.card .chips.knock span{border-color:var(--c-acc);background:var(--c-acc);color:var(--c-on)}

.card .src{display:inline-block;font-size:3.6cqw;font-weight:700;color:var(--c-on);background:var(--c-acc);
  padding:1.2cqw 3cqw;border-radius:999px;margin-bottom:5cqw}
.card .bubble{background:var(--c-soft);border-radius:5cqw 5cqw 5cqw 1.2cqw;padding:4.5cqw 5cqw;
  font-size:5.8cqw;line-height:1.42;font-weight:600;max-width:90%;word-break:keep-all;display:inline-block}
.card .bubble.sm{font-size:4.8cqw;margin-top:4cqw}

/* DM 입력창 (07) */
.card .dm{border:.4cqw solid var(--c-line);border-radius:4cqw;padding:5cqw;background:var(--c-box);color:var(--c-fg)}
.t-g .dm{color:#0E100F;border-color:transparent}
.card .dm .to{font-size:3.4cqw;color:#999;margin-bottom:3cqw}
.card .dm .txt{font-size:6cqw;line-height:1.42;font-weight:600;word-break:keep-all}
.card .dm .txt::after{content:"";display:inline-block;width:.5cqw;height:6cqw;background:#07ED21;margin-left:1cqw;vertical-align:-1cqw;animation:blink 1s steps(1) infinite}
.t-g .dm .txt::after{background:#0E100F}
@keyframes blink{50%{opacity:0}}

/* 파일 목록 (08) */
.card .files{margin-top:5cqw;display:flex;flex-direction:column;gap:2cqw}
.card .files span{font-family:ui-monospace,Menlo,monospace;font-size:4.2cqw;padding:2.4cqw 3.4cqw;background:var(--c-soft);border-radius:2cqw;color:var(--c-mu)}
.card .files span:last-child{border:.35cqw solid var(--c-fg);background:var(--c-box);color:var(--c-fg);box-shadow:inset 1.4cqw 0 0 var(--c-acc)}
.t-g .files span:last-child{color:#0E100F}

/* 엔딩크레딧 (05) */
.card.credit{text-align:center}
.card.credit .roles{font-size:7.4cqw;font-weight:800;line-height:1.45;letter-spacing:-.03em}
.card.credit p{margin-top:6cqw}

/* 점 배경 (09) */
.card.field .ci{background-image:radial-gradient(var(--c-dot) 18%,transparent 22%);background-size:6.4cqw 6.4cqw}
.card.field .ci::after{content:"";position:absolute;right:16cqw;top:24cqw;width:4cqw;height:4cqw;border-radius:50%;
  background:var(--c-acc);box-shadow:0 0 0 2.4cqw rgba(7,237,33,.22);z-index:0}

/* 필름 (10) */
.card.film .ci::before,.card.film .ci::after{content:"";position:absolute;left:0;right:0;height:7cqw;background:var(--c-bar);z-index:0}
.card.film .ci::before{top:0}.card.film .ci::after{bottom:0}

.card .mark{margin-top:7cqw;line-height:1.2}
.card .mark b{display:block;font-size:5.4cqw;font-weight:900;letter-spacing:-.02em}
.card .mark b::before{content:"● ";color:var(--c-acc);font-size:.7em;vertical-align:.12em}
.card .mark span{font-size:3.4cqw;color:var(--c-pg);letter-spacing:.12em}

/* 표지 */
.card.cover h3{font-size:10cqw;font-weight:900;line-height:1.22}
.card.cover h3.s{font-size:8.4cqw}
.card.cover .body{margin-top:auto;margin-bottom:6cqw}
.card.cover .kicker{font-size:3.6cqw;font-weight:800;letter-spacing:.06em;margin-bottom:4cqw;color:var(--c-mu)}
.grid .t-w{box-shadow:inset 0 0 0 1px var(--line)}

.card.cta h3::before{content:"";display:block;width:12cqw;height:1.8cqw;background:var(--c-acc);margin-bottom:5cqw}
.card .btn{display:inline-block;margin-top:6cqw;font-size:4cqw;font-weight:700;padding:2.6cqw 5cqw;
  border-radius:999px;border:.4cqw solid var(--c-fg)}


/* 2안 카드 부품 */
.card .files.stk{margin:0 0 6cqw}
.card .files span{word-break:break-all}
.card .vs{display:flex;flex-direction:column;gap:3cqw}
.card .vs .opt{font-size:6.2cqw;font-weight:800;line-height:1.3;padding:5cqw 5cqw;border-radius:3cqw;background:var(--c-soft);word-break:keep-all;letter-spacing:-.03em}
.t-g .vs .opt{color:#0E100F}
.card .vs .opt small{display:block;margin-top:2.6cqw;font-size:3.5cqw;font-weight:500;line-height:1.45;letter-spacing:0;opacity:.75}
.card .vs .opt small b{font-weight:800;opacity:1}
.card .vs .x{align-self:center;font-size:4cqw;font-weight:900;color:var(--c-on);background:var(--c-acc);padding:1.2cqw 3.8cqw;border-radius:999px;letter-spacing:.1em}
.card .ab{display:flex;flex-direction:column;gap:2.4cqw;margin-top:5cqw}
.card .ab div{display:flex;gap:3cqw;align-items:center;font-size:5cqw;font-weight:700;padding:3.8cqw 4cqw;border:.35cqw solid var(--c-line);border-radius:3cqw;word-break:keep-all}
.card .ab b{flex:none;width:7.4cqw;height:7.4cqw;border-radius:50%;background:var(--c-acc);color:var(--c-on);display:grid;place-items:center;font-size:3.8cqw}
.card .chat{display:flex;flex-direction:column;gap:3cqw}
.card .chat span{max-width:84%;font-size:5.8cqw;font-weight:600;line-height:1.4;padding:4cqw 4.8cqw;border-radius:5cqw 5cqw 5cqw 1.2cqw;background:var(--c-soft);align-self:flex-start;word-break:keep-all}
.t-g .chat span{color:#0E100F}
.card .chat span.me{align-self:flex-end;border-radius:5cqw 5cqw 1.2cqw 5cqw;background:var(--c-acc);color:var(--c-on)}
.card .ans{margin-top:6cqw;border:.35cqw dashed var(--c-line);border-radius:3cqw;padding:5cqw 4cqw;font-size:3.6cqw;color:var(--c-pg)}
.card .saved{width:6cqw;height:7.6cqw;background:var(--c-acc);clip-path:polygon(0 0,100% 0,100% 100%,50% 76%,0 100%);margin-bottom:5cqw}
.card .vsx{font-size:.6em;color:var(--c-mu);margin:0 .2em;vertical-align:.12em}
.card .series{margin-top:7cqw;line-height:1.25}
.card .series b{display:block;font-size:6.4cqw;font-weight:900;letter-spacing:.02em}
.card .series span{font-size:3.4cqw;color:var(--c-pg)}
.card.credit .pre{margin-bottom:2cqw}


/* 원페이지 릴스 (9:16) */
.reel{position:relative;width:100%;aspect-ratio:9/16;container-type:inline-size;background:#0E100F;color:#fff;overflow:hidden}
.reel .ri{position:absolute;inset:0;display:flex;flex-direction:column;padding:12cqw 7cqw 6cqw}
.reel .bar{position:absolute;top:4cqw;left:4cqw;right:4cqw;height:.8cqw;background:rgba(255,255,255,.25);border-radius:1cqw;overflow:hidden}
.reel .bar i{display:block;height:100%;background:#fff;transform-origin:left;animation:rbar 9s linear infinite}
@keyframes rbar{from{transform:scaleX(0)}to{transform:scaleX(1)}}
.reel .kick{font-size:3.4cqw;font-weight:800;letter-spacing:.08em;color:#07ED21}
.reel h3{font-size:9cqw;font-weight:900;line-height:1.25;letter-spacing:-.045em;margin:3cqw 0 7cqw;word-break:keep-all}
.reel h3.s{font-size:8cqw}
.reel h3.l3{font-size:7.4cqw;margin-bottom:4cqw}
.reel .duel{margin-top:auto;display:flex;flex-direction:column;gap:3cqw}
.reel .opt{border-radius:4cqw;padding:4.6cqw 5cqw;display:flex;gap:4cqw;align-items:flex-start;font-size:5.2cqw;font-weight:700;line-height:1.38;word-break:keep-all;color:#0E100F}
.reel .opt b{flex:none;font-size:8cqw;font-weight:900;line-height:1}
.reel .opt.a{background:#FFFFFF;animation:pa 9s ease-in-out infinite}
.reel .opt.b{background:#07ED21;animation:pb 9s ease-in-out infinite}
@keyframes pa{0%,15%,45%,100%{transform:none;box-shadow:none}22%,38%{transform:scale(1.025);box-shadow:0 0 0 1.2cqw rgba(255,255,255,.28)}}
@keyframes pb{0%,50%,80%,100%{transform:none;box-shadow:none}57%,73%{transform:scale(1.025);box-shadow:0 0 0 1.2cqw rgba(7,237,33,.35)}}
.reel .vs{align-self:center;font-size:4cqw;font-weight:900;letter-spacing:.1em;border:.4cqw solid #fff;border-radius:999px;padding:.8cqw 4cqw}
.reel .q{margin-top:6cqw;font-size:4.6cqw;color:#A3A3A3;line-height:1.45;word-break:keep-all}
.reel .q strong{display:block;color:#fff;font-size:7.4cqw;font-weight:900;margin-top:2.4cqw;letter-spacing:-.03em}
.reel .q em{font-style:normal;color:#07ED21;font-weight:700}
.reel .acct{margin-top:6cqw;display:flex;align-items:center;gap:2.4cqw;font-size:3.6cqw;font-weight:700}
.reel .acct .av{width:7cqw;height:7cqw;border-radius:50%;border:.4cqw solid #07ED21;display:grid;place-items:center;font-size:2.4cqw;font-weight:900;color:#07ED21}
.reel .acct .ic{margin-left:auto;display:flex;gap:4cqw}
.reel .acct svg{width:6.4cqw;height:6.4cqw;stroke:#fff;fill:none;stroke-width:1.8}
.card .rico{position:absolute;right:5cqw;top:7cqw;z-index:2;font-size:4cqw;line-height:1}
@media (prefers-reduced-motion:reduce){.reel .bar i,.reel .opt{animation:none}}


/* 마지막 장 앱 화면 (1안) */
.card.has-shot .body{margin:4cqw 0 0}
.card.has-shot h3{font-size:7cqw}
.card.has-shot p{font-size:4cqw;margin-top:3cqw}
.card.has-shot .btn{margin-top:4cqw}
.card.has-shot .foot,.card.has-shot .mark{display:none}
.card .shotlbl{display:inline-flex;align-items:center;gap:1.4cqw;margin-top:5cqw;font-size:3.2cqw;font-weight:800;letter-spacing:.02em;color:var(--c-mu)}
.card .shotlbl::before{content:"";width:2cqw;height:2cqw;border-radius:50%;background:var(--c-acc)}
.card .shotwrap{flex:1 1 auto;min-height:34cqw;position:relative;margin:3cqw -8cqw -7cqw;overflow:hidden}
.card .phone{position:absolute;left:50%;top:0;transform:translateX(-50%);width:50cqw;border:1.3cqw solid #0E100F;border-bottom:0;border-radius:7cqw 7cqw 0 0;overflow:hidden;background:#000;box-shadow:0 2cqw 6cqw rgba(0,0,0,.25)}
.t-k .phone{border-color:#3A3C3A}
.card .phone img{display:block;width:100%;height:auto}

/* 고정 브랜드 소개 장 */
.card.brand .body{text-align:center;margin:auto 0}
.card.brand .we{font-size:4.4cqw;font-weight:700;color:var(--c-mu)}
.card.brand img{display:block;width:44cqw;margin:3cqw auto 6cqw}
.card.brand h3{font-size:7cqw}
.card.brand p{font-size:3.8cqw;margin-top:4cqw}
.card.brand .chips{justify-content:center;margin-top:6cqw;gap:1.4cqw;flex-wrap:nowrap}
.card.brand .chips span{font-size:3.1cqw;padding:1.4cqw 2.6cqw;border-color:#3A3C3A;color:#ddd;white-space:nowrap}

/* 안 바꾸기 */
.plans{display:flex;gap:6px;margin-top:10px}
.plans button{flex:1;font-size:12.5px;padding:7px 8px;border-radius:9px;border:1px solid var(--line);color:var(--muted);line-height:1.3}
.plans button b{display:block;font-size:13px;color:var(--ink)}
.plans button.on{border-color:var(--ink);box-shadow:inset 0 -3px 0 var(--brand);color:var(--ink)}
.flow .mix{display:flex;flex-direction:column;gap:6px;margin:8px 0 2px}
.flow .mix div{display:grid;grid-template-columns:92px 1fr 36px;gap:8px;align-items:center;font-size:12.5px}
.flow .mix i{display:block;height:10px;border-radius:3px;background:var(--brand)}
.flow .mix span:last-child{text-align:right;font-variant-numeric:tabular-nums;color:var(--muted)}
.flow .ip{display:flex;flex-direction:column;gap:6px;margin-top:6px}
.flow .ip div{display:flex;justify-content:space-between;gap:10px;font-size:13px;padding:8px 10px;border:1px solid var(--line);border-radius:8px}
.flow .ip b{font-weight:800;letter-spacing:.02em}
.flow .ip span{color:var(--muted);text-align:right}

/* 게시물 아래 */
.dots{display:flex;justify-content:center;gap:4px;margin:12px 0 4px}
.dots span{width:6px;height:6px;border-radius:50%;background:#C7C7C7;transition:background .15s}
.dots span.on{background:#0095F6}
.actions{display:flex;align-items:center;gap:14px;padding:6px 14px 0}
.actions svg{width:24px;height:24px;stroke:var(--ink);fill:none;stroke-width:1.8}
.actions .save{margin-left:auto}
.slide-type{font-size:11.5px;color:var(--muted);padding:6px 14px 0;min-height:22px}
.slide-type em{font-style:normal;color:var(--ink);font-weight:700;background:linear-gradient(transparent 58%,var(--brand) 58%)}
.meta{padding:6px 14px 0;font-size:13.5px;line-height:1.55}
.meta b{font-weight:700;margin-right:5px}
.memo{margin:12px 14px 0;padding:12px;border:1px solid var(--line);border-radius:12px;background:var(--panel);font-size:12.5px;line-height:1.6;color:#444}
.memo dt{font-size:11px;color:#8E8E8E;margin-top:10px}
.memo dt:first-child{margin-top:0}
.memo dd{color:var(--ink)}
.hooks{display:flex;flex-direction:column;gap:6px;margin-top:6px}
.hooks button{text-align:left;font-size:13px;line-height:1.4;padding:9px 11px;border-radius:9px;
  border:1px solid var(--line);background:#fff;color:#333;display:flex;gap:8px}
.hooks button b{flex:none;font-size:11px;color:#8E8E8E;padding-top:1px;min-width:34px}
.hooks button.on{border-color:var(--ink);color:var(--ink);box-shadow:inset 4px 0 0 var(--brand)}
.hooks button.on b{color:var(--ink)}

body{background:#E9E9E9}
.sheet{padding:28px 24px 36px}
.sheet h1{font-size:15px;font-weight:800;letter-spacing:-.02em}
.sheet .sub{font-size:12.5px;color:#737373;margin:4px 0 18px}
.row{display:grid;grid-template-columns:repeat(6,1fr);gap:14px;align-items:start}
.row figure{margin:0}
.row figcaption{font-size:12px;color:#444;margin-top:8px;line-height:1.4}
.row figcaption b{color:#0E100F}
.row .card{box-shadow:0 1px 3px rgba(0,0,0,.12)}
.nav-note{display:none}
body.solo{background:#fff}
body.solo .sheet{padding:0}
body.solo .sheet h1,body.solo .sub,body.solo figcaption{display:none}
body.solo .row{display:block;width:1080px}
body.solo .row figure{display:none}
body.solo .row figure.on{display:block}
body.solo .row .card{box-shadow:none}
</style>

    {vs:['완벽주의 팀원','마감주의 팀원'], ty:[['한끗추구형','마지막 한 끗까지 함께 본다'],['마침표우선형','끝내야 다음 것도 만든다']]},
    {k:'cta',t:'CTA', h:'가장 끔찍한 것<br>하나만 고르세요.', p:'댓글에서 싸우기(?) ↓'}
  ]},
{ nav:'작업 취향', type:'참여 / 자기표현', title:'작업 취향 테스트',
  core:'MBTI처럼 억지 유형을 만들어 사실인 것처럼 설명하지 않고, 단순 취향 선택 콘텐츠로 갑니다.',
  hooks:['당신의<br>작업 취향은<br>어느 쪽?','같은 크리에이터인데<br>이렇게 다릅니다','10초 만에 보는<br>작업 취향'],
  slides:[
    {k:'cover',t:'커버'},
    {h:'새 프로젝트 시작', hm:1, ab:['레퍼런스부터 100개','일단 만들어봄']},
    {h:'작업 환경', hm:1, ab:['완벽하게 정리','필요한 것만 찾으면 됨']},
    {h:'마감', hm:1, ab:['하루 전 완료','마감이 나를 완성시킨다']},
    {h:'협업', hm:1, ab:['역할 명확하게','다 같이 이것저것']},
    {h:'피드백', hm:1, ab:['구체적으로 주세요','일단 제가 해석해볼게요']},
    {k:'cta',t:'CTA', h:'A가 많았나요,<br>B가 많았나요?', p:'같이 일하는 친구도 태그해보세요.'}
  ]},
{ nav:'결과물 밖', type:'브랜드 다큐', title:'결과물 밖의 사람들', film:1,
  core:'밈보다 브랜드 깊이를 만들어주는 콘텐츠.',
  hooks:['우리는<br>완성된 작업만<br>보지만','작품 하나가<br>세상에 나오기<br>전까지','결과물에는<br>나오지 않는 것들'],
  slides:[
    {k:'cover',t:'커버'},
    {pre:'그 뒤에는', h:'수십 번의<br>수정이 있고'},
    {pre:'밤늦게까지 이어진', h:'회의가 있고'},
    {pre:'이름조차 보이지 않는', h:'수많은 손이 있고'},
    {pre:'처음 만났지만', h:'한 팀이 된<br>사람들이 있고'},
    {t:'결론', pre:'그 모든 과정 끝에', h:'하나의 결과물이<br>나옵니다.'},
    {k:'cta',t:'BRAND', h:'그래서 우리는<br>작품뿐 아니라<br>그걸 만든 사람을<br>봅니다.', hm:1, mark:1}
  ]}
];
/* 1안: 마지막 장에 그 게시물 소재의 앱 화면(05·08은 원고가 일부러 앱을 말하지 않고, 10은 브랜드 선언이라 뺌) */
const A_SHOT = {0:['profile','Cre8orClub 프로필'], 1:['portfolio','포트폴리오 상세'], 2:['finder','파인더'], 3:['dial','다이얼 · 인맥 둘러보기'],
                5:['myprofile','내 프로필'], 6:['knock','노크'], 8:['chat','채팅']};
Object.entries(A_SHOT).forEach(([i,[shot,label]]) => { const last = POSTS_A[i].slides[POSTS_A[i].slides.length-1]; last.shot = shot; last.shotLabel = label; });
/* 모든 카드뉴스 끝에 고정 브랜드 소개 장(릴스 제외) */
[...POSTS_A, ...POSTS_B].forEach(p => { if (!p.reel) p.slides.push({k:'brand', t:'브랜드 소개'}); });
const PLANS = { a:{posts:POSTS_A, weeks:true}, b:{posts:POSTS_B} };

/* 표지 한 줄이 12자를 넘으면 글자를 한 단계 줄인다 */
const fit = h => Math.max(...h.split('<br>').map(l=>l.length)) > 12 ? 's' : '';
const pad = n => String(n).padStart(2,'0');




/* 표지 바탕: 프로필 그리드(10→1)에서 같은 색이 한 줄·한 칸에 몰리지 않게 배치 */
const COVER = ['g','w','k','g','k','g','w','g','w','k'];
/* 본문 장 바탕: 결론·반전·인사이트는 초록, CTA는 초록(앞 장이 초록이면 흰색), 브랜드 장은 검정, 나머지는 흰색·검정 번갈아 */
const KEY = ['결론','반전','인사이트','전환'];
function themesFor(post, i){
  const cv = COVER[i], pair = cv === 'k' ? ['w','k'] : ['k','w'];
  let body = 0;
  return post.slides.reduce((arr, s, j) => {
    const prev = arr[j-1];
    let t;
    if (j === 0) t = cv;
    else if (s.th) t = s.th;
    else if (s.k === 'brand') t = 'k';
    else if (s.k === 'cta') { t = prev === 'g' ? 'w' : 'g'; }
    else if (KEY.includes(s.t)) t = 'g';
    else t = pair[body++ % 2];
    arr.push(t); return arr;
  }, []);
}
function coverCard(post, i, hookIdx){
  const no = pad(i+1), total = post.slides.length;
  const film = post.film ? ' film' : '';
  return `<div class="card cover t-${COVER[i]}${film}"><div class="ci">
    <div class="pg"><span>${post.reel ? 'REELS' : '01 / '+pad(total)}</span></div>${post.reel ? '<span class="rico">▶</span>' : ''}
    <div class="body"><div class="kicker">${post.series || post.type.split(' / ')[0]}</div><h3 data-cover class="${fit(post.hooks[hookIdx])}">${post.hooks[hookIdx]}</h3></div>
    <div class="foot"><span><i>●</i> Cre8orClub</span><span>${no}</span></div></div></div>`;
}

function reelCard(post){
  const r = post.reel, h = post.hooks[0];
  return `<div class="reel"><div class="ri"><div class="bar"><i></i></div>
    <div class="kick">${post.series}</div><h3 data-cover class="${fit(h)} ${h.split('<br>').length>2?'l3':''}">${h}</h3>
    <div class="duel"><div class="opt a"><b>A</b><span>${r.a}</span></div><span class="vs">VS</span><div class="opt b"><b>B</b><span>${r.b}</span></div></div>
    <div class="q">${r.q}<strong>${r.cta}</strong><em>${r.p}</em></div>
    <div class="acct"><span class="av">C8</span>cre8orclub<span class="ic">${ICON.heart.replace('<svg','<svg')}${ICON.comment}${ICON.share}</span></div>
  </div></div>`;
}
function slideCard(post, i, s, j){
  const no = pad(i+1), total = post.slides.length;
  if (s.k === 'cover') return coverCard(post, i, 0);
  if (s.k === 'brand') return `<div class="card brand t-k${post.film?' film':''}"><div class="ci"><div class="pg"><span>${pad(j+1)} / ${pad(total)}</span></div>
    <div class="body"><div class="we">우리는</div><img src="${SHOTS.logo}" alt="Cre8orClub">
      <h3>작업으로 발견하고<br>사람으로 연결되는 곳.</h3>
      <p>음악·영상·사진·디자인·공연·촬영·음향·무대까지,<br>만드는 사람들의 크리에이티브 네트워크</p>
      <div class="chips"><span>프로필</span><span>포트폴리오</span><span>파인더</span><span>프로젝트</span><span>노크</span></div></div>
    <div class="foot"><span><i>●</i> Cre8orClub</span><span>${no}</span></div></div></div>`;
  const cls = ['card'];
  if (s.k === 'cta') cls.push('cta');
  if (s.shot) cls.push('has-shot');
  if (s.k === 'credit') cls.push('credit');
  if (s.k === 'field') cls.push('field');
  if (post.film) cls.push('film');
  cls.push('t-' + themesFor(post, i)[j]);
  let b = '';
  if (s.ey) b += `<div class="ey">${s.ey}</div>`;
  if (s.num) b += `<div class="num">${s.num}</div>`;
  if (s.roles) b += `<div class="roles">${s.roles.join('<br>')}</div>`;
  if (s.stack) b += `<div class="files stk">${s.stack.map(x=>`<span>📄 ${x}</span>`).join('')}</div>`;
  if (s.saved) b += `<div class="saved"></div>`;
  if (s.chat) b += `<div class="chat">${s.chat.map(([t,me])=>`<span class="${me?'me':''}">${t}</span>`).join('')}</div>`;
  if (s.vs) { const ty = k => s.ty ? `<small>이걸 골랐다면 → <b>${s.ty[k][0]}</b><br>${s.ty[k][1]}</small>` : '';
    b += `<div class="vs"><div class="opt">${s.vs[0]}${ty(0)}</div><span class="x">VS</span><div class="opt">${s.vs[1]}${ty(1)}</div></div>`; }
  if (s.src) b += `<div><span class="src">${s.src}</span></div><div class="bubble">${s.bubble}</div>`;
  if (s.dm) b += `<div class="dm"><div class="to">메시지 작성 중…</div><div class="txt">“${s.dm}”</div></div>`;
  if (s.knock) b += `<div class="chips knock" style="margin:0 0 6cqw">${s.knock.map(x=>`<span>“${x}”</span>`).join('')}</div>`;
  if (s.pre) b += `<div class="pre">${s.pre}</div>`;
  if (s.h) b += `<h3${s.hm?' class="m"':s.hb?' class="b"':''}>${s.h}</h3>`;
  if (s.chips) b += `<div class="chips">${s.chips.map(x=>`<span>${x}</span>`).join('')}</div>`;
  if (s.ab) b += `<div class="ab">${s.ab.map((x,k)=>`<div><b>${'AB'[k]}</b>${x}</div>`).join('')}</div>`;
  if (s.ans) b += `<div class="ans">현업자 답변이 들어갈 자리</div>`;
  if (s.files) b += `<div class="files">${s.files.map(x=>`<span>📄 ${x}</span>`).join('')}</div>`;
  if (s.bubble && !s.src) b += `<div><span class="bubble sm">${s.bubble}</span></div>`;
  if (s.p) b += `<p>${s.p}</p>`;
  if (s.btn) b += `<span class="btn">→ ${s.btn}</span>`;
  if (s.mark) b += MARK;
  if (s.series) b += `<div class="series"><b>${s.series}</b><span>by Cre8orClub</span></div>`;
  if (s.cont) b += `<div class="cont">${s.cont}</div>`;
  if (s.shot) return `<div class="${cls.join(' ')}"><div class="ci"><div class="pg"><span>${pad(j+1)} / ${pad(total)}</span></div>
    <div class="body">${b}<div class="shotlbl">${s.shotLabel}</div></div>
    <div class="shotwrap"><div class="phone"><img src="${SHOTS[s.shot]}" alt="${s.shotLabel} 화면"></div></div></div></div>`;
  return `<div class="${cls.join(' ')}"><div class="ci"><div class="pg"><span>${pad(j+1)} / ${pad(total)}</span></div>
    <div class="body">${b}</div><div class="foot"><span><i>●</i> Cre8orClub</span><span>${no}</span></div></div></div>`;
}

function render(plan){
  const P = PLANS[plan], POSTS = P.posts;
  feed.innerHTML = ''; grid.innerHTML = ''; jump.innerHTML = '';
  document.getElementById('flow-a').hidden = plan !== 'a';
  document.getElementById('flow-b').hidden = plan !== 'b';
  document.getElementById('gcount').textContent = `게시물 ${POSTS.length}개 · 최신 게시물이 왼쪽 위`;
POSTS.forEach((post, i) => {
  const no = pad(i+1), id = plan+(i+1), total = post.slides.length;
  const week = i < 5 ? '1주차' : '2주차';
  if (P.weeks && (i === 0 || i === 5)) jump.insertAdjacentHTML('beforeend', `<a class="wk" href="#${id}">${week}</a>`);
  jump.insertAdjacentHTML('beforeend', `<a href="#${id}">${no} ${post.nav}</a>`);

  const hookBtns = post.hooks.map((h, j) =>
    `<button class="${j===0?'on':''}" data-i="${j}"><b>${j===0?'★ 추천':'후보 '+pad(j+1)}</b><span>${h.replace(/<br>/g,' ')}</span></button>`).join('');

  feed.insertAdjacentHTML('beforeend', `
    <article class="post" id="${id}">
      <div class="post-head"><div class="avatar">C8</div>
        <div class="who"><b>cre8orclub</b><span>${P.weeks ? week+' · ' : ''}${no} · ${post.series || post.type}</span></div><span class="more">···</span></div>
      <div class="carousel">
        <div class="track">${post.reel ? reelCard(post) : post.slides.map((s,j)=>slideCard(post,i,s,j)).join('')}</div>
        <span class="counter"${post.reel?' hidden':''}>1/${total}</span>
        <button class="nav-btn prev" aria-label="이전" disabled>‹</button>
        <button class="nav-btn next" aria-label="다음"${post.reel?' disabled':''}>›</button>
      </div>
      <div class="dots"${post.reel?' hidden':''}>${post.slides.map((_,j)=>`<span class="${j?'':'on'}"></span>`).join('')}</div>
      <div class="actions">${ICON.heart}${ICON.comment}${ICON.share}<span class="save">${ICON.save}</span></div>
      <div class="slide-type" data-type></div>
      <div class="meta"><b>cre8orclub</b>${post.title}</div>
      <dl class="memo">
        ${[['유형',post.type],['시리즈',post.series],['목적',post.purpose],['핵심',post.core],['그래픽',post.graphic],['기획 메모',post.note]]
          .filter(([,v])=>v).map(([k,v])=>`<dt>${k}</dt><dd>${v}</dd>`).join('')}
        <dt>${post.hooks.length>1 ? '표지 문구 후보 · 누르면 1장이 바뀝니다' : '표지 문구'}</dt>
        <dd class="hooks">${hookBtns}</dd>
      </dl>
    </article>`);

  const el = feed.lastElementChild;
  const track = el.querySelector('.track');
  const counter = el.querySelector('.counter');
  const dots = el.querySelectorAll('.dots span');
  const prev = el.querySelector('.prev'), next = el.querySelector('.next');
  const typeEl = el.querySelector('[data-type]');
  const setType = n => { if (post.reel) { typeEl.innerHTML = '릴스 · 한 화면 · <em>A/B 한 문제</em>'; return; } const t = post.slides[n].t; typeEl.innerHTML = `${n+1}장` + (t ? ` · 기획안 표기 <em>${t}</em>` : ''); };
  setType(0);
  track.addEventListener('scroll', () => {
    const n = Math.round(track.scrollLeft / track.clientWidth);
    counter.textContent = `${n+1}/${total}`;
    dots.forEach((d,k)=>d.classList.toggle('on', k===n));
    prev.disabled = n===0; next.disabled = n===total-1;
    setType(n);
  }, {passive:true});
  prev.onclick = () => track.scrollBy({left:-track.clientWidth, behavior:'smooth'});
  next.onclick = () => track.scrollBy({left: track.clientWidth, behavior:'smooth'});
  el.querySelectorAll('.hooks button').forEach(b => b.onclick = () => {
    el.querySelectorAll('.hooks button').forEach(x=>x.classList.remove('on'));
    b.classList.add('on');
    const cv = el.querySelector('[data-cover]'); cv.innerHTML = post.hooks[+b.dataset.i]; cv.classList.toggle('s', fit(post.hooks[+b.dataset.i]) === 's'); cv.classList.toggle('l3', post.hooks[+b.dataset.i].split('<br>').length > 2);
    track.scrollTo({left:0, behavior:'smooth'});
  });
});

/* 그리드: 인스타 프로필처럼 최신(10)이 왼쪽 위 */
POSTS.map((p,i)=>({p,i})).reverse().forEach(({p,i}) => {
  grid.insertAdjacentHTML('beforeend',
    `<button data-go="${plan}${i+1}"><span class="gno">${pad(i+1)}</span>${coverCard(p,i,0)}</button>`);
});
grid.querySelectorAll('button').forEach(b => b.onclick = () => { show('feed'); document.getElementById(b.dataset.go).scrollIntoView(); });
}


function show(v){
  document.querySelectorAll('.tabs button').forEach(b=>b.classList.toggle('on', b.dataset.v===v));
  document.getElementById('v-feed').hidden = v!=='feed';
  document.getElementById('v-grid').hidden = v!=='grid';
  jump.hidden = v!=='feed';
  if (v==='grid') window.scrollTo(0,0);
}
document.querySelectorAll('.tabs button').forEach(b => b.onclick = () => show(b.dataset.v));
document.querySelectorAll('.plans button').forEach(b => b.onclick = () => {
  document.querySelectorAll('.plans button').forEach(x => x.classList.toggle('on', x === b));
  render(b.dataset.p); window.scrollTo(0,0);
});

const post = POSTS_A[0];
const row = document.getElementById('row');
const solo = new URLSearchParams(location.search).get('solo');
if (solo) document.body.classList.add('solo');
row.innerHTML = post.slides.map((s,j)=>`<figure class="${solo==j+1?'on':''}">${slideCard(post,0,s,j)}<figcaption><b>${String(j+1).padStart(2,'0')}</b> · ${s.t||''}</figcaption></figure>`).join('');
</script></body></html>
