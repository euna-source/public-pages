<!doctype html>
<html lang="ko">
<head>
<meta name="robots" content="noindex, nofollow">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>위클리베스트 바이럴 마케팅 · 외부 게시물 이미지</title>
<link rel="canonical" href="https://euna-source.github.io/public-pages/weeklybest-viral-marketing-external-post-image/">
<meta name="description" content="매주 총 50만원 상품권 증정. 작품 TOP 10과 크리에이터 TOP 10, 매주 월요일 새로 시작해요.">
<meta property="og:title" content="위클리베스트 바이럴 마케팅 · 외부 게시물 이미지">
<meta property="og:description" content="매주 총 50만원 상품권 증정. 작품 TOP 10과 크리에이터 TOP 10, 매주 월요일 새로 시작해요.">
<meta property="og:image" content="https://euna-source.github.io/public-pages/weeklybest-viral-marketing-external-post-image/weeklybest-poster.png">
<style>
:root{--bg:#121212;--text:#F5F5F5;--line:#2b2b2b;--panel:#1E1E1E}
html,body{margin:0;background:var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,"Pretendard","Apple SD Gothic Neo",sans-serif}
.bar{position:sticky;top:0;z-index:20;background:rgba(18,18,18,.92);backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);border-bottom:1px solid var(--line)}
.bar-inner{max-width:402px;margin:0 auto;display:flex;align-items:center;justify-content:space-between;padding:0 8px 0 16px;min-height:52px}
.bar-title{margin:0;font-size:14px;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0}
.bar-actions{display:flex;gap:2px;flex:none}.tool .label{white-space:nowrap}
.tool{min-height:44px;min-width:44px;display:inline-flex;align-items:center;justify-content:center;gap:7px;padding:0 12px;border:1px solid transparent;border-radius:6px;background:none;color:inherit;font-size:14px;cursor:pointer}
.tool:hover{border-color:var(--line);background:var(--panel)}
.tool svg{width:18px;height:18px;fill:none;stroke:currentColor;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}
img.page{display:block;width:100%;max-width:402px;margin:0 auto}
.toast{position:fixed;left:50%;bottom:max(24px,env(safe-area-inset-bottom));transform:translateX(-50%);z-index:30;background:var(--text);color:var(--bg);padding:11px 18px;border-radius:6px;font-size:14px;max-width:calc(100% - 32px);width:max-content}
.toast:empty{display:none}
</style>
</head>
<body>
<header class="bar">
  <div class="bar-inner">
    <p class="bar-title">위클리베스트 · 바이럴 마케팅용</p>
    <div class="bar-actions">
      <button class="tool" id="copy-btn" type="button" aria-label="이 페이지 링크 복사">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M10 14a4 4 0 0 0 5.66 0l3-3a4 4 0 0 0-5.66-5.66l-1 1"/><path d="M14 10a4 4 0 0 0-5.66 0l-3 3a4 4 0 0 0 5.66 5.66l1-1"/></svg><span class="label">링크</span>
      </button>
      <button class="tool" id="share-btn" type="button" aria-label="공유하기">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 15V3"/><path d="m7 8 5-5 5 5"/><path d="M5 12v7a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2v-7"/></svg><span class="label">공유</span>
      </button>
    </div>
  </div>
</header>
<main>
<img class="page" src="weeklybest-detail.png" alt="크리에이터클럽 Weekly Best. 매주 총 50만원 상품권 증정. 작품 TOP 10과 크리에이터 TOP 10, 매주 월요일 0시에 새로 시작하고 일요일 밤 12시에 마감해요.">
</main>
<div class="toast" role="status" aria-live="polite"></div>
<script>
(() => {
  const $ = (s) => document.querySelector(s);
  const toast = $('.toast'); let t;
  const say = (m) => { toast.textContent = m; clearTimeout(t); t = setTimeout(() => { toast.textContent = ''; }, 2400); };
  const webUrl = (u) => { try { const x = new URL(u, location.href); return /^https?:$/.test(x.protocol) ? x.href.split('#')[0] : null; } catch { return null; } };
  const docUrl = () => { const c = $('link[rel="canonical"]')?.getAttribute('href'); return (c && webUrl(c)) || webUrl(location.href); };
  const NO_URL = '아직 배포 전 파일이라 공유할 주소가 없습니다. 배포한 페이지에서 눌러 주세요.';
  const metaOf = (sel) => $(sel)?.content || '';
  const legacyCopy = (v) => { const ta = document.createElement('textarea'); ta.value = v; ta.setAttribute('readonly', ''); ta.style.cssText = 'position:fixed;top:-9999px;opacity:0'; document.body.appendChild(ta); ta.select(); let ok = false; try { ok = document.execCommand('copy'); } catch { ok = false; } ta.remove(); return ok; };
  const copyText = (v) => (navigator.clipboard && window.isSecureContext) ? navigator.clipboard.writeText(v).then(() => true, () => legacyCopy(v)) : Promise.resolve(legacyCopy(v));
  $('#copy-btn').addEventListener('click', () => {
    if (!docUrl()) { say(NO_URL); return; }
    copyText(docUrl()).then((ok) => say(ok ? '링크를 복사했습니다.' : '복사하지 못했습니다. 주소창의 링크를 직접 복사해 주세요.'));
  });
  $('#share-btn').addEventListener('click', () => {
    if (!docUrl()) { say(NO_URL); return; }
    const data = { title: metaOf('meta[property="og:title"]') || document.title, text: metaOf('meta[property="og:description"]'), url: docUrl() };
    if (navigator.share && (!navigator.canShare || navigator.canShare(data))) {
      navigator.share(data).catch((e) => say(e && e.name === 'AbortError' ? '' : '공유하지 못했습니다. 링크 복사를 이용해 주세요.'));
    } else {
      copyText(docUrl()).then((ok) => say(ok ? '공유 기능이 없어 링크를 복사했습니다.' : '복사하지 못했습니다. 주소창의 링크를 직접 복사해 주세요.'));
    }
  });
})();
</script>
</body>
</html>
