<h1>정체성 편 첫 장 3컷 — 일상 사물 비틀기</h1>

</div>
<p class="n">세 컷 모두 이미지 생성으로 만든 가상 사진이에요. 게시용은 같은 구도로 실물을 만들어 찍어요. 내부 검토용이라 검색 노출은 막았어요.</p>
