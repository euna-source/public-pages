<!doctype html>
<html lang="ko"><head>
<meta name="robots" content="noindex, nofollow"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>샐리 크루</title>
<link rel="icon" href="p/icon-180.png"><link rel="apple-touch-icon" href="p/icon-180.png">
<style>
:root{--bg:#f7f4f0;--fg:#2b2626;--sub:#7a716c;--card:#fff}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#1b1918;--fg:#f2eeea;--sub:#a59c96;--card:#262321}}
body{margin:0;background:var(--bg);color:var(--fg);font-family:-apple-system,"Apple SD Gothic Neo",sans-serif}
main{max-width:880px;margin:0 auto;padding:24px 16px 48px}
h1{font-size:24px;margin:8px 0 4px}p{color:var(--sub);margin:0 0 20px}
.hero{width:100%;border-radius:20px;display:block}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:12px;margin-top:20px}
.c{background:var(--card);border-radius:16px;padding:12px;text-align:center}
.c img{width:100%;border-radius:50%;display:block}.c b{display:block;margin-top:8px}.c span{color:var(--sub);font-size:13px}
</style></head><body><main>
<h1>샐리 크루</h1><p>키키와 동생들, 레인·젠지·나나·루프의 프로필 사진이에요.</p>
<img class="hero" src="p/crew.png" alt="샐리 크루 단체 프로필">
<div class="grid">
<div class="c"><img src="p/kiki.png" alt=""><b>키키</b><span>비서·대장</span></div>
<div class="c"><img src="p/dodo.png" alt=""><b>도도</b><span>기획서</span></div>
<div class="c"><img src="p/coco.png" alt=""><b>코코</b><span>문구</span></div>
<div class="c"><img src="p/mimi.png" alt=""><b>미미</b><span>일정·회의록</span></div>
<div class="c"><img src="p/rain.png" alt=""><b>레인</b><span>지식</span></div>
<div class="c"><img src="p/genz.png" alt=""><b>젠지</b><span>콘텐츠</span></div>
<div class="c"><img src="p/nana.png" alt=""><b>나나</b><span>QA</span></div>
<div class="c"><img src="p/loop.png" alt=""><b>루프</b><span>점검</span></div>
</div></main></body></html>
