<!doctype html><html lang="ko"><head>
<meta name="robots" content="noindex, nofollow"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>위클리 베스트 캐러셀</title>
<style>
:root{--bg:#121212;--fg:#fff;--mut:#9a9a9a;--acc:#20EF35}
:root[data-theme="light"]{--bg:#121212}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#121212}}
:root[data-theme="dark"]{--bg:#121212}
*{box-sizing:border-box}html,body{margin:0;background:var(--bg);color:var(--fg);font-family:-apple-system,"Apple SD Gothic Neo",Pretendard,sans-serif}
main{max-width:480px;margin:0 auto;padding:20px 16px 32px}
h1{font-size:16px;margin:0 0 12px;font-weight:700}
.vp{position:relative}
.track{display:flex;overflow-x:auto;scroll-snap-type:x mandatory;scrollbar-width:none;border-radius:6px;-webkit-overflow-scrolling:touch}
.track::-webkit-scrollbar{display:none}
.track img{flex:0 0 100%;width:100%;aspect-ratio:4/5;object-fit:cover;scroll-snap-align:center;display:block;user-select:none;-webkit-user-drag:none}
.nav{position:absolute;top:50%;transform:translateY(-50%);width:34px;height:34px;border-radius:50%;border:0;background:rgba(255,255,255,.85);color:#121212;font-size:18px;cursor:pointer}
.nav:disabled{opacity:0;pointer-events:none}.prev{left:8px}.next{right:8px}
.cnt{position:absolute;top:10px;right:10px;background:rgba(0,0,0,.6);font-size:12px;padding:4px 9px;border-radius:999px}
.dots{display:flex;justify-content:center;gap:6px;margin-top:12px}
.dots i{width:6px;height:6px;border-radius:50%;background:#555}.dots i.on{background:var(--acc)}
.dl{display:flex;gap:8px;flex-wrap:wrap;margin-top:18px}
.dl a{flex:1 1 40%;text-align:center;font-size:13px;color:var(--fg);border:1px solid #333;border-radius:999px;padding:10px 0;text-decoration:none}
p{font-size:12px;color:var(--mut);margin:14px 0 0;line-height:1.5}
</style></head><body><main>
<h1>위클리 베스트 · 인스타 캐러셀 4장</h1>
<div class="vp"><div class="track" id="t">
<img src="slide1.jpg" alt="1장 표지 뽐내봐 여기는 크리에이터클럽 매주 즐거운 혜택, 10월 3주차 2026.10.19 - 10.25">
<img src="slide2.jpg" alt="2장 이번 주 총 50만 원 상당 상품권">
<img src="slide3.jpg" alt="3장 작품 부문">
<img src="slide4.jpg" alt="4장 크리에이터 부문"></div>
<button class="nav prev" id="p" aria-label="이전">‹</button><button class="nav next" id="n" aria-label="다음">›</button>
<span class="cnt" id="c">1 / 4</span></div>
<div class="dots" id="d"><i class="on"></i><i></i><i></i><i></i></div>
<div class="dl"><a href="slide1.jpg" download>1장 저장</a><a href="slide2.jpg" download>2장 저장</a><a href="slide3.jpg" download>3장 저장</a><a href="slide4.jpg" download>4장 저장</a></div>
<p>좌우로 밀거나 화살표를 눌러 넘겨 보세요. 각 장은 1080×1350(4:5)이에요.</p>
</main><script>
const t=document.getElementById('t'),n=4,c=document.getElementById('c'),ds=[...document.querySelectorAll('#d i')],p=document.getElementById('p'),x=document.getElementById('n');
const idx=()=>Math.round(t.scrollLeft/t.clientWidth);
function up(){const i=idx();c.textContent=(i+1)+' / '+n;ds.forEach((d,k)=>d.classList.toggle('on',k===i));p.disabled=i===0;x.disabled=i===n-1}
let tg=0,tm;t.addEventListener('scroll',()=>{clearTimeout(tm);tm=setTimeout(()=>{tg=idx()},120)});
const go=d=>{tg=Math.max(0,Math.min(n-1,tg+d));t.scrollTo({left:tg*t.clientWidth,behavior:'smooth'})};
p.onclick=()=>go(-1);x.onclick=()=>go(1);t.addEventListener('scroll',()=>requestAnimationFrame(up));
document.addEventListener('keydown',e=>{if(e.key==='ArrowLeft')go(-1);if(e.key==='ArrowRight')go(1)});up();
</script></body></html>
